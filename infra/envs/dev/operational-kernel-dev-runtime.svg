  <path class="muted" d="M1100 293 L1100 320" />

  <path class="arrow" d="M250 551 L300 551" />
  <path class="arrow" d="M155 582 L155 625" />
  <path class="arrow" d="M250 551 C285 600 475 645 530 652" />
  <path class="arrow" d="M500 551 L530 551" />
  <path class="arrow" d="M730 551 L760 551" />
  <path class="arrow" d="M960 551 L990 551" />
  <path class="arrow" d="M630 585 L630 625" />
  <path class="arrow" d="M730 652 L760 652" />
  <path class="arrow" d="M960 652 L990 652" />
  <path class="muted" d="M400 515 C420 450 500 395 515 308" />
  <path class="muted" d="M630 515 C600 450 545 395 515 308" />
  <path class="muted" d="M860 515 C820 450 580 395 515 308" />
  <path class="muted" d="M1095 515 C990 435 650 395 515 308" />

  <path class="dash" d="M550 780 L600 780" />
  <path class="dash" d="M725 755 C690 690 620 445 515 222" />
  <path class="dash" d="M850 780 L900 780" />

  <text x="700" y="426" class="tiny">Outbox and consumers must be idempotent, replay-safe, and observable before Goal 2 starts.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">goatos-dev operational kernel runtime</title>
  <desc id="desc">Google dev runtime for Goat OS vaccination and operational kernel components: admin web, API, Cloud SQL, outbox relay, Pub/Sub, domain consumer, scheduled jobs, Cloud Tasks, notification dispatcher, proof storage, and seed sources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070" />
    </marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a6d3b" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .zoneTitle { fill: #334155; font: 700 18px Arial, sans-serif; }
      .box { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; rx: 10; }
      .box2 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 10; }
      .box3 { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
      .box4 { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; rx: 10; }
      .box5 { fill: #fefce8; stroke: #eab308; stroke-width: 2; rx: 10; }
      .warn { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 10; }
      .label { fill: #0f172a; font: 700 15px Arial, sans-serif; }
      .small { fill: #334155; font: 12px Arial, sans-serif; }
      .tiny { fill: #475569; font: 11px Arial, sans-serif; }
      .arrow { stroke: #355070; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a6d3b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#dasharrow); }
      .muted { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860" />
  <text x="40" y="42" class="zoneTitle">goatos-dev operational kernel runtime</text>
  <text x="40" y="64" class="small">Expected Goal 2 topology after Goal 1 local vaccination/kernel closure is green. Verify live state before any apply.</text>

  <rect class="zone" x="30" y="90" width="310" height="250" />
  <text x="52" y="122" class="zoneTitle">User and app edge</text>
  <rect class="box" x="60" y="150" width="240" height="58" />
  <text x="82" y="176" class="label">Admin Web Cloud Run</text>
  <text x="82" y="194" class="small">goatos-admin-web-dev</text>
  <rect class="box" x="60" y="235" width="240" height="58" />
  <text x="82" y="261" class="label">API Cloud Run</text>
  <text x="82" y="279" class="small">goatos-api-dev</text>
  <rect class="box4" x="60" y="365" width="240" height="58" />
  <text x="82" y="391" class="label">Google Auth Platform</text>
  <text x="82" y="409" class="small">Mesha Workspace login</text>

  <rect class="zone" x="370" y="90" width="290" height="305" />
  <text x="392" y="122" class="zoneTitle">Canonical store</text>
  <rect class="box2" x="400" y="150" width="230" height="72" />
  <text x="422" y="177" class="label">Cloud SQL Postgres</text>
  <text x="422" y="195" class="small">goatos-dev-core-db</text>
  <text x="422" y="211" class="tiny">tenant data, obligations, inventory</text>
  <rect class="box2" x="400" y="250" width="230" height="58" />
  <text x="422" y="276" class="label">Outbox table</text>
  <text x="422" y="294" class="small">transactional domain events</text>
  <rect class="box4" x="400" y="330" width="230" height="44" />
  <text x="422" y="357" class="label">Secret Manager</text>

  <rect class="zone" x="690" y="90" width="550" height="305" />
  <text x="712" y="122" class="zoneTitle">Durable event spine</text>
  <rect class="box3" x="720" y="150" width="210" height="58" />
  <text x="742" y="176" class="label">Outbox Relay Job</text>
  <text x="742" y="194" class="small">GOATOS_OUTBOX_PUBLISHER=pubsub</text>
  <rect class="box3" x="995" y="150" width="210" height="58" />
  <text x="1017" y="176" class="label">Pub/Sub Topic</text>
  <text x="1017" y="194" class="small">goatos-dev-outbox-events</text>
  <rect class="box3" x="995" y="235" width="210" height="58" />
  <text x="1017" y="261" class="label">Domain Subscription</text>
  <text x="1017" y="279" class="small">goatos-dev-domain-events</text>
  <rect class="box3" x="720" y="235" width="210" height="58" />
  <text x="742" y="261" class="label">Domain Consumer Job</text>
  <text x="742" y="279" class="small">idempotent handlers</text>
  <rect class="warn" x="995" y="320" width="210" height="44" />
  <text x="1017" y="347" class="label">Outbox DLQ</text>

  <rect class="zone" x="30" y="455" width="1210" height="250" />
  <text x="52" y="487" class="zoneTitle">Scheduled kernel workers</text>
  <rect class="box5" x="60" y="520" width="190" height="62" />
  <text x="82" y="545" class="label">Cloud Scheduler</text>
  <text x="82" y="563" class="small">cron invokes Cloud Run jobs</text>
  <rect class="box3" x="300" y="515" width="200" height="70" />
  <text x="322" y="541" class="label">Vaccination Generator</text>
  <text x="322" y="559" class="small">creates due/deferred work</text>
  <rect class="box3" x="530" y="515" width="200" height="70" />
  <text x="552" y="541" class="label">Obligation Sweeper</text>
  <text x="552" y="559" class="small">missed, blocked, reminders</text>
  <rect class="box3" x="760" y="515" width="200" height="70" />
  <text x="782" y="541" class="label">Calendar Projector</text>
  <text x="782" y="559" class="small">read-model refresh</text>
  <rect class="box3" x="990" y="515" width="210" height="70" />
  <text x="1012" y="541" class="label">Reminder/Escalation</text>
  <text x="1012" y="559" class="small">sweepers enqueue near-term work</text>
  <rect class="box5" x="530" y="625" width="200" height="54" />
  <text x="552" y="649" class="label">Cloud Tasks Queue</text>
  <text x="552" y="667" class="small">goatos-dev-near-term-kernel</text>
  <rect class="box3" x="760" y="625" width="200" height="54" />
  <text x="782" y="649" class="label">Notification Dispatcher</text>
  <text x="782" y="667" class="small">dev-safe channels/stubs</text>
  <rect class="box4" x="990" y="625" width="210" height="54" />
  <text x="1012" y="649" class="label">Proof/Media Storage</text>
  <text x="1012" y="667" class="small">dev storage adapter path</text>
  <rect class="warn" x="60" y="625" width="410" height="54" />
  <text x="82" y="649" class="label">Aux workers to reconcile before dev-ready</text>
  <text x="82" y="667" class="small">inventory reconciler · outbox DLQ · idempotency sweeper</text>

  <rect class="zone" x="30" y="735" width="1210" height="90" />
  <text x="52" y="767" class="zoneTitle">Goal 2 seed and safety guard</text>
  <rect class="box4" x="300" y="755" width="250" height="50" />
  <text x="322" y="779" class="label">Live BQ / Sheets / Wiki</text>
  <text x="322" y="796" class="small">source-backed seed candidates only</text>
  <rect class="box2" x="600" y="755" width="250" height="50" />
  <text x="622" y="779" class="label">Clean-slate dev seed</text>
  <text x="622" y="796" class="small">&lt;=500 representative goats/sheds/stock</text>
  <rect class="warn" x="900" y="755" width="300" height="50" />
  <text x="922" y="779" class="label">Rollback / no prod effects</text>
  <text x="922" y="796" class="small">keep old dashboard reachable until E2E passes</text>


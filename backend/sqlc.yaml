version: "2"
sql:
  - engine: postgresql
    schema: internal/identity/adapters/postgres/sqlc/schema.sql
    queries: internal/identity/adapters/postgres/sqlc/query.sql
    gen:
      go:
        package: identitydb
        out: internal/identity/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: false

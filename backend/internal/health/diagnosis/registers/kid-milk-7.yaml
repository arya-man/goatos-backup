# Milk-drinking kids register (K0 colostrum, K1 milk-bar training, K2 free-choice).
# Do not copy adult/register.yaml. Do not load this for adults.
# Water sound is not on this form. Floppy kid = standing landing test (K1 and K2).
# Recumbent kids: IP dextrose then heat; milk if it sucks and is warmer than 100°F, else RL. Not floppy.
# Temperature cuts in ALGORITHM.md (milk-kid FEVER is ≥103.5°F, same band as adults).
register_version: kid-milk-7
status: locked
applies_class: [kid_milk]

non_specific:
  - eating:not_eating
  - milk_intake:not_drinking
  - milk_intake:reduced
  - activity:weak
  - skin_tent:2-4s
  - responsiveness:dull

vocabulary:
  - FEVER
  - HIGH_FEVER
  - HYPOTHERMIA
  - TENT_GT4
  - left_stomach:bloating
  - frothy_mouth
  - diarrhea
  - breathing:cough
  - breathing:labored
  - breathing:fast
  - breathing:pant
  - nasal_discharge
  - famacha:5
  - famacha:4
  - famacha:3
  - famacha:yellow
  - misc:competition
  - misc:stomach_inside
  - status:normal
  - stage:K0
  - stage:K1
  - stage:K2
  - activity:not_able_to_stand
  - activity:weak
  - activity:limping
  - eating:not_eating
  - milk_intake:not_drinking
  - milk_intake:reduced
  - landing:spiderman
  - landing:barely
  - landing:falls
  - landing:na
  - suckle:present
  - suckle:absent
  - navel:wet
  - navel:swollen
  - navel:painful
  - responsiveness:alert
  - responsiveness:dull
  - responsiveness:unresponsive
  - neuro:tremors
  - neuro:circling
  - neuro:head_tilt
  - neuro:blind
  - neuro:ataxia
  - neuro:seizure
  - mouth:orf_scabs
  - rash_character:nodular
  - rash_character:flat_itchy
  - rashes:present
  - eyes:cloudy
  - eyes:red
  - eyes:discharge
  - locked_jaw
  - leg:foot_rot
  - leg:fracture
  - leg:arthritis
  - leg:normal
  - flystrike
  - eartag:flystrike
  - eartag:wound
  - lumps:neck
  - lumps:body
  - wounds:present
  - wounds:neck
  - wounds:body
  - wounds:legs
  - skin_coat:ticks
  - skin_coat:hairloss_body
  - skin_coat:hairloss_neck
  - skin_coat:hairloss_legs
  - skin_tent:>4s
  - straining_urine:no_urine_passed
  - straining_urine:straining
  - sex:M
  - sex:F

rules:
  - id: BLOAT
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [left_stomach:bloating]
      - findings: [frothy_mouth]
    severity_base: 4
    acute_actionable: true
    treatment_risk: low
    exit_type: F
    sop_ref: Bloat
    containment: home

  - id: FLOPPY_KID
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    # Standing landing test (20 cm) only. Down kids are the refusal emergency, not floppy.
    gate_excluded: [FEVER, HYPOTHERMIA]
    pathognomonic:
      - findings: [landing:falls]
    probable:
      - findings: [landing:barely]
    severity_base: 4
    acute_actionable: true
    treatment_risk: low
    exit_type: F
    sop_ref: Floppy kid
    containment: home

  - id: HYPOTHERMIA
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [HYPOTHERMIA]
    severity_base: 4
    acute_actionable: true
    treatment_risk: low
    exit_type: F
    sop_ref: Hypothermia
    containment: home

  - id: NAVEL_ILL
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [navel:swollen]
      - findings: [navel:painful]
      - findings: [navel:wet]
    severity_base: 3
    severity_modifiers:
      - finding: activity:not_able_to_stand
        severity: 4
      - finding: HYPOTHERMIA
        severity: 4
    treatment_risk: low
    exit_type: F
    sop_ref: Navel ill
    containment: home
    explains_findings: [FEVER]
    suppresses: [FEVER]

  - id: DIARRHEA
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [diarrhea]
    severity_base: 2
    severity_modifiers:
      - finding: skin_tent:>4s
        severity: 4
    treatment_risk: low
    exit_type: F
    sop_ref: Diarrhea
    containment: home

  - id: FEVER
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    probable:
      - findings: [FEVER]
        residual: true
      - findings: [breathing:labored]
        residual: true
      - findings: [breathing:cough, nasal_discharge]
        residual: true
    possible:
      - findings: [breathing:fast]
        residual: true
      - findings: [breathing:cough]
        residual: true
    severity_base: 3
    severity_modifiers:
      - finding: HIGH_FEVER
        severity: 4
      - finding: breathing:labored
        severity: 4
    treatment_risk: low
    exit_type: F
    sop_ref: Fever
    containment: home
    recheck_id_possible: FEVER_POSSIBLE

  - id: HEAT_STRESS
    kind: problem
    human_selected_only: true
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    severity_base: 3
    exit_type: F
    sop_ref: Heat
    containment: home

  - id: ANEMIA
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [famacha:5]
      - findings: [famacha:4]
    possible:
      - findings: [famacha:3]
    severity_base: 3
    severity_modifiers:
      - finding: famacha:5
        severity: 4
    treatment_risk: low
    exit_type: T
    sop_ref: Anemia
    containment: home
    recheck_id_possible: FAMACHA3

  - id: JAUNDICE
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [famacha:yellow]
    severity_base: 3
    treatment_risk: low
    exit_type: F
    sop_ref: Jaundice
    containment: home

  - id: CALCULI
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M]
    applies_status: [any]
    gate_required: [sex:M]
    # Same adult lock: straining or no urine only. Rare on milk kids.
    pathognomonic:
      - findings: [straining_urine:no_urine_passed]
      - findings: [straining_urine:straining]
    severity_base: 4
    treatment_risk: high
    exit_type: F
    sop_ref: Calculi
    containment: home

  - id: PPR
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [FEVER, mouth:orf_scabs, diarrhea]
    probable:
      - findings: [FEVER, nasal_discharge, diarrhea]
      - findings: [FEVER, mouth:orf_scabs, nasal_discharge]
    possible:
      - findings: [FEVER, nasal_discharge, eyes:discharge]
    severity_base: 4
    treatment_risk: low
    exit_type: Supportive
    sop_ref: Supportive
    containment: quarantine
    explains_findings: [FEVER, diarrhea, mouth:orf_scabs, nasal_discharge]
    suppresses: [ORF, DIARRHEA, FEVER]

  - id: POX
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [rash_character:nodular]
    severity_base: 3
    severity_modifiers:
      - finding: activity:not_able_to_stand
        severity: 4
    treatment_risk: low
    exit_type: Supportive
    sop_ref: Supportive
    containment: quarantine
    explains_findings: [FEVER]
    suppresses: [SKIN]

  - id: ORF
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [mouth:orf_scabs]
    severity_base: 2
    treatment_risk: low
    exit_type: F
    sop_ref: ORF
    containment: quarantine

  - id: TETANUS
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [locked_jaw]
    probable:
      - findings: [neuro:tremors, wounds:present]
      - findings: [neuro:tremors, eartag:wound]
    severity_base: 4
    treatment_risk: low
    exit_type: F
    sop_ref: Tetanus
    containment: home

  - id: NEURO
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [neuro:circling]
      - findings: [neuro:head_tilt]
      - findings: [neuro:seizure]
    probable:
      - findings: [neuro:blind, neuro:ataxia]
      - findings: [neuro:blind, eating:not_eating]
    possible:
      - findings: [neuro:ataxia]
      - findings: [neuro:blind]
    severity_base: 4
    treatment_risk: low
    exit_type: F
    sop_ref: Neuro
    containment: home

  - id: FOOT_ROT
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [leg:foot_rot]
    severity_base: 2
    treatment_risk: low
    exit_type: V
    sop_ref: Foot rot
    containment: home

  - id: FRACTURE
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [leg:fracture]
    severity_base: 3
    treatment_risk: low
    exit_type: V
    sop_ref: Fracture
    containment: home

  - id: ARTHRITIS
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [leg:arthritis]
    severity_base: 2
    treatment_risk: low
    exit_type: V
    sop_ref: Arthritis
    containment: home

  - id: SKIN
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    gate_excluded: [rash_character:nodular]
    probable:
      - findings: [rash_character:flat_itchy]
      - findings: [skin_coat:hairloss_body]
      - findings: [skin_coat:hairloss_neck]
      - findings: [skin_coat:hairloss_legs]
    possible:
      - findings: [rashes:present]
    severity_base: 2
    treatment_risk: low
    exit_type: V
    sop_ref: Skin
    containment: home

  - id: FLYSTRIKE
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [flystrike]
      - findings: [eartag:flystrike]
    severity_base: 3
    treatment_risk: low
    exit_type: V
    sop_ref: Flystrike
    containment: home
    explains_findings: [wounds:present, wounds:body, wounds:neck, wounds:legs, eartag:wound]
    suppresses: [WOUNDS]

  - id: LUMPS
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [lumps:neck]
      - findings: [lumps:body]
    severity_base: 2
    treatment_risk: low
    exit_type: V
    sop_ref: Lumps
    containment: home

  - id: WOUNDS
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    probable:
      - findings: [wounds:neck]
        residual: true
      - findings: [wounds:body]
        residual: true
      - findings: [wounds:legs]
        residual: true
      - findings: [eartag:wound]
        residual: true
    severity_base: 2
    treatment_risk: low
    exit_type: V
    sop_ref: Wounds
    containment: home

  - id: PINKEYE
    kind: problem
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [eyes:cloudy]
    probable:
      - findings: [eyes:red, eyes:discharge]
    possible:
      - findings: [eyes:red]
      - findings: [eyes:discharge]
        residual: true
    severity_base: 2
    treatment_risk: low
    exit_type: F
    sop_ref: Pinkeye
    containment: home
    recheck_id_possible: PINKEYE_POSSIBLE

  - id: TICKS
    kind: field
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [skin_coat:ticks]
    severity_base: 1
    treatment_risk: low
    exit_type: field
    sop_ref: Field
    containment: home

  - id: HOOF
    kind: field
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [activity:limping, leg:normal]
    severity_base: 1
    treatment_risk: low
    exit_type: field
    sop_ref: Field
    containment: home

  - id: ANTIHISTAMINE
    kind: field
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [nasal_discharge]
    severity_base: 1
    treatment_risk: low
    exit_type: field
    sop_ref: Field
    containment: home
    adjunct_when: [FEVER, PPR]

  - id: SEPARATE_FEEDING
    kind: field
    applies_species: [goat, sheep]
    applies_sex: [M, F]
    applies_status: [any]
    pathognomonic:
      - findings: [misc:competition]
    severity_base: 1
    treatment_risk: low
    exit_type: field
    sop_ref: Field
    containment: home

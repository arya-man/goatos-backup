options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

serviceAccount: projects/goatos-stg/serviceAccounts/goatos-github-deploy-stg@goatos-stg.iam.gserviceaccount.com

substitutions:
  _COMMIT_SHA: ""
  _SLACK_WEBHOOK_SECRET: goatos-stg-deploy-slack-webhook-url
  _DEPLOY_STG: "true"
  _DEPLOY_MOBILE: "false"
  _SLACK_USER_ID: ""
  _TRIGGERED_BY: "unknown Slack user"

steps:
  - id: notify-slack-started
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - COMMIT_SHA=${_COMMIT_SHA}
      - BUILD_ID=$BUILD_ID
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
    args:
      - -ceu
      - |
        webhook="$$(gcloud secrets versions access latest --project="$${PROJECT_ID}" --secret="$${SLACK_WEBHOOK_SECRET}" 2>/dev/null || true)"
        if [[ -z "$${webhook}" ]]; then
          echo "Slack deploy webhook is not configured; Cloud Build logs remain the source of truth."
          exit 0
        fi
        tag="$$(printf '%s' "$${COMMIT_SHA}" | cut -c1-12)"
        build_url="https://console.cloud.google.com/cloud-build/builds/$${BUILD_ID}?project=$${PROJECT_NUMBER}"
        python3 - "$${tag}" "$${BUILD_ID}" "$${TRIGGERED_BY}" "$${DEPLOY_STG}" "$${DEPLOY_MOBILE}" "$${build_url}" <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "$webhook" >/dev/null || true
        import json
        import sys

        sha, build_id, triggered_by, deploy_stg, deploy_mobile, build_url = sys.argv[1:]
        modes = []
        if deploy_stg == "true":
            modes.append("backend/web")
        if deploy_mobile == "true":
            modes.append("Android mobile")
        mode_text = " + ".join(modes) or "no deploy targets"
        payload = {
            "attachments": [{
                "color": "#439FE0",
                "title": "GoatOS deploy build started",
                "text": f"Cloud Build started for {mode_text}. Image builds may run before Cloud Deploy creates a release.",
                "fields": [
                    {"title": "Commit", "value": sha, "short": True},
                    {"title": "Build", "value": build_id, "short": True},
                    {"title": "Triggered by", "value": triggered_by, "short": False},
                ],
                "actions": [{"type": "button", "text": "Cloud Build logs", "url": build_url}],
            }]
        }
        print(json.dumps(payload))
        PY

  - id: configure-docker-auth
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - DOCKER_CONFIG=/workspace/.docker
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Docker auth not requested."
          exit 0
        fi
        umask 077
        mkdir -p /workspace/.docker
        gcloud auth print-access-token > /workspace/.docker/access-token

  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - COMMIT_SHA=${_COMMIT_SHA}
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Backend image build not requested."
          exit 0
        fi
        tag="$(printf '%s' "$${COMMIT_SHA}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/backend:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        docker build --platform linux/amd64 --build-arg GIT_SHA="$${tag}" -f backend/Dockerfile -t "$${image}" .
        docker push "$${image}"

  - id: build-migration-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - COMMIT_SHA=${_COMMIT_SHA}
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Migration image build not requested."
          exit 0
        fi
        tag="$(printf '%s' "$${COMMIT_SHA}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/migrate:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        docker build --platform linux/amd64 --build-arg GIT_SHA="$${tag}" -f backend/Dockerfile.migrate -t "$${image}" .
        docker push "$${image}"

  - id: build-admin-web-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - COMMIT_SHA=${_COMMIT_SHA}
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Admin web image build not requested."
          exit 0
        fi
        tag="$(printf '%s' "$${COMMIT_SHA}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/admin-web:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        docker build --platform linux/amd64 -f apps/admin-web/Dockerfile -t "$${image}" .
        docker push "$${image}"

  - id: stg-cloud-deploy-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - COMMIT_SHA=${_COMMIT_SHA}
      - BUILD_ID=$BUILD_ID
      - ARTIFACT_REPOSITORY=goatos
      - DELIVERY_PIPELINE=goatos-stg
      - TARGET_ID=goatos-stg
      - GOATOS_STG_RELEASE_WAIT=1
      - GOATOS_SKIP_IMAGE_BUILD=1
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - TRIGGERED_BY=${_TRIGGERED_BY}
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_STG}" != "true" ]]; then
          echo "STG Cloud Deploy release not requested."
          exit 0
        fi
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl dnsutils git python3
        tools/deploy/stg-cloudbuild-release.sh

  - id: stg-release-tag-bookkeeping
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - BUILD_ID=$BUILD_ID
      - COMMIT_SHA=${_COMMIT_SHA}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_STG}" != "true" ]]; then
          echo "STG release tag bookkeeping not requested."
          exit 0
        fi
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git python3
        tools/deploy/stg-release-tag-bookkeeping.sh

  - id: android-mobile-distribution
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - BUILD_ID=$BUILD_ID
      - COMMIT_SHA=${_COMMIT_SHA}
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
      - GOOGLE_PLAY_PACKAGE=sg.mesha.goatos
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_MOBILE}" != "true" ]]; then
          echo "Android mobile distribution not requested."
          exit 0
        fi
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git jq make openjdk-21-jdk openssl unzip
        tools/deploy/stg-mobile-distribution.sh

timeout: 7200s

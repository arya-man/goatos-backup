options:
  logging: CLOUD_LOGGING_ONLY
  # 32 vCPU / 32 GB: the four image builds and the Android Gradle build now run
  # concurrently (waitFor below). See docs/progress/ci-deploy-speedup.md for
  # the cost tradeoff (higher per-minute price, far fewer minutes).
  machineType: E2_HIGHCPU_32
  substitutionOption: ALLOW_LOOSE

serviceAccount: projects/goatos-stg/serviceAccounts/goatos-github-deploy-stg@goatos-stg.iam.gserviceaccount.com

substitutions:
  _COMMIT_SHA: ""
  _SLACK_WEBHOOK_SECRET: goatos-stg-deploy-slack-webhook-url
  _DEPLOY_STG: "true"
  _DEPLOY_MOBILE: "false"
  _GOATOS_STG_ZERO_DOWNTIME_DEPLOY: "true"
  _SLACK_USER_ID: ""
  _TRIGGERED_BY: "unknown Slack user"
  # Ask Mesha coding agent (tools/ask-mesha-agent). Off until the one-time infra in
  # tools/ask-mesha-agent/deploy/RUNBOOK.md exists; the Slack bot never sets these,
  # so existing backend/web/mobile deploys are unchanged. Set "true" per build.
  _ASK_MESHA_DEPLOY: "false"
  # The agent runs Gemini on Vertex AI with its runtime SA (no model key). Empty = default model.
  _ASK_MESHA_MODEL: ""
  # Additionally point goatos-admin-web-stg at the agent (CEO_AI_AGENT_URL/AUDIENCE).
  _ASK_MESHA_WIRE_ADMIN_WEB: "false"
  # Additionally point the hosted MCP (goatos-mcp-stg) ask_goatos at the agent
  # (MESHA_MCP_AGENT_URL/AUDIENCE, --timeout=300, roles/run.invoker for its runtime SA).
  _ASK_MESHA_WIRE_MCP: "false"
  # Optional gs:// prefix for a Gradle user-home cache tarball (keyed by wrapper
  # + version catalog hash). Empty = no cache (previous behaviour).
  _GRADLE_CACHE_URI: ""

steps:
  - id: notify-slack-started
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - BUILD_ID=$BUILD_ID
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
    args:
      - -ceu
      - |
        webhook="$$(gcloud secrets versions access latest --project="$${PROJECT_ID}" --secret="$${SLACK_WEBHOOK_SECRET}" 2>/dev/null || true)"
        if [[ -z "$${webhook}" ]]; then
          echo "Slack deploy webhook is not configured; Cloud Build logs remain the source of truth."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        build_url="https://console.cloud.google.com/cloud-build/builds/$${BUILD_ID}?project=$${PROJECT_NUMBER}"
        python3 - "$${tag}" "$${BUILD_ID}" "$${TRIGGERED_BY}" "$${DEPLOY_STG}" "$${DEPLOY_MOBILE}" "$${build_url}" <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "$webhook" >/dev/null || true
        import json
        import sys

        sha, build_id, triggered_by, deploy_stg, deploy_mobile, build_url = sys.argv[1:]
        modes = []
        if deploy_stg == "true":
            modes.append("backend/web")
        if deploy_mobile == "true":
            modes.append("Android mobile")
        mode_text = " + ".join(modes) or "no deploy targets"
        payload = {
            "attachments": [{
                "color": "#439FE0",
                "title": "GoatOS deploy build started",
                "text": f"Cloud Build started for {mode_text}. Image builds may run before Cloud Deploy creates a release.",
                "fields": [
                    {"title": "Commit", "value": sha, "short": True},
                    {"title": "Build", "value": build_id, "short": True},
                    {"title": "Triggered by", "value": triggered_by, "short": False},
                ],
                "actions": [{"type": "button", "text": "Cloud Build logs", "url": build_url}],
            }]
        }
        print(json.dumps(payload))
        PY

  - id: configure-docker-auth
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - DOCKER_CONFIG=/workspace/.docker
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Docker auth not requested."
          exit 0
        fi
        umask 077
        mkdir -p /workspace/.docker
        gcloud auth print-access-token > /workspace/.docker/access-token

  - id: build-backend-image
    waitFor: ['configure-docker-auth']
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Backend image build not requested."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/backend:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        tools/deploy/stg-image-build.sh "$${image}" backend/Dockerfile --build-arg GIT_SHA="$${tag}"

  - id: build-migration-image
    waitFor: ['configure-docker-auth']
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Migration image build not requested."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/migrate:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        tools/deploy/stg-image-build.sh "$${image}" backend/Dockerfile.migrate --build-arg GIT_SHA="$${tag}"

  - id: build-admin-web-image
    waitFor: ['configure-docker-auth']
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ]; then
          echo "Admin web image build not requested."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/admin-web:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        tools/deploy/stg-image-build.sh "$${image}" apps/admin-web/Dockerfile \
          --build-arg NEXT_PUBLIC_FIREBASE_PERFORMANCE_ENABLED=1 \
          --build-arg NEXT_PUBLIC_FARO_COLLECTOR_URL=https://goatos-stg-grafana-alloy-awtrpmn4za-el.a.run.app/collect \
          --build-arg NEXT_PUBLIC_GOATOS_ENV=stg \
          --build-arg NEXT_PUBLIC_APP_VERSION="$${tag}"

  - id: build-ask-mesha-agent-image
    waitFor: ['configure-docker-auth']
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DEPLOY_STG=${_DEPLOY_STG}
      - ASK_MESHA_DEPLOY=${_ASK_MESHA_DEPLOY}
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DOCKER_CONFIG=/workspace/.docker
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        if [ "$${DEPLOY_STG}" != "true" ] || [ "$${ASK_MESHA_DEPLOY}" != "true" ]; then
          echo "Ask Mesha agent image build not requested."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/ask-mesha-agent:$${tag}"
        docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev < /workspace/.docker/access-token
        # BuildKit reads tools/ask-mesha-agent/Dockerfile.dockerignore for this image only.
        tools/deploy/stg-image-build.sh "$${image}" tools/ask-mesha-agent/Dockerfile --build-arg GIT_SHA="$${tag}"

  - id: stg-cloud-deploy-release
    waitFor: ['build-backend-image', 'build-migration-image', 'build-admin-web-image', 'build-ask-mesha-agent-image']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - BUILD_ID=$BUILD_ID
      - ARTIFACT_REPOSITORY=goatos
      - DELIVERY_PIPELINE=goatos-stg
      - TARGET_ID=goatos-stg
      - GOATOS_STG_RELEASE_WAIT=1
      - GOATOS_SKIP_IMAGE_BUILD=1
      - GOATOS_STG_ZERO_DOWNTIME_DEPLOY=${_GOATOS_STG_ZERO_DOWNTIME_DEPLOY}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - TRIGGERED_BY=${_TRIGGERED_BY}
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_STG}" != "true" ]]; then
          echo "STG Cloud Deploy release not requested."
          exit 0
        fi
        export COMMIT_SHA="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl dnsutils git google-cloud-cli-cloud-run-proxy nodejs python3
        tools/deploy/stg-cloudbuild-release.sh

  - id: stg-release-tag-bookkeeping
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - BUILD_ID=$BUILD_ID
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_STG}" != "true" ]]; then
          echo "STG release tag bookkeeping not requested."
          exit 0
        fi
        export COMMIT_SHA="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git python3
        tools/deploy/stg-release-tag-bookkeeping.sh

  - id: deploy-ask-mesha-agent
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - REGION=asia-south1
      - DEPLOY_STG=${_DEPLOY_STG}
      - ASK_MESHA_DEPLOY=${_ASK_MESHA_DEPLOY}
      - ASK_MESHA_WIRE_ADMIN_WEB=${_ASK_MESHA_WIRE_ADMIN_WEB}
      - ASK_MESHA_WIRE_MCP=${_ASK_MESHA_WIRE_MCP}
      - ASK_MESHA_MODEL=${_ASK_MESHA_MODEL}
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_STG}" != "true" || "$${ASK_MESHA_DEPLOY}" != "true" ]]; then
          echo "Ask Mesha agent deploy not requested."
          exit 0
        fi
        commit_sha="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        tag="$$(printf '%s' "$${commit_sha}" | cut -c1-12)"
        export COMMIT_TAG="$${tag}"
        export ASK_MESHA_IMAGE="asia-south1-docker.pkg.dev/goatos-stg/goatos/ask-mesha-agent:$${tag}"
        tools/ask-mesha-agent/deploy/deploy-stg.sh

  # Android build runs CONCURRENTLY with the image builds and rollout. It never
  # fails the Cloud Build step (a failure is recorded in a marker file) so it
  # cannot cancel an in-flight backend/web rollout; the publish step below,
  # which runs only after the backend/web rollout, re-raises it.
  - id: android-mobile-build
    waitFor: ['-']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - BUILD_ID=$BUILD_ID
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
      - GOOGLE_PLAY_PACKAGE=sg.mesha.goatos
      - GOATOS_MOBILE_PHASE=build
      - GRADLE_USER_HOME=/workspace/.gradle-home
      - GOATOS_GRADLE_CACHE_URI=${_GRADLE_CACHE_URI}
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_MOBILE}" != "true" ]]; then
          echo "Android mobile distribution not requested."
          exit 0
        fi
        export COMMIT_SHA="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        # ANY failure here (apt, SDK, signing restore, Gradle) must not fail
        # this step: a failed step cancels the concurrent backend/web rollout.
        # It is recorded instead; android-mobile-distribution re-raises it
        # after the rollout, and a missing "ok <sha>" marker also refuses.
        set +e
        (
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq make openjdk-21-jdk-headless openssl unzip
          tools/deploy/stg-mobile-distribution.sh
        )
        rc=$$?
        set -e
        if [[ "$${rc}" -ne 0 ]]; then
          mkdir -p .local/android-mobile-build
          printf 'failed %s rc=%s\n' "$$(printf '%s' "$${COMMIT_SHA}" | cut -c1-12)" "$${rc}" > .local/android-mobile-build/status
          echo "Android build phase failed (rc=$${rc}); android-mobile-distribution will fail after the backend/web rollout."
        fi
        exit 0

  - id: android-mobile-distribution
    waitFor: ['android-mobile-build', 'stg-release-tag-bookkeeping', 'deploy-ask-mesha-agent']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    env:
      - PROJECT_ID=goatos-stg
      - PROJECT_NUMBER=514832198871
      - REGION=asia-south1
      - BUILD_ID=$BUILD_ID
      - REQUESTED_COMMIT_SHA=${_COMMIT_SHA}
      - RESOLVED_COMMIT_SHA=$REVISION_ID
      - DEPLOY_STG=${_DEPLOY_STG}
      - DEPLOY_MOBILE=${_DEPLOY_MOBILE}
      - SLACK_WEBHOOK_SECRET=${_SLACK_WEBHOOK_SECRET}
      - TRIGGERED_BY=${_TRIGGERED_BY}
      - GOOGLE_PLAY_PACKAGE=sg.mesha.goatos
      - GOATOS_MOBILE_PHASE=publish
      - GRADLE_USER_HOME=/workspace/.gradle-home
      - GOATOS_GRADLE_CACHE_URI=${_GRADLE_CACHE_URI}
    args:
      - -ceu
      - |
        if [[ "$${DEPLOY_MOBILE}" != "true" ]]; then
          echo "Android mobile distribution not requested."
          exit 0
        fi
        export COMMIT_SHA="$${REQUESTED_COMMIT_SHA:-$${RESOLVED_COMMIT_SHA}}"
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git jq make openjdk-21-jdk-headless openssl unzip
        tools/deploy/stg-mobile-distribution.sh
timeout: 7200s

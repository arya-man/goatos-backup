<title>Mesha Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.54.1/apexcharts.min.js"></script>
<style>
/* ===== Mesha brand tokens (locked, from admin-web mesha-theme.css) ===== */
:root{color-scheme:light;
  --brand:#54A02C;--brand-d:#44831F;--brand-l:#7CCB45;--brand-soft:#ECF7E0;--on-brand:#FFFFFF;
  --bg:#F4F7F2;--panel:#FFFFFF;--panel-2:#F1F5EF;--ink:#16201B;--muted:#5E6E64;--faint:#8A998F;
  --line:#E2E8E1;--line2:#EEF2ED;--sidebar:#FFFFFF;
  --info:#2B66B8;--info-s:#E5EFFB;--warn:#B5791A;--warn-s:#FBF1DE;--err:#CC3D3D;--err-s:#FBE6E6;
  --ok:#3F9A28;--ok-s:#ECF7E0;--violet:#7A5BD1;--violet-s:#EDE7FB;--teal:#13816F;--teal-s:#DEF3EF;
  --shadow:0 0 2px 0 rgba(22,32,27,.14),0 12px 24px -4px rgba(22,32,27,.08);
  --shadow-lg:0 0 2px 0 rgba(22,32,27,.2),0 24px 48px -8px rgba(22,32,27,.18);
  --hero:linear-gradient(135deg,#44831F,#2E5E16);
  --f:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fd:"Barlow","Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --brand:#7CCB45;--brand-d:#69BA37;--brand-l:#A6E07A;--brand-soft:rgba(124,203,69,.15);--on-brand:#08130B;
  --bg:#0E1512;--panel:#161F1A;--panel-2:#1D2820;--ink:#E9F1EA;--muted:#94A89A;--faint:#6E8377;
  --line:#26332B;--line2:#1C261F;--sidebar:#111A15;
  --info:#5B9BE8;--info-s:rgba(91,155,232,.16);--warn:#E0A53A;--warn-s:rgba(224,165,58,.16);--err:#F0635F;--err-s:rgba(240,99,95,.16);
  --ok:#7CCB45;--ok-s:rgba(124,203,69,.16);--violet:#A78BF5;--violet-s:rgba(167,139,245,.16);--teal:#34C2A6;--teal-s:rgba(52,194,166,.16);
  --shadow:0 0 2px 0 rgba(0,0,0,.3),0 12px 24px -4px rgba(0,0,0,.34);--shadow-lg:0 0 2px 0 rgba(0,0,0,.4),0 24px 48px -8px rgba(0,0,0,.5);
  --hero:linear-gradient(135deg,#3E7A1E,#1F3F10)}}
:root[data-theme="dark"]{color-scheme:dark;
  --brand:#7CCB45;--brand-d:#69BA37;--brand-l:#A6E07A;--brand-soft:rgba(124,203,69,.15);--on-brand:#08130B;
  --bg:#0E1512;--panel:#161F1A;--panel-2:#1D2820;--ink:#E9F1EA;--muted:#94A89A;--faint:#6E8377;
  --line:#26332B;--line2:#1C261F;--sidebar:#111A15;
  --info:#5B9BE8;--info-s:rgba(91,155,232,.16);--warn:#E0A53A;--warn-s:rgba(224,165,58,.16);--err:#F0635F;--err-s:rgba(240,99,95,.16);
  --ok:#7CCB45;--ok-s:rgba(124,203,69,.16);--violet:#A78BF5;--violet-s:rgba(167,139,245,.16);--teal:#34C2A6;--teal-s:rgba(52,194,166,.16);
  --shadow:0 0 2px 0 rgba(0,0,0,.3),0 12px 24px -4px rgba(0,0,0,.34);--shadow-lg:0 0 2px 0 rgba(0,0,0,.4),0 24px 48px -8px rgba(0,0,0,.5);
  --hero:linear-gradient(135deg,#3E7A1E,#1F3F10)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.57 var(--f);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Top bar of the prototype page ===== */
.top{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 12px}
.top .lg{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:800 16px var(--fd)}
.top h1{margin:0;font:700 19px var(--fd);letter-spacing:.2px}
.top small{display:block;color:var(--muted);font-size:12.5px}
.ttabs{display:flex;gap:4px;background:var(--panel);box-shadow:var(--shadow);border-radius:12px;padding:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
@media (max-width:720px){.ttabs{mask-image:linear-gradient(90deg,#000 85%,transparent)}.ttabs button{padding:8px 10px}}
.ttabs button{border:0;background:none;border-radius:8px;padding:8px 14px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.ttabs button svg{width:18px;height:18px}
.ttabs button.on{background:var(--brand-soft);color:var(--brand-d)}
.tact{display:flex;gap:6px}
.stage{max-width:1480px;margin:0 auto}
@media (max-width:720px){.top{gap:10px}.ttabs{order:3;width:100%;margin-left:0}.top small{display:none}}

/* ===== App instance (container queries => same code desktop & phone) ===== */
.app{container:app/inline-size;position:relative;background:var(--bg);border-radius:20px;box-shadow:var(--shadow);overflow:clip;min-height:760px}
.lay{display:flex;min-height:760px}
.snav{width:300px;flex:none;background:var(--sidebar);border-right:1px dashed var(--line);display:flex;flex-direction:column;padding:20px 16px;gap:2px}
.snav .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font:800 17px var(--fd)}
.snav .brand i{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal}
.snav .who{display:flex;gap:12px;align-items:center;background:var(--panel-2);border-radius:12px;padding:12px 14px;margin:0 4px 10px}
.snav .who b{display:block;font-size:14px;line-height:1.3}.snav .who small{color:var(--muted);font-size:12px}
.nsub{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:14px;min-height:44px;padding:4px 12px;border-radius:8px;border:0;background:none;width:100%;text-align:left;color:var(--muted);font-weight:500}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand-d);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:20px}
.mw{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:72px;display:flex;align-items:center;gap:10px;padding:0 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.hdr .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib .bdg{position:absolute;top:4px;right:3px;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:17px;line-height:17px;padding:0 4px}
.ham{display:none}
.ws{display:flex;align-items:center;gap:8px;border:0;background:var(--panel);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px 6px 6px;font-weight:600;font-size:13px;max-width:100%}
.ws select{border:0;background:none;font-weight:600;max-width:220px;padding:2px 0;cursor:pointer}
.ws .tagx{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.srch{display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:var(--shadow);border-radius:10px;padding:8px 12px;color:var(--faint);font-size:13px;min-width:200px}
.srch kbd{margin-left:auto;font:600 11px var(--f);background:var(--panel-2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--brand-soft);color:var(--brand-d)}
.av.sm{width:36px;height:36px;font-size:13px}
.ring{padding:2px;border-radius:50%;background:conic-gradient(var(--brand),var(--teal),var(--brand-l),var(--brand))}
.ring .av{border:2px solid var(--panel);background:var(--panel)}
.pg{padding:8px 40px 64px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 28px}
.ph h2{margin:0 0 6px;font:700 24px var(--fd);letter-spacing:.2px;text-wrap:balance}
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink)}
.crumbs button{border:0;background:none;padding:0;color:var(--ink)}
.crumbs button:hover{text-decoration:underline}
.crumbs i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.crumbs span{color:var(--faint)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;font-weight:700;font-size:14px;min-height:36px;padding:6px 14px;background:var(--brand);color:var(--on-brand);white-space:nowrap}
.btn:hover{background:var(--brand-d);box-shadow:0 8px 16px -4px color-mix(in srgb,var(--brand) 40%,transparent)}
.btn.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--faint) 45%,transparent)}
.btn.o:hover{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.s{background:var(--brand-soft);color:var(--brand-d)}.btn.s:hover{background:color-mix(in srgb,var(--brand) 22%,transparent);box-shadow:none}
.btn.t{background:none;color:var(--muted);padding:6px 8px}.btn.t:hover{background:var(--panel-2);box-shadow:none;color:var(--ink)}
.btn.d{background:var(--err);color:#fff}.btn.do{background:none;color:var(--err);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 45%,transparent)}
.btn.lg{min-height:48px;font-size:15px;padding:8px 22px}
.btn.sm{min-height:30px;font-size:13px;padding:4px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg.i{width:18px;height:18px}
.card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);min-width:0;position:relative}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:24px}
.grid>.card,.grid>.hero{margin-top:0!important}
.grid{align-items:start}
.ch{display:flex;align-items:flex-start;gap:10px;padding:24px 24px 0;flex-wrap:wrap}
.ch h3{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.ch p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.cb{padding:24px}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g83{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g38{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.lbl{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.l-ok{background:var(--ok-s);color:var(--ok)}.l-warn{background:var(--warn-s);color:var(--warn)}.l-err{background:var(--err-s);color:var(--err)}
.l-info{background:var(--info-s);color:var(--info)}.l-vio{background:var(--violet-s);color:var(--violet)}.l-teal{background:var(--teal-s);color:var(--teal)}
.l-def{background:var(--panel-2);color:var(--muted)}.l-brand{background:var(--brand);color:var(--on-brand)}
/* widget summary */
.ws1{padding:24px;display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:end}
.ws1 .t{font-size:14px;font-weight:600;grid-column:1/-1}
.ws1 .v{font:700 30px/1.3 var(--fd);margin-top:10px;letter-spacing:.2px}
.ws1 .d{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.trend{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.trend.up{color:var(--ok)}.trend.dn{color:var(--err)}
.ws1 .sp1{width:84px;height:56px}
/* hero balance card */
.hero{background:var(--hero);color:#fff;border-radius:16px;padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .t{font-size:14px;opacity:.82;font-weight:600}
.hero .v{font:700 40px/1.2 var(--fd);margin:8px 0 4px;letter-spacing:.3px}
.hero .s{opacity:.8;font-size:13px}
.hero .row{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1}
.hero .row b{display:block;font:700 18px var(--fd)}.hero .row span{opacity:.75;font-size:12.5px}
.hero .chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border-radius:6px;padding:2px 8px;font-weight:700;font-size:12.5px}
/* tables */
.tabs{display:flex;gap:28px;padding:0 20px;box-shadow:inset 0 -2px 0 var(--line2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tbar{display:flex;gap:12px;padding:20px;flex-wrap:wrap;align-items:center}
.tbar .grow{flex:1;min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--panel-2);color:var(--muted);font-weight:600;text-align:left;padding:16px;white-space:nowrap;font-size:13.5px}
td{padding:16px;border-bottom:1px dashed var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
th.r,td.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.dense td{padding:10px 16px}
.nm{display:flex;align-items:center;gap:14px;min-width:0}
.nm b{display:block;font-weight:600}.nm small{display:block;color:var(--faint);font-size:13px}
.tfoot{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:10px 16px;font-size:13.5px;color:var(--ink);flex-wrap:wrap}
.tfoot select{border:0;background:none;font-weight:600}
.tfoot .dz{margin-right:auto;display:flex;align-items:center;gap:8px}
.tfoot>span:last-child{display:inline-flex;gap:4px;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:4px}
/* text fields */
.tf{position:relative;display:block;min-width:0}
.tf>span{position:absolute;top:-9px;left:10px;padding:0 5px;background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);line-height:18px;pointer-events:none;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.tf input,.tf select,.tf textarea{width:100%;background:none;border:1px solid color-mix(in srgb,var(--faint) 45%,transparent);border-radius:8px;padding:15px 14px 13px;min-height:54px;outline:0;transition:border-color .15s}
.tf select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.tf input:hover,.tf select:hover{border-color:var(--ink)}
.tf input:focus,.tf select:focus,.tf textarea:focus{border:2px solid var(--ink);padding:14px 13px 12px}
.tf input[disabled],.tf select[disabled]{opacity:.6;cursor:not-allowed}
.tf em{display:block;font-style:normal;font-size:12px;color:var(--faint);margin:6px 14px 0}
.tf.err input,.tf.err select{border-color:var(--err)}.tf.err em{color:var(--err)}
.tf.sm input,.tf.sm select{min-height:40px;padding:8px 12px}.tf.sm input:focus{padding:7px 11px}
.tf.sm select{background-position:calc(100% - 20px) 17px,calc(100% - 14px) 17px}
.srchf{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--faint) 45%,transparent);border-radius:8px;padding:0 12px;min-height:54px;color:var(--faint)}
.srchf input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink);height:52px}
.srchf:focus-within{border:2px solid var(--ink);padding:0 11px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
.fgrid .full{grid-column:1/-1}
.fsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;margin-bottom:32px}
.fsec>.dsc h4{margin:0 0 6px;font-size:17px}.fsec>.dsc p{margin:0;color:var(--muted);font-size:14px}
/* switch */
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;user-select:none}
.sw input{appearance:none;width:34px;height:20px;border-radius:10px;background:color-mix(in srgb,var(--faint) 50%,transparent);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:4px;left:4px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--brand)}.sw input:checked::after{transform:translateX(14px)}
.sw input[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;border:0;background:var(--panel-2);color:var(--muted);min-height:32px}
.chip.on{background:var(--brand-soft);color:var(--brand-d)}
.chip[disabled]{opacity:.5;cursor:not-allowed}
/* misc */
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.al{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:12px 16px;font-size:14px}
.al svg.i{margin-top:1px}
.al.info{background:var(--info-s);color:var(--info)}.al.warn{background:var(--warn-s);color:var(--warn)}.al.err{background:var(--err-s);color:var(--err)}.al.ok{background:var(--ok-s);color:var(--ok)}
.al b{font-weight:700}.al .x{margin-left:auto}
.calc{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border-radius:10px;padding:12px 14px;line-height:1.8;overflow-x:auto}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600}.li .tx small{color:var(--faint);font-size:13px}
.li .v{font-weight:700;text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--muted)}.faint{color:var(--faint)}.up{color:var(--ok)}.dn{color:var(--err)}
.x403{text-align:center;padding:80px 20px}.x403 h2{font:700 28px var(--fd);margin:0 0 8px}.x403 p{color:var(--muted);max-width:44ch;margin:0 auto 20px}
.x403 .big{font:800 96px/1 var(--fd);color:var(--brand-soft);-webkit-text-stroke:2px var(--brand)}
.pcard{padding:20px;display:flex;flex-direction:column;gap:12px;border:0;text-align:left;width:100%;background:var(--panel)}
button.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.inv{padding:40px}.inv .hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.inv .tot{display:grid;grid-template-columns:auto auto;justify-content:end;gap:8px 32px;margin-top:20px;font-size:14px}
.inv .tot b{text-align:right}

const pool=id=>S.pools.find(p=>p.id===id);
const inv=id=>S.investors.find(x=>x.id===id);
const park=id=>S.parks.find(p=>p.id===id);
function parkFacts(pid){const p=park(pid);let head=0,kg=0;p.farms.forEach(f=>f.sheds.forEach(s=>{head+=s.head;kg+=s.head*s.avg}));return{head,kg,avg:head?kg/head:0}}
function liveClasses(p){const c={livestock:0,land:0,infra:0,industry:0,wc:0};
  p.scope.forEach(sc=>{const f=parkFacts(sc.park);c.livestock+=f.kg*p.rule.price*(1-p.rule.cts/100)*sc.pct/100});
  p.assets.forEach(a=>c[a.cls]+=a.val);return c}
function poolLiveNav(p){return sum(Object.values(liveClasses(p)))-p.liab}
function runsOf(pid){return S.runs.filter(r=>r.pool===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function approvedRun(pid,asOf=TODAY){const a=runsOf(pid).filter(r=>r.status==='approved'&&r.date<=asOf);return a[a.length-1]||null}
function draftRun(pid){return S.runs.find(r=>r.pool===pid&&r.status==='draft')||null}
function npuAt(pid,d=TODAY){const r=approvedRun(pid,d);return r?r.npu:pool(pid).unitStart}
function unitsOf(iv,pid,asOf=TODAY){return r4(sum(S.ledger.filter(l=>l.inv===iv&&l.pool===pid&&l.date<=asOf),l=>l.units))}
function totalUnits(pid,asOf=TODAY){return r4(sum(S.ledger.filter(l=>l.pool===pid&&l.date<=asOf),l=>l.units))}
function poolNav(pid){return totalUnits(pid)*npuAt(pid)+pendingCash(pid)}
function pendingCash(pid,iv){return sum(S.ledger.filter(l=>l.pending&&l.pool===pid&&(!iv||l.inv===iv)),l=>l.base)}
function pricingRun(pid,d){return runsOf(pid).find(r=>r.status==='approved'&&r.date>=d)||null}
function computeRun(p,by){const c=liveClasses(p),g=sum(Object.values(c)),nav=g-p.liab,u=totalUnits(p.id),pc=pendingCash(p.id),npu=u>0?(nav-pc)/u:p.unitStart;
  const facts=p.scope.map(sc=>({park:sc.park,pct:sc.pct,...parkFacts(sc.park)}));
  return{id:nid('NAV'),pool:p.id,date:TODAY,classes:c,gross:g,liab:p.liab,nav,pending:pc,units:u,npu:r4(npu),status:'draft',by,inputs:{price:p.rule.price,cts:p.rule.cts,facts}}}
function allocatePending(run){const got=[];S.ledger.filter(l=>l.pending&&l.pool===run.pool&&l.date<=run.date).forEach(l=>{l.units=r4(l.base/run.npu);l.npu=run.npu;l.pending=false;l.pricedOn=run.date;got.push(l)});return got}
function invested(iv,pid){return sum(S.ledger.filter(l=>l.inv===iv&&(!pid||l.pool===pid)&&(l.kind==='subscription'||(l.kind==='correction'&&l.revKind==='subscription'))),l=>l.base)}
function received(iv,pid){return -sum(S.ledger.filter(l=>l.inv===iv&&(!pid||l.pool===pid)&&['payout','redemption'].includes(l.kind)||(l.inv===iv&&(!pid||l.pool===pid)&&l.kind==='correction'&&['payout','redemption'].includes(l.revKind))),l=>l.base)}
function holdingsOf(iv){return S.pools.map(p=>{const u=unitsOf(iv,p.id);if(u<=0&&!S.ledger.some(l=>l.inv===iv&&l.pool===p.id))return null;const npu=npuAt(p.id),tu=totalUnits(p.id),pend=pendingCash(p.id,iv);return{pool:p,units:u,npu,pending:pend,value:u*npu+pend,share:tu?u/tu:0,inv:invested(iv,p.id),rec:received(iv,p.id)}}).filter(Boolean)}
function portfolio(iv,pids){const h=holdingsOf(iv).filter(x=>!pids||pids.includes(x.pool.id));const value=sum(h,x=>x.value),inv_=sum(h,x=>x.inv),rec=sum(h,x=>x.rec);
  const split={};CLASS.forEach(c=>split[c[0]]=0);h.forEach(x=>{const r=approvedRun(x.pool.id);if(!r||!r.classes)return;const g=sum(Object.values(r.classes));if(!g)return;Object.entries(r.classes).forEach(([k,v])=>split[k]+=x.value*(v/g))});
  return{h,value,invested:inv_,received:rec,gain:value+rec-inv_,moic:inv_?(value+rec)/inv_:0,split}}
function valueHistory(iv){const dates=[...new Set(S.runs.filter(r=>r.status==='approved').map(r=>r.date))].sort();
  return dates.map(d=>({d,v:sum(S.pools,p=>unitsOf(iv,p.id,d)*npuAt(p.id,d))})).filter(x=>x.v>0)}
function aumHistory(){const dates=[...new Set(S.runs.filter(r=>r.status==='approved').map(r=>r.date))].sort();
  return dates.map(d=>({d,by:Object.fromEntries(S.pools.map(p=>[p.id,totalUnits(p.id,d)*npuAt(p.id,d)]))}))}

  let paid=0;const rows=holders.map(x=>{const amt=Math.floor(amount*x.u/tu*100)/100;paid+=amt;return{inv:x.i.id,units:x.u,amt}});

  rows.forEach(r=>S.ledger.push({id:nid('L'),pool:pid,inv:r.inv,kind:'payout',units:0,base:-r.amt,paidCcy:'INR',paidAmt:r.amt,fx:1,npu:npuAt(pid,date),date,note,by}));

  const thead=`<thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${esc(c.l)}</th>`).join('')}</tr></thead>`;
  const tb=vis.length?vis.map(r=>`<tr class="${r._click?'cl':''}" ${r._click||''}>${cols.map(c=>`<td class="${c.r?'r num':''}" data-l="${esc(c.l)}">${c.f(r)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}"><div class="empty"><b>${esc(empty)}</b>Try another filter or add one.</div></td></tr>`;
  const foot=noPage?'':`<div class="tfoot"><label class="sw dz"><input type="checkbox" data-c="tdense" data-k="${k}" ${st.dense?'checked':''}>Dense</label><span>Rows per page <select data-c="trpp" data-k="${k}" aria-label="Rows per page">${[5,10,25].map(n=>`<option ${n===st.rpp?'selected':''}>${n}</option>`).join('')}</select></span><span class="num">${rows.length?st.page*st.rpp+1:0}–${Math.min(rows.length,(st.page+1)*st.rpp)} of ${rows.length}</span><span><button class="ib" style="width:32px;height:32px" data-a="tpg" data-k="${k}" data-v="-1" ${st.page<=0?'disabled':''} aria-label="Previous page">${ic('chev').replace('<path','<path transform="rotate(180 12 12)"')}</button><button class="ib" style="width:32px;height:32px" data-a="tpg" data-k="${k}" data-v="1" ${st.page>=pages-1?'disabled':''} aria-label="Next page">${ic('chev')}</button></span></div>`;

function filt(rows,q,fn){q=(q||'').trim().toLowerCase();return q?rows.filter(r=>fn(r).toLowerCase().includes(q)):rows}

function effRate(d){const ref=S.fx.rates[d.ccy]||1,tot=sum(d.rows,r=>+r.amt||0);return d.ccy!=='INR'&&+d.credited>0&&tot>0?+d.credited/tot:ref}
function investPreview(inst){const d=inst.dlg;const rate=effRate(d);let tot=0;const rows=d.rows.map(r=>{const p=pool(r.pool),amt=+r.amt||0,base=amt*rate;tot+=base;const pr=p?pricingRun(p.id,d.date):null,dr=p?draftRun(p.id):null,npu=pr?pr.npu:(dr?dr.npu:npuAt(p?.id));
  const bad=p&&!p.accepted.includes(d.ccy);return `<div class="li"><span class="tx"><b>${esc(p?.name||'—')}</b><small>${bad?`<span class="dn">${d.ccy} not accepted by this pool</span>`:`${fm(amt,d.ccy,{dec:2})}${d.ccy!=='INR'?' × ₹'+rate:''} = ${fm(base,'INR',{dec:2})} ÷ ${fnpu(npu)} `+(pr?`(approved valuation of ${fdate(pr.date)})`:`(estimate · units are issued at the next approved valuation)`)}</small></span><span class="v num">${pr?'':'≈ '}${fu(base/npu)} units</span></div>`}).join('');
  return rows+`<div class="li"><span class="tx"><b>Total</b><small>Forward pricing: money buys units at the first approved valuation on or after the day it arrives, so nobody buys at a stale price.</small></span><span class="v num">${fm(tot,'INR',{dec:2})}</span></div>`}
function payoutPreview(inst){const d=inst.dlg;const amt=+d.amt||0;if(!d.pool)return '';const rows=payoutEntries(d.pool,amt,d.date,'',inst.actor,false);const cash=pool(d.pool).assets.find(a=>a.cls==='wc')?.val||0;
  if(!rows.length)return '<div class="al warn">'+ic('alert')+'<span>No units held on that date.</span></div>';
  return `${amt>cash?`<div class="al err" style="margin-bottom:12px">${ic('alert')}<span>More than the pool's cash (${fm(cash,'INR',{c:1})}).</span></div>`:''}<div class="tw"><table class="rt"><thead><tr><th>LP</th><th class="r">Units on record date</th><th class="r">Share</th><th class="r">Payout</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-l="LP"><b>${esc(inv(r.inv).name)}</b></td><td class="r num" data-l="Units">${fu(r.units)}</td><td class="r num" data-l="Share">${pct(r.units/sum(rows,x=>x.units),2)}</td><td class="r num" data-l="Payout"><b>${fm(r.amt,'INR',{dec:2})}</b></td></tr>`).join('')}</tbody></table></div><p class="faint" style="font-size:12.5px;margin:10px 0 0">Rounded down to the paisa; ${fm(amt-sum(rows,r=>r.amt),'INR',{dec:2})} left over stays in the pool.</p>`}

  if(n('name')!=null)p.name=n('name');if(n('base'))p.base=n('base');if(n('unitStart')!=null)p.unitStart=+n('unitStart');p.status=n('status');p.liab=+n('liab')||0;

payout(inst,f,fd){const d=inst.dlg;d.pool=fd.get('pool');d.date=fd.get('date');d.amt=fd.get('amt');d.note=fd.get('note');const amt=+d.amt,p=pool(d.pool);
  if(!(amt>0)){toast('Enter an amount above 0','err');return}const cash=p.assets.find(a=>a.cls==='wc')?.val||0;if(amt>cash){toast('More than the pool\'s cash','err');return}
  const rows=payoutEntries(d.pool,amt,d.date,d.note,inst.actor,true);if(!rows.length){toast('No units held on that date','err');return}
  const paid=sum(rows,r=>r.amt);addWC(p,-paid);logA(inst.actor,'payout',p.name,`${d.note}: ${fm(paid,'INR',{dec:2})} to ${rows.length} LPs, record date ${fdate(d.date)}`);inst.dlg=null;commit(inst);toast('Paid '+fm(paid,'INR')+' to '+rows.length+' LPs')},
reverse(inst,f,fd){const l=S.ledger.find(x=>x.id===inst.dlg.g);if(!l||l.reversedBy){toast('Already reversed','err');return}const p=pool(l.pool);
  if(l.units>0&&unitsOf(l.inv,l.pool)-l.units< -1e-6){toast('LP no longer holds these units','err');return}
  const c={id:nid('L'),pool:l.pool,inv:l.inv,kind:'correction',revKind:l.kind,units:-l.units,base:-l.base,paidCcy:l.paidCcy,paidAmt:-l.paidAmt,fx:l.fx,npu:l.npu,date:TODAY,note:fd.get('note')||'Correction',by:inst.actor,reverses:l.id};
  S.ledger.push(c);l.reversedBy=c.id;if(l.kind==='subscription')addWC(p,-l.base);if(['payout','redemption'].includes(l.kind))addWC(p,-l.base);
  logA(inst.actor,'ledger.reverse',inv(l.inv).name,`Reversed ${l.id} (${l.kind}) · ${c.note}`);inst.dlg=null;commit(inst);toast('Reversed '+l.id)},
sell(inst,f,fd){const i=inv(inst.lp),pid=fd.get('pool'),u=+fd.get('units');const free=unitsOf(i.id,pid)-pendingUnits(i.id,pid);inst.errs={};
  if(!(u>0))inst.errs.units='Enter units above 0';else if(u>free+1e-6)inst.errs.units=`You have ${fu(free)} free units`;
  if(inst.errs.units){render(inst);return}inst.errs=null;
  S.requests.unshift({id:'REQ-'+(1000+S.requests.length+1),inv:i.id,pool:pid,units:u,date:TODAY,status:'pending'});logA(i.id,'redeem.request',i.name,`${i.name} asked to sell ${fu(u)} units of ${pool(pid).name}`);commit(inst);toast('Request sent to Mesha')}};

function bind(inst){const el=inst.el;
  el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||!el.contains(a)||a.disabled)return;const fn=A[a.dataset.a];if(!fn)return;if(a.tagName==='BUTTON'&&a.type!=='submit')e.preventDefault();fn(inst,a.dataset,a,e)});
  el.addEventListener('change',e=>{const c=e.target.closest('[data-c]');if(c&&C[c.dataset.c]&&c.dataset.c!=='tq')C[c.dataset.c](inst,c);
    const f=e.target.closest('form');if(f&&f.dataset.f==='invest'){syncInvest(inst);if(e.target.name==='ccy'||e.target.name==='inv'){if(e.target.name==='inv'){inst.dlg.ccy=inv(inst.dlg.inv).ccy}render(inst)}else{const pv=document.getElementById(uid(inst,'inv-prev'));if(pv)pv.innerHTML=investPreview(inst)}}
    if(f&&f.dataset.f==='payout'){const d=inst.dlg,fd=new FormData(f);d.pool=fd.get('pool');d.date=fd.get('date');d.amt=fd.get('amt');d.note=fd.get('note');const pv=document.getElementById(uid(inst,'pay-prev'));if(pv)pv.innerHTML=payoutPreview(inst)}});
  el.addEventListener('input',e=>{const c=e.target.closest('[data-c="tq"]');if(c){C.tq(inst,c);return}
    const f=e.target.closest('form');if(f&&f.dataset.f==='invest'){syncInvest(inst);const pv=document.getElementById(uid(inst,'inv-prev'));if(pv)pv.innerHTML=investPreview(inst)}
    if(f&&f.dataset.f==='payout'){const d=inst.dlg,fd=new FormData(f);d.amt=fd.get('amt');d.pool=fd.get('pool');d.date=fd.get('date');d.note=fd.get('note');const pv=document.getElementById(uid(inst,'pay-prev'));if(pv)pv.innerHTML=payoutPreview(inst)}});
  el.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(F[f.dataset.f])F[f.dataset.f](inst,f,new FormData(f))});
  el.addEventListener('keydown',e=>{if(e.key==='Escape'&&(inst.dlg||inst.drawer)){inst.dlg=null;inst.drawer=false;render(inst)}})}

/* ============================ SYSTEM DESIGN TAB ============================ */
function renderDoc(){document.getElementById('doc').innerHTML=`
<h2>Mesha Exchange · system design</h2>
<p class="lede">Manju sets up pools on top of the existing parks, farms and sheds, records each LP's money, and approves valuations. Each LP signs in to exchange.mesha.sg or the app and sees only their own units, value and split. Everything in the CEO and LP tabs above runs on this design.</p>
<h3>Decisions</h3>
<div class="tw"><table><thead><tr><th>Topic</th><th>Decision</th></tr></thead><tbody>
<tr><td><b>What LPs own</b></td><td>Units in a pool. A unit starts at 1.00 of the pool's base currency and then moves with the pool's value. New money is <b>forward priced</b>: it buys units at the first approved valuation on or after the day it arrives, so nobody buys at a stale price and earlier LPs are never diluted. Until then it shows as \"awaiting units\".</td></tr>
<tr><td><b>Pools</b></td><td>One or more parks, each with a share % (a park can be split across pools, never above 100% in total). Plus land, sheds, stakes and cash entered by Manju.</td></tr>
<tr><td><b>Global LPs</b></td><td>Money arrives in any enabled currency, is converted at the rate on the day it arrives, and is stored in the pool's base currency. LPs choose a display currency; the base amount and rate are always shown too.</td></tr>
<tr><td><b>Valuation</b></td><td>Livestock = live kg from goatos weighings × price per kg × (1 − costs to sell) × park share. Runs are drafts until an Oversee holder approves them, or auto-approved when the move is inside the pool's limit. LPs only see approved values.</td></tr>
<tr><td><b>Ledger</b></td><td>Append-only. Subscriptions, payouts, buy-backs and corrections. Nothing is edited or deleted; each row carries a hash of the previous one.</td></tr>
<tr><td><b>Who sees money data</b></td><td>The LP (own data only), and staff Manju grants an Investments level to in HRMS. Goatos admin, CEO_internal and dev roles grant nothing.</td></tr>
<tr><td><b>Apps</b></td><td>Separate repo <code>vgoats/mesha-exchange</code>. Web: Next.js + MUI Minimal (Standard Plus) with the Mesha theme at exchange.mesha.sg. iOS/Android: the same app wrapped with Capacitor, with over-the-air updates. Go exchange API.</td></tr>
</tbody></table></div>
<h3>Architecture</h3>
<pre class="mermaid">flowchart LR
  subgraph G["goatos (existing)"]
    OPS[Staff apps] --> GDB[(goatos Postgres<br/>parks · sheds · animals<br/>weighings · sales)]
    HR[HRMS People → Access]
  end
  GDB -- "read-only herd facts<br/>(no money data)" --> API
  HR -- "Investments grant<br/>(Configure holders only)" --> API
  subgraph X["exchange (separate repo + GCP project)"]
    WEB[exchange.mesha.sg<br/>Next.js + MUI Minimal] --> API[exchange-api<br/>Go · Cloud Run]
    APP[iOS / Android<br/>Capacitor + OTA] --> API
    API --> XDB[(exchange Postgres<br/>RLS · CMEK)]
    API --> KMS{{Cloud KMS<br/>PII keys}}
    API --> FF[Feature flags]
  end
  AUTH[Firebase · investor tenant<br/>MFA required] --> WEB
  AUTH --> APP</pre>
<h3>Security layers</h3>
<div class="layers">
<div class="layer"><b>1 · Separate system</b><div>Own repo, GCP project, Cloud SQL instance (private IP, CMEK) and service account. No human DB credentials; devs and goatos admins have no IAM here.</div></div>
<div class="layer"><b>2 · One permission check</b><div><code>can(person, action, pool)</code> on every request, from grants stored in the exchange (not goatos). Deny by default.</div></div>
<div class="layer"><b>3 · Row-level security</b><div>FORCE RLS on every table. The API sets the LP id or the staff member's pools per transaction; a query without them fails instead of returning rows.</div></div>
<div class="layer"><b>4 · Encryption</b><div>Names, email, phone, tax ID and bank encrypted per LP with Cloud KMS keys only the API can use. Shown masked; a reveal needs the PII switch and is logged.</div></div>
<div class="layer"><b>5 · Audit</b><div>Every view, reveal, money entry and config change is logged, append-only. LPs see who viewed their data.</div></div>
<div class="layer"><b>6 · Leak paths closed</b><div>No exchange data in logs, BigQuery, Ask Mesha / CEO AI, LLM tracing, analytics, emails or screenshot bots. Break-glass access needs two approvers and expires in 1 hour.</div></div></div>
<h3>Access levels (HRMS → Investments)</h3>
<div class="tw"><table><thead><tr><th>Level</th><th>Can</th></tr></thead><tbody>
<tr><td><b>View</b></td><td>See LPs, holdings, values and the ledger for pools in scope</td></tr><tr><td><b>Do</b></td><td>View + add LPs, record investments and payouts, run valuations, reverse entries</td></tr>
<tr><td><b>Oversee</b></td><td>View + approve valuations and exit requests. Not a superset of Do, same as goatos levels</td></tr><tr><td><b>Configure</b></td><td>Everything + pools, currencies, settings, feature flags and access. At least two holders at all times</td></tr>
<tr><td><b>Extras</b></td><td>Pool scope, PII switch, expiry date. Maker-checker (optional) stops people approving their own valuation</td></tr></tbody></table></div>
<h3>Data model</h3>
<div class="tw"><table><thead><tr><th>Table</th><th>Holds</th></tr></thead><tbody>
<tr><td><code>pool</code>, <code>pool_scope</code>, <code>pool_asset</code>, <code>asset_valuation</code>, <code>livestock_rule</code></td><td>Pool setup, parks and share %, other assets, the price rule</td></tr>
<tr><td><code>investor</code>, <code>investor_user</code></td><td>LPs (PII encrypted, blind index for email), their logins</td></tr>
<tr><td><code>ledger_entry</code></td><td>Every unit and cash movement with paid currency, rate, NAV/unit used, hash chain</td></tr>
<tr><td><code>nav_run</code>, <code>nav_snapshot</code></td><td>Valuation drafts and approvals with all inputs</td></tr>
<tr><td><code>staff_grant</code>, <code>access_log</code>, <code>feature_flag</code>, <code>fx_rate</code>, <code>config_change</code></td><td>Access, audit, flags, rates, settings history</td></tr></tbody></table></div>
<h3>Edge cases handled in the prototype</h3>
<ul><li>Base currency locks once units are issued; a disabled currency can't still be accepted by a pool.</li><li>A park can't be split above 100% across pools; the same park can't be listed twice.</li><li>Forward pricing: money gets units at the first approved valuation on or after its date; backdated money is priced by the valuation that followed it; money awaiting units is kept out of the NAV per unit.</li><li>Payouts split by units held on the record date, rounded down; leftover paise stay in the pool; can't pay more than the pool's cash.</li><li>Corrections reverse, never edit; an entry can't be reversed twice; units already sold can't be reversed.</li><li>LPs can't sell more than their free units (pending requests count).</li><li>Expired grants stop working the next day; at least two Configure holders; goatos admins get a 403.</li><li>New money raises the pool's cash, so NAV per unit doesn't jump when an LP invests.</li></ul>
<h3>Hardening</h3>
<ul><li><b>No single person</b> can read or move the data: protected code owners on migrations, permissions and encryption; only signed CI builds deploy; signed over-the-air bundles; the API can only reach KMS, its database, goatos and the rate provider.</li>
<li><b>Grants live only in the exchange.</b> HRMS links here and can only remove access. Staff sign in to the exchange's own staff login with two-step verification.</li>
<li><b>Maker-checker is mandatory</b> for valuations, reversals, payouts, buy-backs and grants in production.</li>
<li><b>Row-level security fails closed</b> through a helper that raises when the session isn't set; no materialised views over protected tables.</li>
<li><b>Tamper evidence:</b> one hash chain per pool; the daily head hash goes to a locked bucket in a separate project and onto every LP statement.</li>
<li><b>Apps:</b> no caching of LP pages, screenshots blocked, session in Keychain/Keystore, native biometric lock and push.</li></ul>
<h3>Build order</h3>
<ol><li>GCP project, KMS, service account, investor Firebase tenant (3–4 days)</li><li>Schema, RLS, encryption, permission check and their tests (1 week)</li><li>Goatos read API for herd facts (3 days)</li><li>Valuation job and approval (1 week)</li><li>Manju's screens and the HRMS Investments row (1.5–2 weeks)</li><li>LP web on Minimal (1.5 weeks)</li><li>Capacitor apps and OTA updates, flag service (1 week)</li></ol>`}

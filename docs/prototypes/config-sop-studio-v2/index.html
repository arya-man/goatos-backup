<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesha</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/operator.css">
<link rel="stylesheet" href="styles/setup.css">
<style>@media(max-width:560px){body .top .brand b{max-width:none;overflow:visible;text-overflow:clip}body .top .parksel{display:none}}
@media(min-width:861px) and (max-width:1179px){body .cfg{grid-template-columns:minmax(0,1fr);gap:10px}body .cfg>.cfgrail{display:none}body .cfg>.cfgrail-m{display:block!important;max-width:360px;width:100%}}</style>
</head>
<body class="font-sans">
<div class="top">
  <button class="iconbtn hamb" data-a="nav-toggle" aria-label="Toggle navigation"></button>

  <div class="sp"></div>
  <div class="parksel" id="parksel"></div>
  <button class="iconbtn" data-a="theme" aria-label="Toggle theme" id="themebtn"></button>
  <button class="iconbtn" aria-label="Notifications" id="bellbtn"></button>
  <div class="userpick"><button class="me" data-a="user-menu" id="mebtn"></button></div>
</div>
<div class="layout" id="layout">
  <aside class="side" id="side"></aside>
  <div class="navscrim" data-a="nav-close"></div>
  <main class="main" id="main"><div class="wrap" id="wrap"></div></main>
</div>
<div class="scrim hidden" id="scrim" data-a="drawer-close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>

<script src="js/io.js"></script>
<script src="js/setup.js"></script>
<script src="js/flow.js"></script>

<script src="js/operator.js"></script>
<script src="js/sops.js"></script>
<script src="js/master.js"></script>
<script src="js/app.js"></script>
</body>
</html>

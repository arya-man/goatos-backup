options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

serviceAccount: projects/goatos-stg/serviceAccounts/goatos-github-deploy-stg@goatos-stg.iam.gserviceaccount.com

substitutions:
  _RUNNER_TAG: ""

steps:
  - id: build-clouddeploy-runner
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - DOCKER_BUILDKIT=1
      - _RUNNER_TAG=${_RUNNER_TAG}
    args:
      - -ceu
      - |
        tag="$${_RUNNER_TAG:-$$(printf '%s' "$${COMMIT_SHA:-manual}" | cut -c1-12)}"
        image="asia-south1-docker.pkg.dev/goatos-stg/goatos/clouddeploy-stg-runner:$${tag}"
        docker build --platform linux/amd64 -f deploy/clouddeploy/stg/runner.Dockerfile -t "$${image}" .
        docker run --rm --platform linux/amd64 --entrypoint /bin/bash "$${image}" -ceu '
          test -x /usr/local/bin/goatos-stg-clouddeploy-task
          test -x /usr/local/bin/goatos-stg-analytics-events-routing
          test -r /usr/local/bin/goatos-stg-grafana-sso.py
          node --check /opt/goatos/tools/deploy/smoke-stg-grafana-dashboards.mjs
          test -r /opt/goatos/infra/observability/firebase-initial-export.json
          python3 -m py_compile /usr/local/bin/goatos-stg-grafana-sso.py /usr/local/bin/goatos-stg-observability.py
          bash -n /usr/local/bin/goatos-stg-clouddeploy-task
          bash -n /usr/local/bin/goatos-stg-analytics-events-routing
          set +e
          /usr/local/bin/goatos-stg-clouddeploy-task executable-smoke > /tmp/entrypoint-smoke.log 2>&1
          status=$$?
          set -e
          test "$${status}" -eq 1
          grep -q "usage: .* render|deploy" /tmp/entrypoint-smoke.log
        '
        docker push "$${image}"
        digest="$$(docker inspect --format='{{index .RepoDigests 0}}' "$${image}")"
        docker run --rm --platform linux/amd64 --entrypoint python3 -v /workspace:/source "$${digest}" /source/tools/deploy/stg-runner-receipt.py --root /source --verify-image --image "$${digest}" --output /source/runner-receipt.json
        printf 'runner_image=%s\n' "$${digest}" > /workspace/runner-image.env

artifacts:
  objects:
    location: gs://goatos-stg_cloudbuild/runner-builds/$BUILD_ID/
    paths:
      - /workspace/runner-image.env
      - /workspace/runner-receipt.json

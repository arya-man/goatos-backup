  /admin/identity/candidates/{candidate_id}/approve:
    post:
      tags:
        - Identity Candidates
      operationId: approveIdentityCandidate
      summary: Approve a candidate match by attaching an identifier or merging the candidate's goats.
      description: >-
        Applies a safe, non-create approve outcome. decision_type=attach_identifier
        attaches an explicit (or deterministically RFID-extracted) identifier to one
        of the candidate's goats; decision_type=merge_goats merges the candidate's two
        goats using the existing merge invariants. Minting a new goat (approve-to-create)
        is intentionally not supported here and stays blocked on the conflict create_goat
        contract.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCandidateRequest"
      responses:
        "200":
          description: Candidate approval result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /admin/identity/candidates/{candidate_id}/reject:
    post:
      tags:
        - Identity Candidates
      operationId: rejectIdentityCandidate
      summary: Reject a candidate match without canonical mutation.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCandidateRequest"
      responses:
        "200":
          description: Candidate rejection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats:
    post:
      tags:
        - Admin Goats
      operationId: createAdminGoat
      summary: Create a reviewed goat identity record.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatRequest"
      responses:
        "201":
          description: Goat created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "200":
          description: Idempotent replay of a previously created goat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/goats/{goat_id}:
    patch:
      tags:
        - Admin Goats
      operationId: updateAdminGoat
      summary: Update canonical identity fields with optimistic concurrency.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatRequest"
      responses:
        "200":
          description: Goat updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats/{goat_id}/identifiers:
    post:
      tags:
        - Admin Goats
      operationId: addGoatIdentifier
      summary: Attach an identifier after policy and uniqueness checks.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIdentifierRequest"
      responses:
        "200":
          description: Identifier attached or conflict returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats/{goat_id}/identifiers/{identifier_id}/retire:
    post:
      tags:
        - Admin Goats
      operationId: retireGoatIdentifier
      summary: Retire an identifier with evidence and audit.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdentifierId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireIdentifierRequest"
      responses:
        "200":
          description: Identifier retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/identity/correction-requests:
    get:
      tags:
        - Correction Requests
      operationId: adminListCorrectionRequests
      summary: List correction requests visible to the admin.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CorrectionRequestState"
      responses:
        "200":
          description: Correction request page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/identity/correction-requests/{correction_request_id}/resolve:
    post:
      tags:
        - Correction Requests
      operationId: resolveCorrectionRequest
      summary: Resolve an operator correction request.
      parameters:
        - $ref: "#/components/parameters/CorrectionRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCorrectionRequest"
      responses:
        "200":
          description: Correction request resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/counts/sync-runs:
    post:
      tags:
        - Counts Sync
      operationId: createCountsSyncRun
      summary: Rebuild Counts projection rows from governed source rows.
      description: >-
        Executes the local Counts projection rebuild using tenant-scoped
        counts_source_rows. Execute runs resolve source location labels through
        Locations aliases and open/reuse review items for unknown labels. Dry
        runs are read-only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountsSyncRunRequest"
      responses:
        "200":
          description: Counts sync run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsSyncRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/counts/sync-runs/{sync_run_id}:
    get:
      tags:
        - Counts Sync
      operationId: getCountsSyncRun
      summary: Get a Counts sync run result.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Counts sync run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsSyncRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/mortality/sync-runs:
    post:
      tags:
        - Mortality Sync
      operationId: createMortalitySyncRun
      summary: Rebuild Mortality events and projection rows from governed source rows.
      description: >-
        Executes the local Mortality replay using tenant-scoped
        mortality_source_rows. Stable logical events are idempotent, candidate
        review rows remain distinct, and source location labels resolve through
        Locations aliases.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMortalitySyncRunRequest"
      responses:
        "200":
          description: Mortality sync run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MortalitySyncRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/mortality/sync-runs/{sync_run_id}:
    get:
      tags:
        - Mortality Sync
      operationId: getMortalitySyncRun
      summary: Get a Mortality sync run result.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Mortality sync run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MortalitySyncRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/legacy-sync/sources:
    get:
      tags:
        - Legacy Sync
      operationId: listLegacySyncSources
      summary: List registered and observed legacy source freshness.
      description: >
        Returns backend-owned source registry rows plus observed unregistered
        sources. Admin-web uses this instead of reading BigQuery or Sheets
        directly.
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
            enum:
              - identity
              - lifecycle
              - current_location
              - active_count
      responses:
        "200":
          description: Legacy sync sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncSourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/legacy-sync/status:
    get:
      tags:
        - Legacy Sync
      operationId: getLegacySyncStatus
      summary: Get overall legacy sync freshness.
      description: Overall freshness is the worst critical source freshness plus counter freshness; noncritical degraded sources remain visible but do not make Phase 1 identity dashboards red.
      responses:
        "200":
          description: Legacy sync status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncOverallStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/legacy-sync/runs:
    get:
      tags:
        - Legacy Sync
      operationId: listLegacySyncRuns
      summary: List recent legacy sync runs.
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Legacy sync runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Legacy Sync
      operationId: createLegacySyncRun
      summary: Create a backend-owned legacy sync run.
      description: >
        Dry-runs are non-mutating and may be cold starts. Execute and nightly
        deep reconcile are accepted only as explicit blocked v1 runs until the
        backend executor is configured; they do not apply deltas, rebuild
        counters, or advance success watermarks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegacySyncRunRequest"
      responses:
        "201":
          description: Legacy sync run accepted or completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLegacySyncRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/legacy-sync/runs/{sync_run_id}:
    get:
      tags:
        - Legacy Sync
      operationId: getLegacySyncRun
      summary: Get legacy sync run details and Source & Correction Log.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Legacy sync run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncRunDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/legacy-sync/runs/{sync_run_id}/cancel:
    post:
      tags:
        - Legacy Sync
      operationId: cancelLegacySyncRun
      summary: Request cancellation for a legacy sync run.
      description: Cancellation records operator intent. If apply already started, atomic apply finishes or rolls back normally; successful watermarks do not advance unless apply plus counter rebuild already completed.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Legacy sync run after cancel request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelLegacySyncRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImportRunId:
      name: import_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportRowId:
      name: import_row_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceCandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPId:
      name: sop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AliasId:
      name: alias_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapacityRecordId:
      name: capacity_record_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentifierId:
      name: identifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrectionRequestId:
      name: correction_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SyncRunId:
      name: sync_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, uniqueness, merge redirect, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Endpoint or command is intentionally deferred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Required service or runtime configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SOPDefinition:
      type: object
      additionalProperties: false
      required:
        - sop_id
        - tenant_id
        - code
        - name
        - description
        - status
        - version_count
        - row_version
        - created_at
        - updated_at
      properties:
        sop_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, retired]
        active_sop_version_id:
          type:
            - string
            - "null"
          format: uuid
        version_count:
          type: integer
          minimum: 0
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum: [draft, published, retired]
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPListResponse:
      type: object
      additionalProperties: false
      required: [items, trace_id]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SOPDefinition"
        trace_id:
          type: string
    SOPResponse:
      type: object
      additionalProperties: false
      required: [sop, trace_id]
      properties:
        sop:
          $ref: "#/components/schemas/SOPDefinition"
        latest_version:
          oneOf:
            - $ref: "#/components/schemas/SOPVersion"
            - type: "null"
        trace_id:
          type: string
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required: [version, trace_id]
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    CreateSOPRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
    CreateSOPVersionRequest:
      type: object
      additionalProperties: false
      required: [version_label, form_dsl, proof_policy]
      properties:
        version_label:
          type: string
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
    RowVersionRequest:
      type: object
      additionalProperties: false
      required: [row_version]
      properties:
        row_version:
          type: integer
          minimum: 1
    ProofReference:
      type: object
      additionalProperties: false
      required: [proof_id, proof_type, subject_type, upload_state, metadata]
      properties:
        proof_id:
          type: string
        proof_type:
          type: string
          enum: [photo, video, attachment]
        subject_type:
          type: string
          enum: [batch, goat, shed, task, other]
        subject_id:
          type:
            - string
            - "null"
        upload_state:
          type: string
          enum: [pending, uploading, completed, failed]
        metadata:
          type: object
          additionalProperties: true
    DryRunRequest:
      type: object
      additionalProperties: false
      required: [answers, proof_refs]
      properties:
        answers:
          type: object
          additionalProperties: true
        proof_refs:
          type: array
          items:
            $ref: "#/components/schemas/ProofReference"
        context:
          type: object
          additionalProperties: true
    FieldState:
      type: object
      additionalProperties: false
      required: [key, visible, required, blocked]
      properties:
        key:
          type: string
        visible:
          type: boolean
        required:
          type: boolean
        blocked:
          type: boolean
        message:
          type: string
    DryRunResponse:
      type: object
      additionalProperties: false
      required: [valid, errors, warnings, field_states, workflow_path, final_state, trace_id]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        field_states:
          type: array
          items:
            $ref: "#/components/schemas/FieldState"
        workflow_path:
          type: array
          items:
            type: string
        final_state:
          type: string
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - tenant_id
        - sop_id
        - sop_version_id

      operationId: previewReclassifyShedStage
      summary: Report what a whole-pen cohort reclassification would change, without writing anything.
      description: >-
        Read-only. Returns the pen's whole-scope live composition and how many animals the requested
        cohort tag would actually change, so the operator sees a mixed pen before flipping it. Takes
        no Idempotency-Key because it is safe to repeat. Gated on the same permission as the commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassifyShedStageRequest"

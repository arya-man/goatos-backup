      operationId: createStaffPosition
      summary: Assign a member to a fixed named position seat at a scope.
      description: Replace semantics -- assigning a new holder to an already-occupied (scope, position_code) seat
        ends the prior holder's row and creates a new active one. is_backup_slot + backup_group_code express the
        confirmed two-tier backup shape -- manager-tier positions share one center-wide Backup Manager group;
        assistant-tier positions each have their own parallel backup group (e.g. Backup AM1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "200":
          description: Created/reassigned position seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/positions/import:
    post:
      tags:
        - HR Roster
      operationId: importStaffPositions
      summary: Bulk create/replace fixed position seats from a parsed timetable import.
      description: >-
        Accepts already-parsed rows (the caller does the file parsing) and applies each with the same
        replace semantics and validation as a single createStaffPosition. Per-row outcomes are returned so a
        partially-valid import still lands its valid rows. When an Idempotency-Key is supplied, each row is
        deduplicated deterministically by (key, row index), so a retried import never double-inserts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPositionsRequest"
      responses:
        "200":
          description: Per-row import outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPositionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/positions/{position_id}:
    get:
      tags:
        - HR Roster
      operationId: getStaffPositionProfile
      summary: Read the person/position profile drawer for a seat.
      description: >-
        Returns the enriched position seat plus its holder's currently-active coverage window (if any). Backs
        the People position row-click drawer. A reports_to hierarchy pointer is intentionally not returned
        because no such source column exists in the roster schema.
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Position profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
    patch:
      tags:
        - HR Roster
      operationId: updateStaffPosition
      summary: Edit a fixed position seat's attributes in place (not its holder).
      description: >-
        Mutates week-off, backup group, tier, validity, or status of an existing active seat. Reassigning the
        holder is a separate replace via createStaffPosition. Optimistically locked on row_version; idempotent
        via the Idempotency-Key header.
      parameters:
        - $ref: "#/components/parameters/PositionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePositionRequest"
      responses:
        "200":
          description: Updated position seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/leave:
    get:
      tags:
        - HR Roster
      operationId: listStaffLeave
      summary: List staff leave/absence (workforce_absences reuse).
      parameters:
        - name: workforce_member_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: scope_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - tenant
              - center
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - reported
              - approved
              - escalation_required
              - rejected
              - canceled
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Leave rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLeaveListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - HR Roster
      operationId: applyStaffLeave
      summary: Apply for leave/absence for a staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyStaffLeaveRequest"
      responses:
        "200":
          description: Reported leave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLeaveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/roster/leave/{absence_id}:
    get:
      tags:
        - HR Roster
      operationId: getStaffLeave
      summary: Get a staff leave/absence row.
      parameters:
        - $ref: "#/components/parameters/AbsenceId"
      responses:
        "200":
          description: Leave row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLeaveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/roster/leave/{absence_id}/approve:
    post:
      tags:
        - HR Roster
      operationId: approveStaffLeave
      summary: Approve a leave/absence and auto-resolve its coverage.
      description: Immediately resolves effective_backup (design doc S4.3/S4.5) for the leave-taker's position (if
        any) and fills workforce_absences.replacement_member_id automatically, or marks the leave
        escalation_required (S4.7) when no backup can be resolved or the backup is itself unavailable. Ownership
        (workforce_positions) is never touched.
      parameters:
        - $ref: "#/components/parameters/AbsenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveStaffLeaveRequest"
      responses:
        "200":
          description: Approved (and coverage-resolved) leave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLeaveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/leave/{absence_id}/resolve-coverage:
    post:
      tags:
        - HR Roster
      operationId: resolveStaffLeaveCoverage
      summary: Re-resolve or CEO-override the coverage for an approved/escalated leave.
      description: Omitting replacement_member_id re-runs auto-resolution (useful once a backup is configured after
        initial approval). An explicit replacement_member_id is a CEO-tier override and MUST equal the position's
        current effective_backup holder (design doc S5.4 -- never a free pick of any manager/assistant); any other
        value is rejected with cross_cover_rejected.
      parameters:
        - $ref: "#/components/parameters/AbsenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveLeaveCoverageRequest"
      responses:
        "200":
          description: Coverage-resolved leave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLeaveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/vaccination-owner:
    get:
      tags:
        - HR Roster
      operationId: resolveVaccinationOwner
      summary: Resolve who owns vaccination work for a scope on a date (design doc S4.8 effective_owner).
      description: Returns the permanent Preventive Care Manager holder, the resolved ad-hoc-leave replacement, or
        the recurring week-off backup. When nobody can be resolved, reason and escalation_park_head_member_id
        identify the escalation target. A week-off resolution grants the backup a just-in-time temporary
        vaccination.execute capability for that single day (design doc S4.6), deduplicated across repeat calls for
        the same day.
      parameters:
        - name: scope_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - tenant
              - center
        - name: scope_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resolved vaccination owner for the date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/roster/backup-config:
    get:
      tags:
        - HR Roster
      operationId: listBackupConfig
      summary: List backup group configurations by center.
      parameters:
        - name: scope_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - tenant
              - center
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: List of backup configurations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupConfig"
                  trace_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - HR Roster
      operationId: upsertBackupConfig
      summary: Assign or replace the holder of a backup-slot seat for a backup group.
      description: >-
        Backs the People "Configure backup" action. A backup slot is a normal position row with
        is_backup_slot=true; replace semantics end the prior holder of the (scope, backup_position_code) seat.
        Idempotent via the Idempotency-Key header.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBackupConfigRequest"
      responses:
        "200":
          description: Created/replaced backup-slot seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/roster/coverage:
    get:
      tags:
        - HR Roster
      operationId: listCoverage
      summary: List active or historical coverage (leave, week-off, escalation).
      parameters:
        - name: scope_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - tenant
              - center
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: List of coverage records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Coverage"
                  trace_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProcurementLoadId:
      name: load_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProcurementWorkState:
      name: work_state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProcurementWorkState"
    ProcurementSeverity:
      name: severity
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProcurementSeverity"
    ProcurementLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    ProcurementCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    LocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AbsenceId:
      name: absence_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPId:
      name: sop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AliasId:
      name: alias_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapacityRecordId:
      name: capacity_record_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentifierId:
      name: identifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    OperationsAuditLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    OperationsAuditCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    OperationsAuditFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    OperationsAuditTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    OperationsAuditActorId:
      name: actor_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OperationsAuditActorType:
      name: actor_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - human
          - system
          - worker
          - service
          - user
    OperationsAuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 160
    OperationsAuditResourceType:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    OperationsAuditResourceId:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OperationsAuditScopeType:
      name: scope_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    OperationsAuditScopeId:
      name: scope_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OperationsAuditDomain:
      name: domain
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    OperationsAuditModule:
      name: module
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    OperationsAuditCategory:
      name: category
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    OperationsAuditResult:
      name: result
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    OperationsAuditStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    OperationsAuditAnomaliesOnly:
      name: anomalies_only
      in: query
      required: false
      schema:
        type: boolean
    OutboxDLQStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - dead_letter
          - failed
          - discarded
        default: dead_letter
    OutboxDLQEventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 160
    OutboxDLQTopic:
      name: topic
      in: query
      required: false
      schema:
        type: string
        maxLength: 160
    OutboxDLQLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Version conflict or idempotency-key payload mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, uniqueness, merge redirect, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GuardrailOrWriteConflict:
      description: Optimistic concurrency/idempotency conflict, or a guardrail-required critical transition that must use its guarded path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Endpoint or command is intentionally deferred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Required service or runtime configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SOPDefinition:
      type: object
      additionalProperties: false
      required:
        - sop_id
        - tenant_id
        - code
        - name
        - description
        - status
        - version_count
        - row_version
        - created_at
        - updated_at
      properties:
        sop_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - retired
        active_sop_version_id:
          type:
            - string
            - "null"
          format: uuid
        version_count:
          type: integer
          minimum: 0
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          $ref: "#/components/schemas/SOPProofPolicy"
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - trace_id
      properties:
        items:
          type: array
          items:

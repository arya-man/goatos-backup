          nullable: true
        operational_location_display:
          type: string
        management_stage:
          type: string
        age_band:
          type: string
        total_live:
          type: integer
        reclassified:
          type: integer
          description: Animals whose stage genuinely changed. Only these were written and evented.
        unchanged:
          type: integer
        idempotency_key:
          type: string
        trace_id:
          type: string

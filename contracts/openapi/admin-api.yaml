    post:
      tags:
        - Import Runs
      operationId: reviewImportRunRow
      summary: Apply a safe review action to a staged import row.
      description: >-
        reject terminates the row; fix patches whitelisted normalized sex/breed;
        reapply requeues an eligible needs_review row to pending so the approved
        RFID apply path can mint the goat. This endpoint never mints a goat
        itself. Requires import.run.manage.
      parameters:
        - $ref: "#/components/parameters/ImportRunId"
        - $ref: "#/components/parameters/ImportRowId"
        - $ref: "#/components/parameters/IdempotencyKey"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProcurementLoadId:
      name: load_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProcurementWorkState:
      name: work_state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProcurementWorkState"
    ProcurementSeverity:
      name: severity
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProcurementSeverity"
    ProcurementLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    ProcurementCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    LocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPId:
      name: sop_id
      in: path
      required: true
      schema:
        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPId:
      name: sop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AliasId:
      name: alias_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapacityRecordId:
      name: capacity_record_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentifierId:
      name: identifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, uniqueness, merge redirect, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Endpoint or command is intentionally deferred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Required service or runtime configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SOPDefinition:
      type: object
      additionalProperties: false
      required:
        - sop_id
        - tenant_id
        - code
        - name
        - description
        - status
        - version_count
        - row_version
        - created_at
        - updated_at
      properties:
        sop_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - retired
        active_sop_version_id:
          type:
            - string
            - "null"
          format: uuid
        version_count:
          type: integer
          minimum: 0
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - trace_id
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SOPDefinition"
        trace_id:
          type: string
    SOPResponse:
      type: object
      additionalProperties: false
      required:
        - sop
        - trace_id
      properties:
        sop:
          $ref: "#/components/schemas/SOPDefinition"
        latest_version:
          oneOf:
            - $ref: "#/components/schemas/SOPVersion"
            - type: "null"
        trace_id:
          type: string
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - trace_id
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    CreateSOPRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
    CreateSOPVersionRequest:
      type: object
      additionalProperties: false
      required:
        - version_label
        - form_dsl
        - proof_policy
      properties:
        version_label:
          type: string
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
    RowVersionRequest:
      type: object
      additionalProperties: false
      required:
        - row_version
      properties:
        row_version:
          type: integer
          minimum: 1
    ProofReference:
      type: object
      additionalProperties: false
      required:
        - proof_id
        - proof_type
        - subject_type
        - upload_state
        - metadata
      properties:
        proof_id:
          type: string
        proof_type:
          type: string
          enum:
            - photo
            - video
            - attachment
        subject_type:
          type: string
          enum:
            - batch
            - goat
            - shed
            - task
            - other
        subject_id:
          type:
            - string
            - "null"
        upload_state:
          type: string
          enum:
            - pending
            - uploading
            - completed
            - failed
        metadata:
          type: object
          additionalProperties: true
    DryRunRequest:
      type: object
      additionalProperties: false
      required:
        - answers
        - proof_refs
      properties:
        answers:
          type: object
          additionalProperties: true
        proof_refs:
          type: array
          items:
            $ref: "#/components/schemas/ProofReference"
        context:
          type: object
          additionalProperties: true
    FieldState:
      type: object
      additionalProperties: false
      required:
        - key
        - visible
        - required
        - blocked
      properties:
        key:
          type: string
        visible:
          type: boolean
        required:
          type: boolean
        blocked:
          type: boolean
        message:
          type: string
    DryRunResponse:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
        - field_states
        - workflow_path
        - final_state
        - trace_id
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        field_states:
          type: array
          items:
            $ref: "#/components/schemas/FieldState"
        workflow_path:
          type: array
          items:
            type: string
        final_state:
          type: string
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - tenant_id
        - sop_id
        - sop_version_id
        - sop_code
        - task_type
        - title
        - description
        - state
        - scope_type
        - scope_id
        - priority
        - context
        - row_version
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_version_id:
          type: string
          format: uuid
        sop_code:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
            - queued
            - assigned
            - in_progress
            - submitted
            - accepted
            - needs_review
            - rework_requested
            - rejected
            - canceled
        assigned_to:
          type:
            - string
            - "null"
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        due_at:
          type:
            - string

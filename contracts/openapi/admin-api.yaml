          format: uuid
        scope_type:
          type: string
          enum:
            - tenant
            - center
            - shed
        scope_id:
          type: string
          format: uuid
        backup_group_code:
          type: string
          minLength: 1
          maxLength: 80
        backup_position_code:
          type: string
          minLength: 1
          maxLength: 80
        position_tier:
          type: string
          enum:
            - assistant
            - manager
            - head
            - director
            - cxo
        week_off_weekday:
          type:
            - string
            - "null"
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
    ImportPositionsRequest:
      type: object
      additionalProperties: false
      description: >-
        Bulk create/replace of fixed position seats from a parsed timetable
        import. Each row follows the same replace semantics and validation as a
        single POST /admin/roster/positions. When an Idempotency-Key is
        supplied, each row is deduplicated deterministically by (key, row index)
        so an interrupted import can be safely retried.
      required:
        - rows
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/CreatePositionRequest"
    ImportPositionsResponse:
      type: object
      additionalProperties: false
      required:
        - imported
        - failed
        - results
        - trace_id
      properties:

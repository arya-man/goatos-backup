  /admin/goats/shed-stage/commit:
    post:
      tags:
        - Admin Goats
      operationId: commitReclassifyShedStage
      summary: Apply a management stage to every live animal in one shed partition.
      description: >-
        Applies immediately: there is no approval step and no proof, so the Idempotency-Key is what
        stops a double-clicked button from re-emitting stage-change events. Animals already carrying
        the target tag are left untouched and emit no event. The tag also carries kid/adult, so
        age_band moves with it and vaccination re-derives each affected animal's schedule. A
        clinical target (sick, under_treatment, recovering, quarantine, icu) is rejected: those are
        set by the animal's own health workflow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassifyShedStageRequest"
      responses:
        "200":
          description: Pen reclassified, or the original result replayed for an exact retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassifyShedStageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"

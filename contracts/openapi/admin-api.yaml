            - head
            - director
            - cxo
            - null
        backup_group_code:
          type:
            - string
            - "null"
          maxLength: 80
        week_off_weekday:
          type:
            - string
            - "null"
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
        vaccination_daily_animal_cap:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100000
          description: >-
            Sets this operator seat's vaccination animal/day capacity. Null
            clears the custom cap so the scheduler falls back to the tenant
            default. Omit the field to leave the current cap/default unchanged.

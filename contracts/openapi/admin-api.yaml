      description: >-
        Corrects a goat's date of birth and/or arrival (entry) date — a later data-entry fix. At
        least one of dob or entry_date must be provided; an absent field is left untouched. The
        correction durably emits goat.identity.changed so the vaccination recheck consumer recomputes
        obligations. Vaccination history outranks these anchors per vaccine: where a same-vaccine
        accepted administration already exists, after_previous_completion continues to own scheduling
        and the correction never replaces or duplicates that completion-anchored dose.

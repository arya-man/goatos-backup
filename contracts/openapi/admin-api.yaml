openapi: 3.1.0
info:
  title: Goat OS Admin API
  version: 0.1.0
  summary: Goat OS Admin API for auth audit, location/workforce/SOP admin, and goat identifier mutations.
  description: REST/JSON API for admin web. Deleted import-review, identity-review, legacy sync, counts, and mortality
    dashboard APIs are not active contracts.
servers:
  - url: https://admin-api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Auth Sessions
  - name: Admin Goats
  - name: Locations
  - name: Operator Management
  - name: SOP Builder
  - name: Tasks
  - name: Procurement Source Entry
  - name: Operations Audit
  - name: HR Roster
paths:
  /auth/session-events:
    post:
      tags:
        - Auth Sessions
      operationId: recordAuthSessionEvent
      summary: Record a token-verified admin auth session event.
      description: Grant-independent auth audit route used by admin-web when creating, refreshing, or deleting the Firebase
        ID-token cookie. The backend verifies the bearer token, maps external IdP subjects to the stable internal actor
        UUID, falls back to X-GoatOS-Tenant-ID for Firebase tenant context, and writes audit_log without storing raw
        tokens.
      parameters:
        - name: X-GoatOS-Tenant-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Required when the verified bearer token has no Goat OS tenant claim.
        - name: X-GoatOS-Session-User-Agent
          in: header
          required: false
          schema:
            type: string
            maxLength: 512
          description: Original browser user-agent forwarded by admin-web for audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSessionEventRequest"
      responses:
        "204":
          description: Auth session event recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/operators:
    get:
      tags:
        - Operator Management
      operationId: listOperators
      summary: List tenant-scoped workforce operators.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: role_hint
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
      responses:
        "200":
          description: Operator roster rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Operator Management
      operationId: createOperator
      summary: Create an operator profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperatorRequest"
      responses:
        "200":
          description: Created operator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/operators/{operator_id}:
    get:
      tags:
        - Operator Management
      operationId: getOperator
      summary: Get an operator profile.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      responses:
        "200":
          description: Operator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
    patch:
      tags:
        - Operator Management
      operationId: updateOperator
      summary: Update an operator profile.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperatorRequest"
      responses:
        "200":
          description: Updated operator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/operators/{operator_id}/activate:
    post:
      tags:
        - Operator Management
      operationId: activateOperator
      summary: Activate an operator profile.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
      responses:
        "200":
          description: Activated operator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/operators/{operator_id}/deactivate:
    post:
      tags:
        - Operator Management
      operationId: deactivateOperator
      summary: Deactivate an operator profile.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
      responses:
        "200":
          description: Deactivated operator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/operators/{operator_id}/grants:
    get:
      tags:
        - Operator Management
      operationId: listOperatorGrants
      summary: List DB-authoritative grants for an operator.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      responses:
        "200":
          description: Operator grant rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantListResponse"
    post:
      tags:
        - Operator Management
      operationId: createOperatorGrant
      summary: Create an active role/scope grant for an operator.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "200":
          description: Current operator grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantListResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/operators/{operator_id}/capabilities:
    post:
      tags:
        - Operator Management
      operationId: assignOperatorCapability
      summary: Assign an operator capability.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapabilityRequest"
      responses:
        "200":
          description: Capability assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResponse"
  /admin/operators/{operator_id}/capabilities/{capability_id}:
    delete:
      tags:
        - Operator Management
      operationId: removeOperatorCapability
      summary: Revoke an operator capability assignment.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Capability assignment revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResponse"
  /admin/operators/{operator_id}/devices:
    get:
      tags:
        - Operator Management
      operationId: listOperatorDevices
      summary: List operator devices.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
      responses:
        "200":
          description: Operator devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
  /admin/operators/{operator_id}/devices/{device_id}/revoke:
    post:
      tags:
        - Operator Management
      operationId: revokeOperatorDevice
      summary: Revoke an Android device.
      parameters:
        - $ref: "#/components/parameters/OperatorId"
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeDeviceRequest"
      responses:
        "200":
          description: Revoked device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/sops:
    get:
      tags:
        - SOP Builder
      operationId: listSOPs
      summary: List SOP definitions.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: code_prefix
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: SOP definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - SOP Builder
      operationId: createSOP
      summary: Create an SOP definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSOPRequest"
      responses:
        "200":
          description: Created SOP definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/sops/{sop_id}:
    get:
      tags:
        - SOP Builder
      operationId: getSOP
      summary: Get an SOP definition and latest version.
      parameters:
        - $ref: "#/components/parameters/SOPId"
      responses:
        "200":
          description: SOP definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/sops/{sop_id}/versions:
    post:
      tags:
        - SOP Builder
      operationId: createSOPVersion
      summary: Create a draft SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSOPVersionRequest"
      responses:
        "200":
          description: Created SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/sops/{sop_id}/versions/{sop_version_id}:
    get:
      tags:
        - SOP Builder
      operationId: getSOPVersion
      summary: Get a specific SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPId"
        - $ref: "#/components/parameters/SOPVersionId"
      responses:
        "200":
          description: SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/sops/{sop_id}/versions/{sop_version_id}/dry-run:
    post:
      tags:
        - SOP Builder
      operationId: dryRunSOPVersion
      summary: Run server-side SOP preview validation.
      parameters:
        - $ref: "#/components/parameters/SOPId"
        - $ref: "#/components/parameters/SOPVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DryRunRequest"
      responses:
        "200":
          description: Dry-run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DryRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /admin/sops/{sop_id}/versions/{sop_version_id}/publish:
    post:
      tags:
        - SOP Builder
      operationId: publishSOPVersion
      summary: Publish an immutable SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPId"
        - $ref: "#/components/parameters/SOPVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowVersionRequest"
      responses:
        "200":
          description: Published SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/sops/{sop_id}/versions/{sop_version_id}/retire:
    post:
      tags:
        - SOP Builder
      operationId: retireSOPVersion
      summary: Retire an SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPId"
        - $ref: "#/components/parameters/SOPVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowVersionRequest"
      responses:
        "200":
          description: Retired SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/tasks:
    get:
      tags:
        - Tasks
      operationId: listTasks
      summary: List task and proof/rework queues.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: assigned_to
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: scope_type
          in: query
          required: false
          schema:
            type: string
        - name: scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Task rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      tags:
        - Tasks
      operationId: createTask
      summary: Create a task pinned to a published SOP version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: Created task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/tasks/{task_id}:
    get:
      tags:
        - Tasks
      operationId: getTask
      summary: Get task detail, pinned SOP version, and submission history.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/tasks/{task_id}/assign:
    post:
      tags:
        - Tasks
      operationId: assignTask
      summary: Assign or reassign a task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTaskRequest"
      responses:
        "200":
          description: Assigned task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/tasks/{task_id}/verify:
    post:
      tags:
        - Tasks
      operationId: verifyTask
      summary: Verify proof and accept a task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewTaskRequest"
      responses:
        "200":
          description: Accepted task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/tasks/{task_id}/rework:
    post:
      tags:
        - Tasks
      operationId: reworkTask
      summary: Request operator rework for a task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewTaskRequest"
      responses:
        "200":
          description: Rework requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/tasks/review-fanouts/retry:
    post:
      tags:
        - Tasks
      operationId: retrySOPReviewFanouts
      summary: Retry durable SOP review fanout rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryFanoutsRequest"
      responses:
        "200":
          description: Retry result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/tasks/submission-fanouts/retry:
    post:
      tags:
        - Tasks
      operationId: retrySOPSubmissionFanouts
      summary: Retry durable SOP submission fanout rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryFanoutsRequest"
      responses:
        "200":
          description: Retry result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/tasks/submission-fanouts/failed:
    get:
      tags:
        - Tasks
      operationId: listAgedFailedSOPSubmissionFanouts
      summary: List aged failed vaccination SOP submission fanouts.
      parameters:
        - name: older_than_minutes
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10080
            default: 15
          description: Only failed fanouts last updated at least this many minutes ago are returned.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Aged failed vaccination SOP submission fanouts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailedSubmissionFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/locations:
    get:
      tags:
        - Locations
      operationId: listLocations
      summary: List governed locations.
      description: Returns canonical location master rows with operational flags and lightweight usage counts.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: parent_location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: alias
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Location master rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Locations
      operationId: createLocation
      summary: Create a governed location.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "200":
          description: Location created or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/locations/{location_id}:
    get:
      tags:
        - Locations
      operationId: getLocation
      summary: Get a governed location.
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
    patch:
      tags:
        - Locations
      operationId: updateLocation
      summary: Update a governed location.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Location updated or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":

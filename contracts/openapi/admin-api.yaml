openapi: 3.1.0
info:
  title: Goat OS Admin API
  version: 0.1.0
  summary: Phase 1 Goat Passport import, reconciliation, and identity review API.
  description: REST/JSON API for admin web. Risky identity changes require evidence-backed decisions and idempotent writes.
servers:
  - url: https://admin-api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Import Runs
  - name: Identity Conflicts
  - name: Identity Candidates
  - name: Admin Goats
  - name: Correction Requests
  - name: Legacy Sync
paths:
  /admin/import-runs:
    get:
      tags:
        - Import Runs
      operationId: listImportRuns
      summary: List recent legacy import runs.
      description: Returns recent tenant-scoped import runs so reviewers can open a run without memorizing UUIDs.
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent import runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Import Runs
      operationId: createImportRun
      summary: Create a staged legacy import run.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRunRequest"
      responses:
        "201":
          description: Import run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunResponse"
        "200":
          description: Idempotent replay of a previously created import run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/import-runs/{import_run_id}:
    get:
      tags:
        - Import Runs
      operationId: getImportRun
      summary: Get an import run summary.
      parameters:
        - $ref: "#/components/parameters/ImportRunId"
      responses:
        "200":
          description: Import run summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/import-runs/{import_run_id}/rows:
    get:
      tags:
        - Import Runs
      operationId: listImportRunRows
      summary: List staged import rows and review state.
      parameters:
        - $ref: "#/components/parameters/ImportRunId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: processing_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ImportRowState"
        - name: reason_code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Import run rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunRowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/import-runs/{import_run_id}/rows/{import_row_id}/review:
    post:
      tags:
        - Import Runs
      operationId: reviewImportRunRow
      summary: Apply a safe review action to a staged import row.
      description: >-
        reject terminates the row; fix patches whitelisted normalized sex/breed;
        reapply requeues an eligible needs_review row to pending so the approved
        RFID apply path can mint the goat. This endpoint never mints a goat
        itself. Requires import.run.manage.
      parameters:
        - $ref: "#/components/parameters/ImportRunId"
        - $ref: "#/components/parameters/ImportRowId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewImportRowRequest"
      responses:
        "200":
          description: Updated import row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewImportRowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/import-runs/{import_run_id}/rows.csv:
    get:
      tags:
        - Import Runs
      operationId: exportImportRunRowsCSV
      summary: Download staged import rows as formula-safe CSV.
      description: >
        Streams the same whitelisted Import Review row fields exposed by
        listImportRunRows. scope=messy exports needs_review and
        error rows; scope=current exports the selected processing_state and/or
        reason_code filter.
      parameters:
        - $ref: "#/components/parameters/ImportRunId"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - messy
              - current
            default: messy
        - name: processing_state
          in: query
          required: false
          description: Used when scope=current.
          schema:
            $ref: "#/components/schemas/ImportRowState"
        - name: reason_code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Formula-safe CSV export of import review rows.
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/identity/review-summary:
    get:
      tags:
        - Identity Conflicts
      operationId: getReviewSummary
      summary: Open-queue totals (conflicts + candidates) for dashboard cards.
      responses:
        "200":
          description: Open review-queue totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/identity/conflicts:
    get:
      tags:
        - Identity Conflicts
      operationId: listIdentityConflicts
      summary: List identity conflicts requiring review.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConflictState"
        - name: conflict_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConflictType"
        - name: review_group
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewGroup"
      responses:
        "200":
          description: Conflict queue page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/identity/conflicts/bulk-resolve:
    post:
      tags:
        - Identity Conflicts
      operationId: bulkResolveIdentityConflicts
      summary: Resolve many conflicts with one human decision (evidence reviewed).
      description: >
        Applies one decision (keep_passport_value, use_legacy_value, or
        acknowledge_lifecycle_flag) to a bounded set of conflicts. Each conflict
        requires its expected row_version; the whole batch aborts if any conflict
        is missing, stale, or invalid for the decision. use_legacy_value is
        rejected for legacy self-conflicts and for breeds that are not approved
        canonical breeds. Each resolved conflict is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResolveConflictsRequest"
      responses:
        "200":
          description: Bulk resolution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResolveConflictsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/identity/conflicts/{conflict_id}:
    get:
      tags:
        - Identity Conflicts
      operationId: getIdentityConflict
      summary: Get conflict detail for side-by-side review.
      parameters:
        - $ref: "#/components/parameters/ConflictId"
      responses:
        "200":
          description: Conflict detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/identity/conflicts/{conflict_id}/resolve:
    post:
      tags:
        - Identity Conflicts
      operationId: resolveIdentityConflict
      summary: Resolve an identity conflict with a human-approved decision.
      parameters:
        - $ref: "#/components/parameters/ConflictId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveConflictRequest"
      responses:
        "200":
          description: Conflict resolved, including merge redirect details when relevant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveConflictResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/identity/candidates:
    get:
      tags:
        - Identity Candidates
      operationId: listIdentityCandidates
      summary: List actionable identity match candidates.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Candidate match page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/identity/candidates/{candidate_id}/approve:
    post:
      tags:
        - Identity Candidates
      operationId: approveIdentityCandidate
      summary: Approve a candidate match by attaching an identifier or merging the candidate's goats.
      description: >-
        Applies a safe, non-create approve outcome. decision_type=attach_identifier
        attaches an explicit (or deterministically RFID-extracted) identifier to one
        of the candidate's goats; decision_type=merge_goats merges the candidate's two
        goats using the existing merge invariants. Minting a new goat (approve-to-create)
        is intentionally not supported here and stays blocked on the conflict create_goat
        contract.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCandidateRequest"
      responses:
        "200":
          description: Candidate approval result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /admin/identity/candidates/{candidate_id}/reject:
    post:
      tags:
        - Identity Candidates
      operationId: rejectIdentityCandidate
      summary: Reject a candidate match without canonical mutation.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCandidateRequest"
      responses:
        "200":
          description: Candidate rejection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats:
    post:
      tags:
        - Admin Goats
      operationId: createAdminGoat
      summary: Create a reviewed goat identity record.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatRequest"
      responses:
        "201":
          description: Goat created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "200":
          description: Idempotent replay of a previously created goat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/goats/{goat_id}:
    patch:
      tags:
        - Admin Goats
      operationId: updateAdminGoat
      summary: Update canonical identity fields with optimistic concurrency.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatRequest"
      responses:
        "200":
          description: Goat updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats/{goat_id}/identifiers:
    post:
      tags:
        - Admin Goats
      operationId: addGoatIdentifier
      summary: Attach an identifier after policy and uniqueness checks.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIdentifierRequest"
      responses:
        "200":
          description: Identifier attached or conflict returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/goats/{goat_id}/identifiers/{identifier_id}/retire:
    post:
      tags:
        - Admin Goats
      operationId: retireGoatIdentifier
      summary: Retire an identifier with evidence and audit.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdentifierId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireIdentifierRequest"
      responses:
        "200":
          description: Identifier retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGoatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/identity/correction-requests:
    get:
      tags:
        - Correction Requests
      operationId: adminListCorrectionRequests
      summary: List correction requests visible to the admin.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CorrectionRequestState"
      responses:
        "200":
          description: Correction request page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/identity/correction-requests/{correction_request_id}/resolve:
    post:
      tags:
        - Correction Requests
      operationId: resolveCorrectionRequest
      summary: Resolve an operator correction request.
      parameters:
        - $ref: "#/components/parameters/CorrectionRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCorrectionRequest"
      responses:
        "200":
          description: Correction request resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/legacy-sync/sources:
    get:
      tags:
        - Legacy Sync
      operationId: listLegacySyncSources
      summary: List registered and observed legacy source freshness.
      description: >
        Returns backend-owned source registry rows plus observed unregistered
        sources. Admin-web uses this instead of reading BigQuery or Sheets
        directly.
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
            enum:
              - identity
              - lifecycle
              - current_location
              - active_count
      responses:
        "200":
          description: Legacy sync sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncSourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/legacy-sync/status:
    get:
      tags:
        - Legacy Sync
      operationId: getLegacySyncStatus
      summary: Get overall legacy sync freshness.
      description: Overall freshness is the worst critical source freshness plus counter freshness; noncritical degraded sources remain visible but do not make Phase 1 identity dashboards red.
      responses:
        "200":
          description: Legacy sync status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncOverallStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/legacy-sync/runs:
    get:
      tags:
        - Legacy Sync
      operationId: listLegacySyncRuns
      summary: List recent legacy sync runs.
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Legacy sync runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Legacy Sync
      operationId: createLegacySyncRun
      summary: Create a backend-owned legacy sync run.
      description: >
        Dry-runs are non-mutating and may be cold starts. Execute and nightly
        deep reconcile are accepted only as explicit blocked v1 runs until the
        backend executor is configured; they do not apply deltas, rebuild
        counters, or advance success watermarks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegacySyncRunRequest"
      responses:
        "201":
          description: Legacy sync run accepted or completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLegacySyncRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /admin/legacy-sync/runs/{sync_run_id}:
    get:
      tags:
        - Legacy Sync
      operationId: getLegacySyncRun
      summary: Get legacy sync run details and Source & Correction Log.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Legacy sync run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySyncRunDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /admin/legacy-sync/runs/{sync_run_id}/cancel:
    post:
      tags:
        - Legacy Sync
      operationId: cancelLegacySyncRun
      summary: Request cancellation for a legacy sync run.
      description: Cancellation records operator intent. If apply already started, atomic apply finishes or rolls back normally; successful watermarks do not advance unless apply plus counter rebuild already completed.
      parameters:
        - $ref: "#/components/parameters/SyncRunId"
      responses:
        "200":
          description: Legacy sync run after cancel request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelLegacySyncRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImportRunId:
      name: import_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportRowId:
      name: import_row_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentifierId:
      name: identifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrectionRequestId:
      name: correction_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SyncRunId:
      name: sync_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, uniqueness, merge redirect, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Endpoint or command is intentionally deferred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:

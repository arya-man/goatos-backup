    ReclassifyShedStageRequest:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - management_stage
      properties:
        shed_id:
          type: string
          format: uuid
          description: >-
            The PARENT physical shed. Never a partition-bearing alias row: the operational-location
            convention keeps goats.shed_id on the building and the pen in partition_label.
        partition_label:
          type: string
          maxLength: 80
          description: >-
            The pen inside shed_id ('1', 'Part 3'). Omitted or empty means the shed is genuinely
            undivided -- it does NOT mean "every partition of this shed". Matched tolerantly, so
            'Part 3' and '3' resolve to the same pen.
        management_stage:
          type: string
          minLength: 1
          maxLength: 80
          description: >-
            Target cohort tag, matched case-insensitively against the tenant's active stage
            vocabulary and echoed back canonicalized. Clinical states are rejected.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Required on commit, ignored on preview. Recorded in audit and on every animal's event.
        configure_empty:
          type: boolean
          description: >-
            Optional; absent means false. Allows the commit to succeed against a location holding
            NO live animals, writing only the configured cohort. Two callers want two different things from this write: the Counts
            Breakdown drawer means "retag the animals in this pen", where an empty pen almost always
            means the wrong pen was picked, so it leaves this false and receives 409
            `reclassify_empty_scope`; the Sheds directory means "this pen's tag is now X", which is
            ordinary for a pen standing empty before animals arrive, so it sets this true and
            receives a success with `reclassified` = 0. Part of the request hash, so the two intents
            cannot replay onto each other.
    ReclassifyShedStageBucket:
      type: object
      additionalProperties: false
      required:
        - management_stage
        - age_band
        - count
      properties:
        management_stage:
          type: string
        age_band:
          type: string
          description: kid, adult, or empty when the tag is deliberately unclassified.
        count:
          type: integer
          description: "Grain: live animal. Buckets are disjoint and sum to total_live."
    ReclassifyShedStagePreviewResponse:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - shed_name
        - partition_label
        - operational_location_display
        - management_stage
        - age_band
        - total_live
        - changing
        - unchanged
        - current_stages
      properties:
        shed_id:
          type: string
          format: uuid
        shed_name:
          type: string
        partition_label:
          type: string
          nullable: true
          description: Null for an undivided shed. The 'whole' sentinel is a matching key and never appears here.
        operational_location_display:
          type: string
          description: Backend-composed ("Castro - 2"). Clients render it verbatim and never recompose it.
        management_stage:
          type: string
          description: The canonical resolved target tag.
        age_band:
          type: string
          description: >-
            kid or adult, the band the target tag carries. Empty when the tag is deliberately
            unclassified, in which case animals keep the band they already have.
        total_live:
          type: integer
        changing:
          type: integer
          description: Animals whose stage differs from the target. changing + unchanged == total_live.
        unchanged:
          type: integer
          description: Animals already on the target tag. They will not be written or evented.
        current_stages:
          type: array
          items:
            $ref: "#/components/schemas/ReclassifyShedStageBucket"
          description: The pen's complete present composition, so a mixed pen is visible before the flip.
        trace_id:
          type: string
    ReclassifyShedStageResponse:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - shed_name
        - partition_label
        - operational_location_display
        - management_stage
        - age_band
        - total_live
        - reclassified
        - unchanged
      properties:

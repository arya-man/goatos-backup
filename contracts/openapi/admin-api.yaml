      tags:
        - Identity Conflicts
      operationId: bulkResolveIdentityConflicts
      summary: Resolve many conflicts with one human decision (evidence reviewed).
      description: >
        Applies one decision (keep_passport_value, use_legacy_value, or
        acknowledge_lifecycle_flag) to a bounded set of conflicts. Each conflict
        requires its expected row_version; the whole batch aborts if any conflict
        is missing, stale, or invalid for the decision. use_legacy_value is
        rejected for legacy self-conflicts and for breeds that are not approved
        canonical breeds. Each resolved conflict is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResolveConflictsRequest"
      responses:
        "200":
          description: Bulk resolution result.

    RecordWeighingAnimalObservationRequest:
      type: object
      additionalProperties: false
      required:
        - campaign_shed_id
        - scanned_identifier
        - weight_kg
        - proof_artifact_id
        - actual_location_id
      properties:
        campaign_shed_id:
          type: string
          format: uuid
        # Weighing is free-flow: the raw scanned identifier is the required
        # identity. There is deliberately no animal_id field here at all --
        # weighing never resolves a scan to herd identity (backend
        # domain.RecordAnimalObservation carries no such field either), and the
        # backing column was dropped by
        # 000078_weighing_observations_drop_animal_id.sql.
        scanned_identifier:
          type: string
        weight_kg:
          type: number
          exclusiveMinimum: 0
        proof_artifact_id:
          type: string
          format: uuid
        actual_location_id:
          type: string
          format: uuid
    RecordWeighingShedObservationRequest:
      type: object
      additionalProperties: false
      required:
        - campaign_shed_id
        - weight_kg
        - animal_count
      properties:
        campaign_shed_id:
          type: string
          format: uuid
        weight_kg:
          type: number
          exclusiveMinimum: 0
        average_weight_kg:
          type: number
          exclusiveMinimum: 0
        animal_count:
          type: integer
          minimum: 1
        proof_artifact_id:
          type: string
          format: uuid
        proof_artifact_ids:
          type: array
          items:
            type: string
            format: uuid
    WeighingObservation:
      type: object
      additionalProperties: false
      required:
        - observation_id
        - campaign_id
        - weight_kg
        - proof_artifact_id
        - accepted_at
      properties:
        observation_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_shed_id:
          type: string
          format: uuid
        # The raw scanned identifier (RFID/ear tag) the scanner read. Weighing is
        # free-flow: this is the ONLY identity an observation carries. There is
        # deliberately no animal_id here -- weighing never resolves a scan to
        # herd identity, and the backing column was dropped by
        # 000078_weighing_observations_drop_animal_id.sql. NOT a uuid: a real
        # RFID is not UUID-shaped.
        scanned_identifier:
          type: string
        weight_kg:
          type: number
        average_weight_kg:
          type: number
        animal_count:
          type: integer
        proof_artifact_id:
          type: string
          format: uuid
        proof_artifact_ids:
          type: array
          items:
            type: string
            format: uuid
        media:
          type: array
          items:
            $ref: "#/components/schemas/WeighingProofMedia"
        expected_location_id:
          type: string
          format: uuid
        actual_location_id:
          type: string
          format: uuid
        actual_location_label:
          type: string
        accepted_at:
          type: string
          format: date-time
    WeighingProofMedia:
      type: object
      additionalProperties: false
      required:

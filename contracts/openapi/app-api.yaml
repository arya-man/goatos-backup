    ImpactPreviewInput:
      type: object
      additionalProperties: false
      description: >-
        Config impact-preview filter. Empty filter dims mean "any". Preview is aggregate-only over the
        eligibility rollup, so there is no per-goat dose count and no time-relative warmup on this path.
      properties:
        species:
          type: string
        stage:
          type: string
        sex:
          type: string
        breed:
          type: string
        health:
          type: string
        park_id:
          type: string
        vaccine_item_id:
          type: string
        location_id:
          type: string
        dose_rows:
          type: integer
          minimum: 0
          description: Number of selected dose/schedule rows (vaccination cells per eligible animal).
        daily_cap:
          type: integer
          minimum: 1
          description: >-
            Draft daily vaccination cap (vaccinations/day) authored in the rule editor, used to compute
            estimated_days BEFORE publish. Omit to fall back to the published/operational cap.
        max_buffer_days:
          type: integer
          minimum: 0
          description: >-
            Draft safe-window buffer (days) authored in the rule editor. Omit to fall back to the
            business default. Drives the within_cap / over_cap (split) / capacity_breach classification.
        horizon_days:
          type: integer
          minimum: 0
    ImpactPreviewResult:
      type: object
      additionalProperties: false
      description: >-
        Aggregate-only config impact preview. Every number is read from the precomputed vaccination
        eligibility rollup (read model); the request path never scans goats. Use the business names
        only (eligible_animals / vaccination_cells / affected_sheds / estimated_days / daily_cap).
      required:
        - eligible_animals
        - vaccination_cells
        - affected_sheds
        - estimated_days
        - daily_cap
        - planned_sessions
        - source_revision
        - warnings
      properties:
        eligible_animals:
          type: integer
          description: SUM(animal_count) over usable animals matching the filter.
        vaccination_cells:
          type: integer
          description: eligible_animals × selected dose rows.
        affected_sheds:
          type: integer
          description: Distinct sheds holding usable animals in scope.
        estimated_days:
          type: integer
          description: ceil(vaccination_cells / daily_cap).
        daily_cap:
          type: integer
          description: Configured vaccinations/day used for estimated_days.
        capacity_status:
          type: string
          enum: [within_cap, over_cap, capacity_breach]
          description: >-
            Planner classification of the draft under daily_cap + the buffer window: within_cap (fits one
            day), over_cap (Split — fits the safe window), capacity_breach (Needs review — beyond it).
            Omitted when there are no cells to plan.
        planned_sessions:
          type: array
          description: >-
            Pre-publish session split under the draft daily cap. Bounded for very large herds; estimated_days
            remains the full duration when the preview is truncated.
          items:
            $ref: "#/components/schemas/VaccinationPlannedSession"
        doses_available:
          type: string
          description: Optional cheap stock check; present only when a vaccine item is set.
        earliest_expiry:
          type: string
          format: date-time
        source_revision:
          type: integer
          format: int64
          description: Read-model recompute stamp behind these numbers (0 when the rollup has no data for the scope yet).
        recomputed_at:
          type: string
          format: date-time
          description: When the read-model grain behind these numbers was last rebuilt.
        warnings:
          type: array
          items:
            type: string

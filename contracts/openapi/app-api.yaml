        - Vaccination
      operationId: vaccinationVerificationQueue
      summary: List recorded vaccination completions awaiting proof verification.
      parameters:
        - name: park_id
          in: query
          required: false
          description: Optional park scope (top-bar park); filters the queue to that park's completions.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1

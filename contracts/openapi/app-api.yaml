openapi: 3.1.0
info:
  title: Goat OS App API
  version: 0.1.0
  summary: Goat OS app and operating API for field tasks, goat lookup, protocol config, vaccination, and process integrity.
  description: REST/JSON API for operator/mobile and current admin-web operating surfaces. Reads and writes are RBAC
    scope-filtered before response DTOs are built.
servers:
  - url: https://api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Operator App Bootstrap
  - name: Operator Tasks
  - name: Goats
  - name: Identifiers
  - name: Protocol Config
  - name: Action Center
  - name: Vaccination
  - name: Vaccination Passport
paths:
  /app/me:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appMe
      summary: Return the authenticated actor's operator profile and active grants.
      responses:
        "200":
          description: Actor/operator context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/bootstrap:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appBootstrap
      summary: Return the Android bootstrap manifest for the authenticated operator.
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bootstrap manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/devices/register:
    post:
      tags:
        - Operator App Bootstrap
      operationId: registerAppDevice
      summary: Register or refresh an Android app install for the authenticated operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/devices/{device_id}/heartbeat:
    post:
      tags:
        - Operator App Bootstrap
      operationId: heartbeatAppDevice
      summary: Update Android device heartbeat and app version state.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatDeviceRequest"
      responses:
        "200":
          description: Device heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/tasks:
    get:
      tags:
        - Operator Tasks
      operationId: listAppTasks
      summary: List assigned operator tasks.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Assigned tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/tasks/{task_id}:
    get:
      tags:
        - Operator Tasks
      operationId: getAppTask
      summary: Get task detail and pinned SOP version.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /app/sop-versions/{sop_version_id}:
    get:
      tags:
        - Operator Tasks
      operationId: getAppSOPVersion
      summary: Download a pinned SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPVersionId"
      responses:
        "200":
          description: SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /app/tasks/{task_id}/submissions:
    post:
      tags:
        - Operator Tasks
      operationId: submitAppTask
      summary: Submit an idempotent SOP task response.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: Submission result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /goats/search:
    get:
      tags:
        - Goats
      operationId: searchGoats
      summary: Search visible goat passports by identifier, display ID, location, status, breed, or sex.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: goat_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: identifier_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IdentifierType"
        - name: scope_key
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: breed
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: sex
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: farm_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        "200":
          description: Scope-filtered goat search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /goats/{goat_id}:
    get:
      tags:
        - Goats
      operationId: getGoatPassport
      summary: Get a scope-filtered goat passport.
      parameters:
        - $ref: "#/components/parameters/GoatId"
      responses:
        "200":
          description: Goat passport detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatPassportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /goats/{goat_id}/timeline:
    get:
      tags:
        - Goats
      operationId: getGoatTimeline
      summary: Get a scope-filtered goat identity timeline.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Goat identity timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatTimelineResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /identifiers/{type}/{value}/resolve:
    get:
      tags:
        - Identifiers
      operationId: resolveIdentifier
      summary: Resolve an identifier under explicit scope context when needed.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierType"
        - name: value
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: scope_key
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: farm_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Identifier resolution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentifierResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /protocols:
    post:
      tags:
        - Protocol Config
      operationId: createProtocolDefinition
      summary: Create a protocol definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProtocolDefinitionRequest"
      responses:
        "201":
          description: Protocol definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProtocolDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/{protocol_id}/versions:
    post:
      tags:
        - Protocol Config
      operationId: createProtocolVersion
      summary: Create a draft protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProtocolVersionRequest"
      responses:
        "201":
          description: Protocol version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProtocolVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}/rules:
    post:
      tags:
        - Protocol Config
      operationId: addProtocolRule
      summary: Add a dose/phase rule to a draft protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProtocolRuleRequest"
      responses:
        "201":
          description: Protocol rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddProtocolRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}:
    get:
      tags:
        - Protocol Config
      operationId: getProtocolVersion
      summary: Get a protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      responses:
        "200":
          description: Protocol version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}/publish:
    post:
      tags:
        - Protocol Config
      operationId: publishProtocolVersion
      summary: Publish a source-backed protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      responses:
        "204":
          description: Protocol version published.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/vaccination/impact-preview:
    post:
      tags:
        - Vaccination
      operationId: vaccinationImpactPreview
      summary: Preview vaccination impact for eligible goats, drive batches, and stock.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactPreviewInput"
      responses:
        "200":
          description: Vaccination impact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactPreviewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /action-center/obligations:
    get:
      tags:
        - Action Center
      operationId: listActionCenterObligations
      summary: List bounded vaccination obligations for the operating work table.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
          description: Current compatibility alias for work_state.
        - name: work_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Action Center rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionCenterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /vaccination/verification-queue:
    get:
      tags:
        - Vaccination
      operationId: vaccinationVerificationQueue
      summary: List recorded vaccination completions awaiting proof verification.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Vaccination verification queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationQueueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /vaccination/completions/{completion_id}/accept:
    post:
      tags:
        - Vaccination
      operationId: acceptVaccinationCompletion
      summary: Accept a recorded vaccination completion.
      parameters:
        - $ref: "#/components/parameters/CompletionId"
      responses:
        "200":
          description: Completion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptVaccinationCompletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /vaccination/completions/{completion_id}/reject:
    post:
      tags:
        - Vaccination
      operationId: rejectVaccinationCompletion
      summary: Reject or request rework for a recorded vaccination completion.
      parameters:
        - $ref: "#/components/parameters/CompletionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectVaccinationCompletionRequest"
      responses:
        "200":
          description: Completion rejected or marked for rework.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectVaccinationCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /goats/{goat_id}/passport:
    get:
      tags:
        - Vaccination Passport
      operationId: getGoatVaccinationPassport
      summary: "Get a goat vaccination passport: open obligations, next due, last accepted dose, and history."
      parameters:
        - $ref: "#/components/parameters/GoatId"
      responses:
        "200":
          description: Vaccination passport.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationPassport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CompletionId:
      name: completion_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, stale SOP version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot pass the current source-backed gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency or feature wiring is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - trace_id
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - tenant_id
        - sop_id
        - sop_version_id
        - sop_code
        - task_type
        - title
        - description
        - state
        - scope_type
        - scope_id
        - priority
        - context
        - row_version
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_version_id:
          type: string
          format: uuid
        sop_code:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
            - queued
            - assigned
            - in_progress
            - submitted
            - accepted
            - needs_review
            - rework_requested
            - rejected
            - canceled
        assigned_to:
          type:
            - string
            - "null"
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        priority:
          type: string
        due_at:
          type:
            - string
            - "null"
          format: date-time
        context:

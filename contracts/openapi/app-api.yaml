openapi: 3.1.0
info:
  title: Goat OS App API
  version: 0.1.0
  summary: Goat OS app and operating API for field tasks, goat lookup, protocol config, vaccination, and process integrity.
  description: REST/JSON API for operator/mobile and current admin-web operating surfaces. Reads and writes are RBAC
    scope-filtered before response DTOs are built.
servers:
  - url: https://api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Operator App Bootstrap
  - name: Admin Web Bootstrap
  - name: Operator Tasks
  - name: SOP Admin
  - name: Goats
  - name: Identifiers
  - name: Protocol Config
  - name: Action Center
  - name: Control Tower
  - name: Protocol Adherence
  - name: Workflows
  - name: Proof Media
  - name: Vaccination
  - name: Feed Direction
  - name: Feed Config
  - name: Calendar
  - name: Vaccination Passport
  - name: Herd Register
  - name: Verification
  - name: Counts
  - name: Weighing
paths:
  /admin/tasks/review-fanouts/retry:
    post:
      tags:
        - SOP Admin
      operationId: retrySOPReviewFanouts
      summary: Retry pending or failed task review fanout rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryReviewFanoutsRequest"
      responses:
        "200":
          description: Review fanouts retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryReviewFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/me:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appMe
      summary: Return the authenticated actor's operator profile and active grants.
      responses:
        "200":
          description: Actor/operator context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/bootstrap:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appBootstrap
      summary: Return the Android bootstrap manifest for the authenticated operator.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/GoatOSLocale"
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bootstrap manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin-web/bootstrap:
    get:
      tags:
        - Admin Web Bootstrap
      operationId: adminWebBootstrap
      summary: Return the backend-owned admin-web UI contract.
      description: >-
        Read-only shell/page contract for admin-web IA, nav, route labels, top-bar controls,
        role lenses, page/table/drawer metadata, disabled reasons, and summary-vs-detail
        display rules. Frontend renders this contract and owns only layout/local UI state.
      responses:
        "200":
          description: Admin-web UI contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWebBootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /weighing/campaigns:
    get:
      tags:
        - Weighing
      operationId: listWeighingCampaigns
      summary: List leadership-visible Weighing campaigns.
      parameters:
        - name: park_id
          in: query
          required: false
          description: >-
            Optional park filter. It narrows the returned ROWS only; `counts` stays a
            whole-scope aggregate so the Active/Completed tallies do not move when the
            park chip changes.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 20
      responses:
        "200":
          description: Weighing campaigns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Weighing
      operationId: createWeighingCampaign
      summary: Create a weekly kids Weighing campaign draft.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeighingCampaignRequest"
      responses:
        "200":
          description: Weighing campaign created or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /weighing/campaigns/{campaign_id}:
    put:
      tags:
        - Weighing
      operationId: updateWeighingCampaign
      summary: Edit an existing weekly kids Weighing campaign without creating a duplicate park/week task.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeighingCampaignRequest"
      responses:
        "200":
          description: Weighing campaign updated or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /weighing/campaigns/{campaign_id}/publish:
    post:
      tags:
        - Weighing
      operationId: publishWeighingCampaign
      summary: Publish a Weighing campaign to operator-visible work.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Weighing campaign published or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns:
    get:
      tags:
        - Weighing
      operationId: appListWeighingCampaigns
      summary: List Weighing campaigns for one weighing surface.
      description: >
        The three weighing surfaces are separate destinations with separate authority, so the
        caller names the one it wants instead of the server inferring it from the actor's roles.
        `mine` is the caller's own assigned sheds and is the only executable list
        (`weighing.execute`); `all` is the planner's flat all-tasks list across parks
        (`weighing.plan` or `weighing.monitor`); `operators` is read-only oversight of other
        people's weighing work (`weighing.oversee_operators`) and carries no scan action.
        Omitting the parameter means `mine`. No scope widens the write: recording a weight still
        requires the caller to be the shed's assignee.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [mine, all, operators]
            default: mine
        - name: park_id
          in: query
          required: false
          description: >-
            Optional park filter. It narrows the returned ROWS only; `counts` stays a
            whole-scope aggregate so the Active/Completed tallies do not move when the
            park chip changes.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 20
      responses:
        "200":
          description: Operator Weighing campaigns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/planner/catalog:
    get:
      tags:
        - Weighing
      operationId: appWeighingPlannerCatalog
      summary: Get every Weighing planner park for a weigh date, with the operator picker.
      description: >
        PARK-GRAIN read. It returns EVERY park the planner may use on the requested date --
        each with a park-grain shed COUNT, a park-grain kid count, and the park's existing task
        on that date -- plus the operator picker the wizard holds while it pages buckets.
        It carries NO shed rows and has no cursor: a park picker that paged could not offer the
        parks it had not reached yet. Read the chosen park's sheds, with their date-scoped
        availability, from /app/weighing/planner/parks/{park_id}/buckets.
      parameters:
        - name: period_start_date
          in: query
          required: true
          description: The Asia/Kolkata business DATE the existing-task decoration is read for.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Every planner park for the date, plus the operator picker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingPlannerCatalogResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/planner/parks/{park_id}/buckets:
    get:
      tags:
        - weighing
      operationId: appWeighingPlannerParkBuckets
      summary: Page one Weighing planner park's kid sheds with their availability on a weigh date.
      description: >
        Availability is scoped to ONE weigh date: each shed reports whether an open weighing
        task already claims it on that date, and by whom. A shed claimed on another date is
        not claimed here. A real park holds 76+ sheds, so this is a keyset page; the park list
        it drills from is a separate unpaged read.
      parameters:
        - name: park_id
          in: path
          required: true
          description: The park whose sheds are paged.
          schema:
            type: string
            format: uuid
        - name: period_start_date
          in: query
          required: true
          description: The Asia/Kolkata business DATE the availability is reported for.
          schema:
            type: string
            format: date
        - name: exclude_campaign_id
          in: query
          required: false
          description: >-
            The task currently being edited. Its own buckets are not reported as taken, so an
            edit can re-save the sheds it already owns.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as next_cursor by the previous page of THIS park.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Shed rows per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One keyset page of the park's buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingPlannerParkBucketsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds:
    get:
      tags:
        - Weighing
      operationId: appListWeighingCampaignSheds
      summary: Page one Weighing task's shed buckets.
      description: >
        The task-detail bucket list. It exists so the detail screen stops rendering the bucket
        set that the task LIST embeds in every campaign row: a park holds 76+ sheds, so a
        20-task list page carried well over a thousand bucket rows. Keyset-paged on
        (display_name, campaign_shed_id). An assignee sees only their own buckets on the task;
        a planner or monitor sees all of them — the same split the task list already applies.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as next_cursor by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of the task's shed buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCampaignShedPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds/{campaign_shed_id}/roster:
    get:
      tags:
        - Weighing
      operationId: appGetWeighingScopeRoster
      summary: Get a bounded operator-visible RFID roster for one Weighing scope.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: campaign_shed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque roster cursor returned as next_cursor by the previous page.
        - name: observations_cursor
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque observations cursor returned as next_observations_cursor by
            the previous page. Paginates the observations array independently
            of items, on a keyset of (accepted_at, observation_id) scoped to
            this campaign_shed_id; it does not advance in lockstep with the
            roster cursor.
        - name: include_roster
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Set false for observation-only continuation pages after the roster cursor is exhausted.
      responses:
        "200":
          description: Weighing scope roster rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingRosterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/animal-observations:
    post:
      tags:
        - Weighing
      operationId: recordWeighingAnimalObservation
      summary: Record one proof-backed individual animal Weighing observation.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordWeighingAnimalObservationRequest"
      responses:
        "200":
          description: Animal observation accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingObservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/shed-observations:
    post:
      tags:
        - Weighing
      operationId: recordWeighingShedObservation
      summary: Record one proof-backed shed/partition Weighing observation.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordWeighingShedObservationRequest"
      responses:
        "200":
          description: Shed/partition observation accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingObservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/leadership/sheds:
    get:
      tags:
        - Weighing
      operationId: appListWeighingLeadershipSheds
      summary: List leadership-visible Weighing shed buckets with their captured evidence.
      description: >
        ONE keyset page of shed buckets across tasks, each with its own context and its first page
        of captured evidence. The leadership gallery's own read: building this page client-side
        meant one request per bucket (about 1,500 on a 76-shed park) on every screen open.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as next_cursor by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of shed buckets with their evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingLeadershipShedPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds/{campaign_shed_id}/videos:
    get:
      tags:
        - Weighing
      operationId: appGetWeighingShedVideos
      summary: Get leadership-visible proof videos for one Weighing scope.
      description: >
        The shed's captured evidence, plus the shed's own context (park name, weigh business
        date, assignee display name) so a cold deep link to this surface renders without the
        parent list having to hand those over. `individual` is a keyset page on
        (accepted_at, observation_id); `lump_sum` is a single latest row and is not paged.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: campaign_shed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as next_individual_cursor by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Shed proof media and observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingShedVideosResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds/{campaign_shed_id}/submit:
    post:
      tags:
        - Weighing
      operationId: submitWeighingIndividualScope
      summary: Idempotently close one individual-animal Weighing scope after proof-backed capture.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: campaign_shed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWeighingIndividualScopeRequest"
      responses:
        "200":
          description: Scope completed or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds/{campaign_shed_id}/close:
    post:
      tags:
        - Weighing
      operationId: closeWeighingScope
      summary: Close one Weighing scope after verification-approved evidence.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: campaign_shed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeighingCloseRequest"
      responses:
        "200":
          description: Scope closed or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCloseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/sheds/{campaign_shed_id}/abandon:
    post:
      tags:
        - Weighing
      operationId: abandonWeighingScope
      summary: Explicitly abandon one Weighing scope that will not be completed.
      parameters:
        - $ref: "#/components/parameters/WeighingCampaignId"
        - name: campaign_shed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeighingCloseRequest"
      responses:
        "200":
          description: Scope abandoned or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighingCloseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/weighing/campaigns/{campaign_id}/close:
    post:
      tags:
        - Weighing
      operationId: closeWeighingCampaign

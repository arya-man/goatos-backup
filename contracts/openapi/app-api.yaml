          $ref: "#/components/responses/ServiceUnavailable"
  /goats/{goat_id}/passport:
    get:
      tags:
        - Vaccination Passport
      operationId: getGoatVaccinationPassport
      summary: "Get a goat vaccination passport: open obligations, next due, last accepted dose, and history."
      parameters:
        - $ref: "#/components/parameters/GoatId"
      responses:
        "200":
          description: Vaccination passport.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationPassport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CompletionId:
      name: completion_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShedId:
      name: shed_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProofId:
      name: proof_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, stale SOP version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot pass the current source-backed gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency or feature wiring is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - trace_id
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - tenant_id
        - sop_id
        - sop_version_id
        - sop_code
        - task_type
        - title
        - description
        - state
        - scope_type
        - scope_id
        - priority
        - context
        - row_version
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_version_id:
          type: string
          format: uuid
        sop_code:
          type: string
        task_type:
          type: string
        title:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
            - queued
            - assigned
            - in_progress
            - submitted
            - accepted
            - needs_review
            - rework_requested
            - rejected
            - canceled
        assigned_to:
          type:
            - string
            - "null"
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        priority:
          type: string
        due_at:
          type:
            - string
            - "null"
          format: date-time
        context:
          type: object
          additionalProperties: true
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - trace_id
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        trace_id:
          type: string
    ProofReference:
      type: object
      additionalProperties: false
      required:
        - proof_id
        - proof_type
        - subject_type
        - upload_state
        - metadata
      properties:
        proof_id:
          type: string
        proof_type:
          type: string
          enum:
            - photo
            - video
            - attachment
        subject_type:
          type: string
          enum:
            - batch
            - goat
            - shed
            - task
            - vial_lot
            - administration
            - other
        subject_id:
          type:
            - string
            - "null"
        upload_state:
          type: string
          enum:
            - pending
            - uploading
            - completed
            - failed
        metadata:
          type: object
          additionalProperties: true
    CreateProofUploadRequest:
      type: object
      additionalProperties: false
      required:
        - proof_type
        - mime_type
        - scope_type
        - scope_id
        - subject_type
      properties:
        proof_type:
          type: string
          enum:
            - photo
            - video
            - attachment
        mime_type:
          type: string
        scope_type:
          type: string
          enum:
            - tenant
            - farm
            - park
            - shed
            - cohort
            - batch
            - task
            - goat
        scope_id:
          type: string
          format: uuid
        subject_type:
          type: string
          enum:
            - batch
            - goat
            - shed
            - task
            - vial_lot
            - administration
            - other
        subject_id:
          type:
            - string
            - "null"
          format: uuid
        metadata:
          type: object
          additionalProperties: true
    CompleteProofUploadRequest:
      type: object
      additionalProperties: false
      properties:
        content_hash:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
    ProofArtifact:
      type: object
      additionalProperties: false
      required:
        - proof_id
        - storage_provider
        - proof_type
        - subject_type
        - upload_state
        - mime_type
        - size_bytes
        - content_hash
        - metadata
        - created_at
      properties:
        proof_id:
          type: string
          format: uuid
        storage_provider:
          type: string
          enum:
            - local
            - gcs
        proof_type:
          type: string
          enum:
            - photo
            - video
            - attachment
        subject_type:
          type: string
        subject_id:
          type:
            - string
            - "null"
          format: uuid
        upload_state:
          type: string
          enum:
            - pending
            - uploading
            - completed
            - failed
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        duration_ms:
          type:
            - integer
            - "null"
          format: int64
        content_hash:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        uploaded_at:
          type:
            - string
            - "null"
          format: date-time
    CreateProofUploadResponse:
      type: object
      additionalProperties: false
      required:
        - proof
        - upload_url
        - upload_method
        - headers
        - expires_at
      properties:
        proof:
          $ref: "#/components/schemas/ProofArtifact"
        upload_url:
          type: string
        upload_method:
          type: string
          enum:
            - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ProofResponse:
      type: object
      additionalProperties: false
      required:
        - proof
      properties:
        proof:
          $ref: "#/components/schemas/ProofArtifact"
    DownloadProofResponse:
      type: object
      additionalProperties: false
      required:
        - download_url
      properties:
        download_url:
          type: string
    SubmissionItem:
      type: object
      additionalProperties: false
      required:
        - item_id
        - item_key
        - state
        - result
      properties:
        item_id:
          type: string
          format: uuid
        goat_id:
          type:
            - string
            - "null"
          format: uuid
        item_key:
          type: string
        state:
          type: string
          enum:
            - accepted
            - needs_review
            - rejected
            - skipped
        result:
          type: object
          additionalProperties: true
    SubmissionSummary:
      type: object
      additionalProperties: false
      required:
        - submission_id
        - task_id
        - sop_version_id
        - submitted_by
        - idempotency_key
        - answers
        - proof_refs
        - state
        - validation_report
        - items
        - submitted_at
        - row_version
      properties:
        submission_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        sop_version_id:
          type: string
          format: uuid
        submitted_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
        answers:
          type: object
          additionalProperties: true
        proof_refs:
          type: array
          items:
            $ref: "#/components/schemas/ProofReference"
        state:
          type: string
          enum:
            - submitted
            - accepted
            - needs_review
            - rejected
            - voided
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionItem"
        submitted_at:
          type: string
          format: date-time
        accepted_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
    TaskResponse:
      type: object
      additionalProperties: false
      required:
        - task
        - trace_id
      properties:
        task:
          $ref: "#/components/schemas/TaskSummary"
        sop_version:
          oneOf:
            - $ref: "#/components/schemas/SOPVersion"
            - type: "null"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionSummary"
        trace_id:
          type: string
    RetryReviewFanoutsRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    RetryReviewFanoutsResponse:
      type: object
      additionalProperties: false
      required:
        - applied
        - trace_id
      properties:
        applied:
          type: integer
          minimum: 0
        trace_id:
          type: string
    SubmitTaskRequest:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - idempotency_key
        - answers
        - proof_refs
      properties:
        sop_version_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
        answers:
          type: object
          additionalProperties: true
        proof_refs:
          type: array
          items:
            $ref: "#/components/schemas/ProofReference"
    SubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - submission
        - task
        - trace_id
      properties:
        submission:
          $ref: "#/components/schemas/SubmissionSummary"
        task:
          $ref: "#/components/schemas/TaskSummary"
        trace_id:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - field_errors
        - trace_id
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 500
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        trace_id:
          type: string
          minLength: 1
          maxLength: 200
        retryable:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:

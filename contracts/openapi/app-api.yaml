components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShedId:
      name: shed_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ProofId:
      name: proof_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, stale SOP version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot pass the current source-backed gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency or feature wiring is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - trace_id
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id

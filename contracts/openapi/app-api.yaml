      operationId: listVerificationQueue
      summary: List the Verifier's keyset-paginated media queue (generic Verification vertical).
      description: >-
        The standalone Verifier section's queue: media items awaiting or already given a verdict,
        category/vertical/module filtered, oldest-captured-first. Gated on verification.review only
        (separation of duty from capture and act). Media is returned as streamed signed download
        URLs resolved via the existing proof storage port -- never inline bytes.
      parameters:
        - name: category
          in: query
          required: false
          description: Verification type-registry category (e.g. vaccination_proof). Verifiers are assigned one or more categories.
          schema:
            type: string
            maxLength: 120
        - name: vertical
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: module
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          description: Defaults to pending.
          schema:
            $ref: "#/components/schemas/VerificationItemStatus"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Defaults to 20, capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: One keyset page of the verification queue.
          content:

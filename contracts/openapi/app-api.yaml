    WeighingAvailabilityStatus:
      type: string
      enum: [expected_shed, moved_other_shed, icu, quarantine, dead, culled, sold_transferred, exited, unknown_review]
    WeighingProgress:
      type: object
      additionalProperties: false
      required:
        - individual_expected_count
        - individual_completed_count
        - per_scope_expected_count
        - per_scope_completed_count
        - wrong_shed_count
        - missing_count
        - remaining_count
      properties:
        individual_expected_count:
          type: integer
          minimum: 0
        individual_completed_count:
          type: integer
          minimum: 0
        per_scope_expected_count:
          type: integer
          minimum: 0
        per_scope_completed_count:
          type: integer
          minimum: 0
        wrong_shed_count:
          type: integer
          minimum: 0
        missing_count:
          type: integer
          minimum: 0
        remaining_count:
          type: integer
          minimum: 0
    WeighingCampaignShed:
      type: object
      additionalProperties: false
      required:
        - campaign_shed_id
        - campaign_id
        - location_id
        - location_type
        - display_name
        - expected_animal_count
        - weighing_category
        - operator_user_id
        - operator_display_name
        - status
        - pending_verification_count
        - ready_to_close
        - captured_count
      properties:
        campaign_shed_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        location_type:
          type: string
          enum: [shed, cohort, pen]
        display_name:
          type: string
        operator_display_name:
          type: string
          description: >-
            Backend-resolved assignee name, carried ON the bucket so a client never has to join it
            against a separately paged operator vocabulary. Empty WITH a non-empty
            operator_user_id is a roster gap, not "not assigned".
        expected_animal_count:
          type: integer
          minimum: 0
        weighing_category:
          $ref: "#/components/schemas/WeighingCategory"
        operator_user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WeighingCampaignShedStatus"
        pending_verification_count:
          type: integer
          minimum: 0
          description: >-
            Exact count of this bucket's SUBMITTED observations (proof already
            uploaded) whose verification_status is not yet 'verified'. This is a
            count of evidence that actually exists -- there is deliberately no
            expected-animal denominator or ratio here.
        rework_count:
          type: integer
          minimum: 0
          description: >-
            The subset of pending_verification_count that a verifier actively bounced back
            to the operator. A strict subset, never added to the pending count.
        ready_to_close:
          type: boolean
          description: >-
            True only when the bucket is submitted (status=completed), holds at
            least one submitted observation, and none of its observations have a
            verification_status other than 'verified'. An outstanding 'rework'
            observation also makes this false.
        captured_count:
          type: integer
          minimum: 0
          description: >-
            How many weight records this bucket ACTUALLY holds -- individual
            observations for an individual_animal bucket, the standing
            (non-withdrawn) shed proof for a lump-sum one -- submitted or not.
            A plain count, NEVER a numerator: weighing is free-flow, there is no
            expected-animal roster, expected_animal_count is a fixed bucket-grain
            1, and dividing captures by it would render a share of a total that
            does not exist. Clients report this number as-is ("5 weighed") or not
            at all, and must never turn it into a percentage or a progress bar
            fill.

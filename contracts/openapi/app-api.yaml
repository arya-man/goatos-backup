openapi: 3.1.0
info:
  title: Goat OS App API
  version: 0.1.0
  summary: Goat OS app and operating API for field tasks, goat lookup, protocol config, vaccination, and process integrity.
  description: REST/JSON API for operator/mobile and current admin-web operating surfaces. Reads and writes are RBAC
    scope-filtered before response DTOs are built.
servers:
  - url: https://api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Operator App Bootstrap
  - name: Operator Tasks
  - name: SOP Admin
  - name: Goats
  - name: Identifiers
  - name: Protocol Config
  - name: Action Center
  - name: Control Tower
  - name: Protocol Adherence
  - name: Workflows
  - name: Proof Media
  - name: Vaccination
  - name: Vaccination Passport
paths:
  /admin/tasks/review-fanouts/retry:
    post:
      tags:
        - SOP Admin
      operationId: retrySOPReviewFanouts
      summary: Retry pending or failed task review fanout rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryReviewFanoutsRequest"
      responses:
        "200":
          description: Review fanouts retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryReviewFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/me:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appMe
      summary: Return the authenticated actor's operator profile and active grants.
      responses:
        "200":
          description: Actor/operator context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/bootstrap:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appBootstrap
      summary: Return the Android bootstrap manifest for the authenticated operator.
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bootstrap manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/devices/register:
    post:
      tags:
        - Operator App Bootstrap
      operationId: registerAppDevice
      summary: Register or refresh an Android app install for the authenticated operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/devices/{device_id}/heartbeat:
    post:
      tags:
        - Operator App Bootstrap
      operationId: heartbeatAppDevice
      summary: Update Android device heartbeat and app version state.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatDeviceRequest"
      responses:
        "200":
          description: Device heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/tasks:
    get:
      tags:
        - Operator Tasks
      operationId: listAppTasks
      summary: List assigned operator tasks.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Assigned tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app/tasks/{task_id}:
    get:
      tags:
        - Operator Tasks
      operationId: getAppTask
      summary: Get task detail and pinned SOP version.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /app/sop-versions/{sop_version_id}:
    get:
      tags:
        - Operator Tasks
      operationId: getAppSOPVersion
      summary: Download a pinned SOP version.
      parameters:
        - $ref: "#/components/parameters/SOPVersionId"
      responses:
        "200":
          description: SOP version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPVersionResponse"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /app/proofs/uploads:
    post:
      tags:
        - Proof Media
      operationId: createProofUpload
      summary: Create a server-owned proof record and signed upload target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProofUploadRequest"
      responses:
        "201":
          description: Proof upload target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProofUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/proofs/{proof_id}/upload:
    put:
      tags:
        - Proof Media
      operationId: uploadProofLocal
      summary: Local-dev signed proof upload target.
      parameters:
        - $ref: "#/components/parameters/ProofId"
        - name: expires
          in: query
          required: true
          schema:
            type: string
        - name: sig
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Completed local proof upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /app/proofs/{proof_id}/complete:
    post:
      tags:
        - Proof Media
      operationId: completeProofUpload
      summary: Finalize a proof upload with captured metadata.
      parameters:
        - $ref: "#/components/parameters/ProofId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProofUploadRequest"
      responses:
        "200":
          description: Completed proof record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/proofs/{proof_id}/download:
    get:
      tags:
        - Proof Media
      operationId: downloadProof
      summary: Get or follow a signed proof download URL.
      parameters:
        - $ref: "#/components/parameters/ProofId"
        - name: expires
          in: query
          required: false
          schema:
            type: string
        - name: sig
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signed download URL for non-local clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadProofResponse"
        "307":
          description: Redirect to signed storage URL.
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /app/tasks/{task_id}/submissions:
    post:
      tags:
        - Operator Tasks
      operationId: submitAppTask
      summary: Submit an idempotent SOP task response.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: Submission result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/WriteConflict"
  /goats/search:
    get:
      tags:
        - Goats
      operationId: searchGoats
      summary: Search visible goat passports by identifier, display ID, location, status, breed, or sex.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: goat_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: identifier_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IdentifierType"
        - name: scope_key
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: breed
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: sex
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: farm_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        "200":
          description: Scope-filtered goat search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /goats/{goat_id}:
    get:
      tags:
        - Goats
      operationId: getGoatPassport
      summary: Get a scope-filtered goat passport.
      parameters:
        - $ref: "#/components/parameters/GoatId"
      responses:
        "200":
          description: Goat passport detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatPassportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /goats/{goat_id}/timeline:
    get:
      tags:
        - Goats
      operationId: getGoatTimeline
      summary: Get a scope-filtered goat identity timeline.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Goat identity timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoatTimelineResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
  /identifiers/{type}/{value}/resolve:
    get:
      tags:
        - Identifiers
      operationId: resolveIdentifier
      summary: Resolve an identifier under explicit scope context when needed.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierType"
        - name: value
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: scope_key
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: farm_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Identifier resolution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentifierResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /protocols:
    post:
      tags:
        - Protocol Config
      operationId: createProtocolDefinition
      summary: Create a protocol definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProtocolDefinitionRequest"
      responses:
        "201":
          description: Protocol definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProtocolDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/{protocol_id}/versions:
    post:
      tags:
        - Protocol Config
      operationId: createProtocolVersion
      summary: Create a draft protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProtocolVersionRequest"
      responses:
        "201":
          description: Protocol version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProtocolVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}/rules:
    post:
      tags:
        - Protocol Config
      operationId: addProtocolRule
      summary: Add a dose/phase rule to a draft protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProtocolRuleRequest"
      responses:
        "201":
          description: Protocol rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddProtocolRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}:
    get:
      tags:
        - Protocol Config
      operationId: getProtocolVersion
      summary: Get a protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      responses:
        "200":
          description: Protocol version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/versions/{version_id}/publish:
    post:
      tags:
        - Protocol Config
      operationId: publishProtocolVersion
      summary: Publish a source-backed protocol version.
      parameters:
        - $ref: "#/components/parameters/ProtocolVersionId"
      responses:
        "204":
          description: Protocol version published.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /protocols/vaccination/impact-preview:
    post:
      tags:
        - Vaccination
      operationId: vaccinationImpactPreview
      summary: Preview vaccination impact for eligible goats, drive batches, and stock.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactPreviewInput"
      responses:
        "200":
          description: Vaccination impact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactPreviewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /action-center/obligations:
    get:
      tags:
        - Action Center
      operationId: listActionCenterObligations
      summary: Compatibility path for the vaccination Action Center process-integrity rows.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          description: Reconstruct process state as of this instant (top-bar date scope). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
          description: Current compatibility alias for work_state.
        - name: work_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessIntegritySeverity"
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: protocol_version_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: due_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Action Center rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionCenterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /vaccination/action-center:
    get:
      tags:
        - Action Center
      operationId: listVaccinationActionCenter
      summary: List actionable vaccination process-integrity rows with server-side filters and keyset pagination.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          description: Reconstruct process state as of this instant (top-bar date scope). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: work_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessIntegritySeverity"
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: protocol_version_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: due_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Vaccination Action Center rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionCenterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /vaccination/adherence:
    get:
      tags:
        - Protocol Adherence
      operationId: getVaccinationProtocolAdherence
      summary: Read expected-vs-actual vaccination protocol adherence rows from process integrity.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          description: Reconstruct process state as of this instant (top-bar date scope). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: work_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkState"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessIntegritySeverity"
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: protocol_version_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: due_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Vaccination Protocol Adherence ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolAdherenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /control-tower/vaccination:
    get:
      tags:
        - Control Tower
      operationId: getVaccinationControlTower

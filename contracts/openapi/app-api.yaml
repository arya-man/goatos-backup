    VaccinationCommandBoardKPI:
      type: object
      additionalProperties: false
      required:
        - targets
        - dosesVerified
        - awaitingVerification
        - overdueNotGiven
        - scheduledAhead
      properties:
        targets:
          type: integer
          description: Total planning count (all obligations for drive or all-history).
        dosesVerified:
          type: integer
          description: Accepted vaccination completions.
        awaitingVerification:
          type: integer
          description: Recorded completions awaiting verification (status=recorded, verified_at=null).
        overdueNotGiven:
          type: integer
          description: Obligations due before now with no completion.
        scheduledAhead:
          type: integer
          description: Obligations due after now.
    VaccinationCommandBoardCohort:
      type: object
      additionalProperties: false
      required:
        - parkId
        - parkName
        - managementStage
        - sex
        - animalCount
      properties:
        parkId:
          type: string
          description: >-
            Farm (park) this cohort sits on. The matrix is read farmwise, so the same cohort on
            two farms stays two cells. Empty when the obligation's shed has no resolvable parent.
        parkName:
          type: string
          description: Farm display name, from canonical locations.
        managementStage:
          type: string
          description: Management stage from goat classification (e.g., Buck, Non-Pregnant Female).
        sex:
          type: string
          enum:
            - male
            - female
        animalCount:
          type: integer
    VaccinationCommandBoardCohortCell:
      type: object
      additionalProperties: false
      description: >-
        One farm × cohort × dose-qualified-vaccine cell, at OBLIGATION grain
        (COUNT(DISTINCT obligation_id)). pendingCount, submittedCount and verifiedCount are a
        DISJOINT partition of the cell's obligations along "who owes the next move": the operator,
        the verifier, nobody. pendingCount previously fused the first two, because obligation
        status advances only on VERIFICATION and never on submission — a park whose every animal
        had been vaccinated and submitted rendered byte-identically to a park nobody had touched,
        and the page showed "40 awaiting verification" in the KPI row above "40 pending" in this
        matrix with no column reconciling them. submittedCount is that reconciling column.
        GRAIN NOTE: these counts are obligation grain while VaccinationCommandBoardKPI is animal
        grain; the two agree exactly at one-obligation-per-animal-per-vaccine, the grain every live
        drive uses, and the matrix stays obligation grain by design so a multi-vaccine animal is
        visible once per vaccine.
      required:
        - cohort
        - vaccineLabel
        - pendingCount
        - submittedCount
        - verifiedCount
      properties:
        cohort:
          $ref: "#/components/schemas/VaccinationCommandBoardCohort"
        vaccineLabel:
          type: string
          description: Human-readable vaccine label (e.g., ET+TT, PPR · Booster).
        pendingCount:
          type: integer
          description: >-
            Field work the OPERATOR still owes: obligations in this cohort/vaccine that are open
            (scheduled, due, in_progress, deferred, missed), due on or before the as-of IST
            business date, and carry NO recorded completion. Does NOT include submitted work —
            counting submitted animals here is what made a fully vaccinated park look untouched.
        submittedCount:
          type: integer
          description: >-
            Field work DONE and awaiting a verifier: obligations with a recorded completion that
            is not yet verifier-accepted. Reconciles with
            VaccinationCommandBoardKPI.awaitingVerification (same predicate, animal grain there).
            Disjoint from pendingCount and verifiedCount.
        verifiedCount:
          type: integer
          description: >-

  /app/counts/shifting/destinations:
    get:
      tags:
        - Counts
      operationId: listAppCountsShiftingDestinations
      summary: List the park -> shed destinations an operator may shift animals into.
      description: >-
        Returns the destination options for the shifting form as a CASCADE: every active park, each
        carrying its own active sheds. It is the backend-owned option vocabulary for the two
        destination dropdowns - the client renders what it is given and must not hold a hardcoded
        shed list, re-sort the options, or construct a destination from a typed name.
        The cascade is required for CORRECTNESS, not presentation: shed names REPEAT across parks
        (for example a 'Castro 1' exists under more than one park), so a flat shed list shows the
        operator two identical-looking options. Nesting each shed under its park disambiguates the
        choice for a human, and every option carries its own shed_id so the subsequent write is
        addressed by id and is never ambiguous to the server. What the UI labels a 'farm' IS the
        park: the location hierarchy has exactly two live levels and no farm tier.
        Ordering is settled server-side (park name, then shed name, with an id tiebreak) so the
        dropdown is stable between calls. A park with no active sheds is still returned, with an
        empty sheds array, so a newly-created park is not invisible.
        This is a BOUNDED CONFIGURATION CATALOG - on the order of a few parks and ~150 sheds, sized
        by how many sheds the business physically builds rather than by herd size - so it is
        returned whole, is meant to be fetched once and cached on-device, and is deliberately NOT
        paginated. It is gated on the same counts.write permission as the shifting submit route, not
        on the admin-tier locations.read: the operator who must choose a destination is exactly the
        operator who may record the movement.
      responses:
        "200":
          description: The active park -> shed destination cascade for the caller's tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftingDestinationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/shifting-events:
    post:
      tags:
        - Counts
      operationId: recordAppCountsShiftingEvent
      summary: Record an operator-reported shifting (movement) event for approval.
      description: >-
        Records a movement of a cohort into a destination shed, as reported by a field operator on
        the phone, and raises the approval request a park_head decides. The event is recorded for
        review: authorization_state is 'pending', verification_state is 'unverified' and
        event_status is 'pending' - an operator REPORTS a movement, they do not self-authorize it.
        Park Head approval and operator completion are independent; the transaction receiving the
        second fact relocates the animals named in goat_ids. goat_ids is REQUIRED and
        must name at least one animal: a submit that names nobody is rejected here, at submit time,
        with 400 missing_goat_ids, so the reporting operator learns immediately rather than the
        approver discovering it later. Every named animal must be a current, non-merged herd member;
        dead, sold, transferred, or otherwise exited animals are rejected with 422
        goat_not_shiftable before any event or approval request is written. A destination must stay
        inside the animal's current park. Idempotent via the
        Idempotency-Key header: an exact replay returns the original shifting_event_id with
        idempotent_replay=true and records no second movement; a same-key/different-payload replay
        is rejected with 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordShiftingEventRequest"
      responses:
        "200":
          description: Shifting event recorded (or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordShiftingEventResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/birth-events:
    post:
      tags:
        - Counts
      operationId: recordAppCountsBirthEvent
      summary: Record a birth and create every child workflow immediately.
      description: >-
        Atomically creates one canonical child per litter member and one PENDING, litter-grain count
        approval. Every child gets a deterministic CBE-/CPT- provisional identifier and emits
        goat.created immediately so its Birth workflow opens without waiting for the web queue.
        Children remain excluded from herd counts until a ceo_internal approves the accompanying
        request. The payload is fully validated against the identity kernel at submit time. Exact
        Idempotency-Key replay returns the same approval and children; a same-key/different-payload
        replay is rejected with 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBirthEventRequest"
      responses:
        "202":
          description: >-
            Birth recorded (or replayed): canonical children exist and their count approval is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsApprovalSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/death-events:
    post:
      tags:
        - Counts
      operationId: recordAppCountsDeathEvent
      summary: Record a death from the operator app for approval, through the critical-death guardrail.
      description: >-
        Records the death of an animal AS A PENDING REQUEST. The animal is NOT exited: no goats row
        changes and no goat.exited event is emitted, so its open obligations stay open until a
        ceo_internal approves the request via POST /app/counts/approvals/{request_id}/approve.
        GUARDRAIL (unchanged, and enforced HERE at submit as well as at approval): lifecycle_status
        must be 'dead' AND exit_reason must be 'died'. Any other pairing is rejected with 400, so a
        payload the guarded path would refuse can never be parked in an approver's queue. Approving
        the request replays this exact payload through the SAME dedicated critical-death exit the
        admin POST /admin/goats/{goat_id}/critical-death-exit route uses - the transport and the
        allowed role widen for field operators, the medical semantics do not. The goat.exited event
        emitted on approval auto-cancels the animal's open obligations. Idempotent via the
        Idempotency-Key header: an exact replay returns the original approval_request_id with
        idempotent_replay=true; a same-key/different-payload replay is rejected with 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordDeathEventRequest"
      responses:
        "202":
          description: >-
            Death request raised (or replayed). Accepted, not applied - the animal is still alive
            and its obligations are still open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsApprovalSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/goats/{goat_id}/promote-identifier:
    post:
      tags:
        - Counts
      operationId: promoteAppCountsIdentifier
      summary: Assign a permanent RFID to a temporary-tagged goat (temp -> permanent).
      description: >-
        Promotes a goat that currently carries a temporary tag to a permanent RFID. In ONE
        transaction the server retires the goat's active temporary_tag and attaches the supplied
        permanent_identifier as its primary animal_identifier_1, emitting both goat.identifier.retired
        and goat.identifier.added. Applied directly (NOT an approval): this is the operator's retag,
        gated on CountsWrite. The temp tag to retire is found server-side; the caller sends only the
        permanent RFID and the goat's row_version. Idempotent via the Idempotency-Key header: an exact
        replay returns idempotent_replay=true and moves nothing; a same-key/different-payload replay is
        409. A goat with no active temporary tag is rejected with 409 no_temporary_identifier.
      parameters:
        - $ref: "#/components/parameters/GoatId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteIdentifierRequest"
      responses:
        "200":
          description: The permanent RFID was assigned (or the call was an idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteIdentifierResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/goats/temporary-tagged:
    get:
      tags:
        - Counts
      operationId: listAppCountsTemporaryTaggedGoats
      summary: List goats awaiting a permanent RFID (still carrying an active temporary tag).
      description: >-
        The operator "Awaiting RFID" work list: goats that were tagged at birth with a provisional
        temporary tag and have not yet been promoted to a permanent RFID. Each row carries what the
        promote form needs -- the goat, its display id, the temporary tag being replaced, the
        animal's location, and its current row_version (echoed back verbatim to POST
        /app/counts/goats/{goat_id}/promote-identifier so a stale in-hand row is rejected).
        Keyset-paginated with a maximum page size of 20: this is read from a phone, so a client
        asking for more receives one screen of work, not the whole backlog. Gated on CountsWrite --
        the operator who may promote is exactly the operator who sees the list. Tenant-scoped.
      parameters:
        - name: page_size
          in: query
          required: false
          description: Server-capped at 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: cursor
          in: query
          required: false
          description: Keyset cursor from a previous page's next_cursor (the last row's display_id).
          schema:
            type: string
            maxLength: 512
        - name: park_id
          in: query
          required: false
          description: >-
            Optional location filter: narrow the list to goats currently placed in this park. A
            malformed id is rejected with 400. Chosen from the shifting-destinations catalog on the
            client (park -> shed cascade), never free text.
          schema:
            type: string
            format: uuid
        - name: shed_id
          in: query
          required: false
          description: >-
            Optional location filter: narrow the list to goats currently placed in this shed. A shed
            belongs to exactly one park, so shed_id alone is sufficient. A malformed id is rejected
            with 400.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One page of goats awaiting a permanent RFID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryTaggedGoatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/workflows:
    get:
      tags:
        - Workflows
      operationId: listAppWorkflows
      summary: List birth/death follow-up workflow cards for one module and business date.
      description: >-
        The operator's per-goat SOP work list (docs/decisions/birth-death-workflows.md). A card is
        one workflow instance opened when a birth applies or a death report is staged
        (goat.created with origin_type=birth opens the kid track plus the shared mother track;
        counts.death.reported opens the death evidence trail while the goat remains alive). The
        card fields (actions_done,
        actions_total, next_action, awaiting_verification) are write-maintained on every action
        write, so this list reads workflow_instances alone. Scoped to ONE module (birth or death)
        and ONE Asia/Kolkata business date (default today IST). Keyset-paginated over
        (next_due_at ASC NULLS LAST, workflow_id ASC) with a server cap of 20 cards; chips carry
        the requested day's bucket counts over the same key set the page reads, so page size never
        changes the chips. overdue_dates contains at most the five most recent PREVIOUS business
        dates with an open card whose next action is already overdue; it powers the bounded mobile
        attention popup without fetching historical card pages. Gated on CountsWrite - the operator who records the birth/death runs the
        follow-up work.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum:
              - birth
              - death
        - name: date
          in: query
          required: false
          description: Business date (Asia/Kolkata) to list; defaults to today IST.
          schema:
            type: string
            format: date
        - name: filter
          in: query
          required: false
          description: Card bucket filter; defaults to all (excludes canceled).
          schema:
            type: string
            enum:
              - all
              - overdue
              - due
              - completed
              - awaiting_video
        - name: page_size
          in: query
          required: false
          description: Server-capped at 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: cursor
          in: query
          required: false
          description: Keyset cursor from a previous page's next_cursor.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of workflow cards plus the day's chip counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/workflows/{workflow_id}:
    get:
      tags:
        - Workflows
      operationId: getAppWorkflow
      summary: Get one workflow's card header, context facts, and operator action list.
      description: >-
        The per-goat detail behind a card: the card header, backend-owned context facts (event
        moment, park/shed, mother link), and every operator action row (at most 18 - the birth kid
        track's 8 main steps plus up to 10 birth-time-derived colostrum sessions). Every visible
        operator row, including scheduled colostrum, counts toward actions_total; internal
        approval/verification rows are omitted. Only
        the first incomplete action in each section is enabled; later siblings read blocked=true.
        Tenant-scoped; gated on CountsWrite.
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The workflow detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/workflows/{workflow_id}/actions/{action_id}/answer:
    post:
      tags:
        - Workflows
      operationId: answerAppWorkflowAction
      summary: Answer a workflow question, including numeric kilograms or a configured selection.
      description: >-
        Records the operator's answer to a question ("Is the kid clean?") or question_select ("Take
        Weight of Kid" band) action and completes it. A question_select answer must be one of the
        action's declared options. A requires_video question must carry one server-minted proof_ref
        from /app/proofs/*; a proofless answer is rejected 422 proof_required. Idempotent via the
        Idempotency-Key header: first call applies;
        an exact replay returns the original result with no side effects; a same-key/
        different-payload replay is rejected with 409; a NEW key against an already-completed
        action is rejected with 409 action_already_completed. A later sibling submitted before its
        predecessor completes is rejected with 409 action_out_of_sequence. The card counters are
        maintained in the same transaction. Gated on CountsWrite.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerWorkflowActionRequest"
      responses:
        "200":
          description: Answer recorded (or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowActionWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/workflows/{workflow_id}/actions/{action_id}/complete:
    post:
      tags:
        - Workflows
      operationId: completeAppWorkflowAction
      summary: Complete an action-type workflow step (optionally with a video proof).
      description: >-
        Marks an action-type step done ("Iodine dipping of umbilical cord", a colostrum session, a
        death evidence video). A requires_video action without proof_ref is rejected 422
        proof_required - the proof is a server-minted proof id from /app/proofs/*, never bytes.
        Initial death videos remain staged until the existing admin-web approval accepts the death;
        that approval applies the lifecycle/count change and releases ONE death_evidence item
        carrying BOTH videos. The hidden internal review completes only on the verifier's approve
        verdict; a rework verdict resets both operator videos for sequential re-shoot, and the
        completed re-shoot pair returns directly to Verify without a second admin approval.
        Internal approval actions are never operator-completable. A later sibling submitted before
        its predecessor completes is rejected with 409 action_out_of_sequence. Idempotent via the
        Idempotency-Key header exactly like answer. Gated on CountsWrite.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkflowActionRequest"
      responses:
        "200":
          description: Completion recorded (or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowActionWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/shifting-events/pending-execution:
    get:
      tags:
        - Counts
      operationId: listAppCountsShiftingPendingExecution
      summary: List shifting Actions from raise through execution and evidence rework.
      description: >-
        The operator's Shifting Actions history: newly raised movements appear immediately, before
        Park Head approval; authorized and evidence-rework movements remain actionable; completed
        movements remain visible. Each row carries where the animals are/were,
        where they are going, approval fields when present, plus the full animal_count and a preview of at
        most 5 animals (display id and ear tag). A movement may name up to 500 animals, so the full
        roster is deliberately NOT embedded in a list row; animals_truncated reports when the
        preview is partial.
        Keyset-paginated with a maximum page size of 20: this queue is read from a phone standing in
        a park, so a client asking for more receives one screen of work, not the whole backlog.
        Date is the movement's raised business day in Asia/Kolkata. Status buckets are disjoint and
        backend-owned; completed rows are read-only (`primary_action_key=none`).
      parameters:
        - name: date
          in: query
          required: false
          description: Optional Asia/Kolkata business date. Omit for all dates.
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          description: Disjoint workflow bucket. Defaults to all.
          schema:
            type: string
            enum: [all, pending, authorized, rework, completed]
        - name: page_size
          in: query
          required: false
          description: Server-capped at 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous page's next_cursor.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of date/status-filtered Shifting Actions history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsShiftingPendingExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/shifting-events/{shifting_event_id}/complete:
    post:
      tags:
        - Counts
      operationId: completeAppCountsShiftingEvent
      summary: Confirm a shifting happened and submit its mandatory live-camera evidence.
      description: >-
        Records that an operator physically moved the animals AND uploaded the mandatory video proof
        (maintainer decision, 2026-07-28). Completion and Park Head approval are independent gates.
        If approval already exists, this request atomically relocates the animals and moves the count;
        otherwise it keeps event_status='pending' with completion stamps and approval applies the move later.
        Verification reviews the video afterward. Approval marks evidence verified; rejection creates
        evidence rework and never rolls back goat location or census truth.
        Low priority requires proof_ref only. High priority embeds feed packing and feeding inside
        Shifting and requires proof_ref, feed_packing_proof_ref, and feed_given_proof_ref. All three
        are reviewed together in one Shifting verification item. The packing proof does not complete
        the separate Feed Packing workflow. High priority must also echo the feed_config_fingerprint
        returned by the pending-execution read; missing config blocks with 422 and changed config
        blocks with 409 so the server never guesses feed.
        Valid from event_status='pending' or 'authorized', and for evidence rework. Rejected or
        canceled movements are refused with 400 shifting_not_authorized.
        ANY operator holding counts.write may complete a movement, not only the operator who raised
        it: the person who witnesses the animals move is not reliably the person who typed the
        request.
        Requires the Idempotency-Key header. Re-submitting an already-submitted movement returns the
        ORIGINAL result with idempotent_replay=true and queues nothing new; a same-key request with a
        different video/tag is a 409 idempotency_conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: shifting_event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof_ref
              properties:
                proof_ref:
                  type: string
                  minLength: 1
                  description: >-
                    MANDATORY. The proof_artifact id of the video the operator recorded to prove the
                    animals physically moved. Verification reviews it independently of movement apply.
                feed_packing_proof_ref:
                  type: string
                  minLength: 1
                  description: MANDATORY for high priority. Live-camera proof of Shifting's embedded feed-packing step.
                feed_given_proof_ref:
                  type: string
                  minLength: 1
                  description: MANDATORY for high priority. Live-camera proof of configured feed being given to the moved animals.
                feed_config_fingerprint:
                  type: string
                  minLength: 1
                  description: MANDATORY for high priority. Echo of the ready feed requirement fingerprint.
                destination_tag:
                  type: string
                  description: >-
                    OPTIONAL destination management_stage the moved animals adopt. Needed only when the
                    destination shed is empty; for an occupied shed the server derives it and a supplied
                    value must agree with the shed's configured profile.
      responses:
        "200":
          description: >-
            Operator completion recorded. Status remains pending while Park Head approval is
            absent, applied when both gates exist, or the original result replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsShiftingExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/shifting-events/{shifting_event_id}/cancel:
    post:
      tags:
        - Counts
      operationId: cancelAppCountsShiftingEvent
      summary: Retire an authorized shifting that will never be executed. NOTHING moves.
      description: >-
        Cancels an approved movement nobody is going to walk, so abandoned shiftings do not sit on
        the execution queue forever. NO animal moves and no location changes.
        A reason is REQUIRED - an abandoned movement that vanishes with no explanation is
        indistinguishable from one that was executed - and is enforced by the database as well as
        the API.
        Valid ONLY from event_status='authorized'. A movement still pending approval is NOT
        cancellable here: it is retired by its approver REJECTING the approval request instead,
        which keeps the decision with the person who holds the authority to make it. Any other state
        is refused with 400 shifting_not_authorized.
        ANY operator holding counts.write may cancel, on the same reasoning as complete. Requires
        the Idempotency-Key header; cancelling an already-cancelled movement returns the original
        result with idempotent_replay=true.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: shifting_event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountsShiftingCancelRequest"
      responses:
        "200":
          description: Movement cancelled (or replayed). Nothing moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsShiftingExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/approvals:
    get:
      tags:
        - Counts
      operationId: listAppCountsApprovals
      summary: List lifecycle approval requests the caller may decide.
      description: >-
        The approver's queue. Returns ONLY the request types the caller is authorised to decide -
        a park_head sees shifting requests, a ceo_internal sees birth and death requests - because
        the filter is derived from the caller's permissions, not from the query string. A caller
        with neither approval permission receives an empty list. Keyset-paginated with a maximum
        page size of 20: this queue is read from a phone, so a client asking for more receives one
        screen of work, not the whole backlog.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to 'pending'.
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: page_size
          in: query
          required: false
          description: Server-capped at 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous page's next_cursor.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of approval requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsApprovalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/approvals/{request_id}/approve:
    post:
      tags:
        - Counts
      operationId: approveAppCountsApproval
      summary: Approve a pending lifecycle request.
      description: >-
        Applies the request. For a BIRTH this changes every already-created child in the litter from
        count-pending to count-approved; it never creates a goat. For a DEATH it exits the animal
        through the guarded critical-death path and cancels its open obligations.
        A SHIFTING IS DIFFERENT (maintainer decision, 2026-07-19). Approving a shifting AUTHORIZES
        it and MOVES NOTHING - the animals stay in the source shed and the herd register keeps
        reading it, because approval is a manager's permission slip, not evidence that anybody
        walked the animals anywhere. The relocation happens later, when an operator confirms the
        movement physically happened via POST
        /app/counts/shifting-events/{shifting_event_id}/complete.
        ATOMIC: the effect and the status flip commit in ONE transaction, so a request can never be
        readable as 'approved' while its effect failed to save, and never applied while the request
        still reads 'pending'.
        AUTHORITY IS PER TYPE, checked against the stored request: a park_head may approve a
        shifting but NOT a birth or a death, and receives 403 if they address one. Requires the
        Idempotency-Key header. A second approve of an already-approved request applies nothing and
        returns the original decision with idempotent_replay=true; approving a request that was
        already rejected is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountsApprovalDecisionRequest"
      responses:
        "200":
          description: Request approved and its effect applied (or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsApprovalDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/counts/approvals/{request_id}/reject:
    post:
      tags:
        - Counts
      operationId: rejectAppCountsApproval
      summary: Reject a pending lifecycle request, applying nothing.
      description: >-
        Rejects the request. NO effect is applied: no animal is created, exited, or moved, and no
        shifting event is authorized. A reason is REQUIRED - a rejection without one is not
        actionable by the operator who raised it - and is enforced by the database as well as the
        API. Authority is per type, checked against the stored request, exactly as for approve.
        Requires the Idempotency-Key header. A second reject of an already-rejected request returns
        the original decision with idempotent_replay=true; rejecting a request that was already
        approved is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountsApprovalDecisionRequest"
      responses:
        "200":
          description: Request rejected (or replayed). Nothing was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsApprovalDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /ceo-ai/ask:
    post:
      operationId: askCeoAssistant
      summary: Ask the read-only leadership operations assistant
      description: >
        CEO/CxO leadership assistant. Read-only over business data. Tenant and
        role scope come ONLY from the authenticated session, never from the
        request body. The response carries ONLY the user-facing envelope
        (answer, source, mode, request_id, conversation_id, citations) — step
        traces / chain-of-thought are internal and never returned.
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeoAssistantAskRequest"
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoAssistantAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  # --- ceo-ai conversation persistence (owned by ceoai/persistence) ---
  # Additive block. Tenant + actor scope come ONLY from the authenticated session,
  # never from the request body or path. All reads/writes are actor-scoped: one
  # leadership user can never see or mutate another's threads.
  /ceo-ai/starters:
    get:
      operationId: listCeoStarters
      summary: Leadership capability probe + starter questions
      description: >
        Returns the backend-owned, tenant/role-aware starter questions the
        assistant can truthfully answer. Doubles as the leadership capability
        probe the admin-web client uses to decide whether to render the
        assistant launcher: 200 means the session is authorized leadership
        (ceo_internal); 403 means it is not, so the launcher stays hidden.
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backend-owned starter questions for this leadership session
          content:
            application/json:
              schema:
                type: object
                required:
                  - starters
                properties:
                  starters:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /ceo-ai/conversations:
    post:
      operationId: createCeoConversation
      summary: Open a leadership assistant conversation thread
      description: >
        Creates a durable thread. Idempotent when an Idempotency-Key header is
        supplied: a replay with the same key returns the original thread (200)
        instead of forking a new one (201).
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CeoIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeoConversationCreateRequest"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoConversation"
        "200":
          description: Idempotent replay — existing thread returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listCeoConversations
      summary: List the actor's conversation threads (keyset paginated)
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's next_cursor.
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One keyset page of threads, newest activity first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /ceo-ai/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/CeoConversationId"
    get:
      operationId: getCeoConversation
      summary: Resume one thread
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateCeoConversation
      summary: Rename or archive/unarchive a thread
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeoConversationPatchRequest"
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteCeoConversation
      summary: Soft-delete a thread (hidden immediately, purged per retention policy)
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Thread soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /ceo-ai/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/CeoConversationId"
    get:
      operationId: listCeoConversationMessages
      summary: Read a thread's message history (keyset paginated, oldest-first)
      tags:
        - ceo-ai
      security:
        - bearerAuth: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One keyset page of message history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeoMessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CeoConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CeoMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CeoIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replay-safety key; a repeat create with the same key returns the original thread.
      schema:
        type: string
        maxLength: 200
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    FeedConfigLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size. Absent uses the server default (50); a PRESENT but out-of-range value is a 400,
        never silently clamped -- a caller that asked for 5000 rows and got 50 without being told has
        a truncated grid it believes is complete.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    FeedConfigOffset:
      name: offset
      in: query
      required: false
      description: >-
        Row offset. Bounded rather than growable: these are authored config tables whose whole
        contents are small and stable, and an offset past the maximum is rejected outright.
      schema:
        type: integer
        minimum: 0
        maximum: 5000
    FeedDirectionLimit:
      name: limit
      in: query
      required: false
      description: >-
        Number of SHEDS per page (not rows). Absent uses the server default (25); a PRESENT but
        out-of-range value is a 400, never silently clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    FeedDirectionOffset:
      name: offset
      in: query
      required: false
      description: >-
        Shed offset. Bounded rather than growable: the paged set is the park's shed catalog, a small
        stable configuration list, so the offset cannot grow with herd size and a value past the
        maximum is rejected outright.
      schema:
        type: integer
        minimum: 0
        maximum: 5000
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Standard language preference used to localize backend-owned labels/copy. Supported app languages are en, hi, kn, and te; unsupported values fall back to en.
      schema:
        type: string
        examples: ["hi-IN, en;q=0.8"]
    GoatOSLocale:
      name: X-GoatOS-Locale
      in: header
      required: false
      description: Exact Goat OS app language selected by the user. Takes precedence over Accept-Language for backend-owned labels/copy.
      schema:
        type: string
        enum: [en, hi, kn, te]
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShedId:
      name: shed_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ProofId:
      name: proof_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObligationId:
      name: obligation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WeighingCampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, stale SOP version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot pass the current executable-contract gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency or feature wiring is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CeoConversationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          description: Optional initial title; when omitted the backend derives one.
          type: string
          maxLength: 200
      # tenant/actor are session-derived and MUST NOT appear in the body.
    CeoConversationPatchRequest:
      type: object
      additionalProperties: false
      description: >
        Exactly one intent per request. `title` renames; `archived=true` archives;

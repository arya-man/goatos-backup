        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /verification/items/{item_id}/verdict:
    post:
      tags:
        - Verification
      operationId: recordVerificationVerdict
      summary: Record the Verifier's approve/reject decision on one verification item.
      description: >-
        Reject REQUIRES a non-empty reason (422 otherwise -- a syntactically valid request that fails
        the business rule). Optimistic concurrency via row_version. Approving does NOT complete or act
        on the underlying producer record (e.g. a vaccination obligation) -- the verifier's verdict is
        advisory input; an authorized Park Head/Director/CEO/CxO closes the complete drive
        submission only after every goat proof in it has been approved.
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationVerdictRequest"
      responses:
        "200":
          description: Verdict recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationVerdictResponse"
        "400":

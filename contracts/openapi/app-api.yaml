  /app/vaccination/obligations/{obligation_id}/reschedule:
    post:
      tags:
        - Vaccination
      operationId: appRescheduleObligation
      summary: Reschedule an open vaccination obligation to a new due date.
      description: >-
        Reschedules an open (scheduled/due) vaccination obligation to a new due date,
        targeted by obligation_id. Idempotent via the Idempotency-Key header: an exact
        replay returns the original result without re-running the write; a same-key/different-payload
        replay is rejected with 409. A health-held ('deferred') obligation cannot be reached
        through this endpoint. A 'missed' target is immutable closed history — this endpoint
        creates a brand-new obligation for the new due date and returns the new obligation_id
        rather than mutating the missed row.
      parameters:
        - $ref: "#/components/parameters/ObligationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleObligationRequest"
      responses:
        "200":
          description: Obligation rescheduled successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleObligationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/vaccination/gaps:
    get:
      tags:
        - Vaccination
      operationId: appVaccinationGaps
      summary: List animals excluded from the vaccination coverage denominator, with the reason.
      description: >-
        Bounded, cursor-paginated animals whose identity data is incomplete (no date of birth, no
        breed on record) and are therefore excluded from the coverage %. Scoped by tenant + optional
        park_id, mirroring the same park-scope mechanism /vaccination/execution and
        /vaccination/operations already use. Backs the mobile "Data gaps" overlay.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Bounded gap rows + scoped reason-count summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationGapsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/vaccination/coverage:
    get:
      tags:
        - Vaccination
      operationId: appVaccinationCoverage
      summary: Per-vaccine given-dose count + coverage % rollup for a scope.
      description: >-
        Reuses the same indexed cohort×protocol rollup /vaccination/operations already reads,
        re-aggregated by protocol only (no new hot-table query). Backs the mobile "Doses given"
        overlay.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Per-vaccine given/coverage rollup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationCoverageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /app/config:
    get:
      tags:
        - Operator App Bootstrap
      operationId: appConfig
      summary: Get the mobile live-config bundle (nav/labels/flags/tunables/kill-switch).
      description: >-
        docs/mobile/backend-driven-config.md primary config poll. Returns presentationConfig
        (feature flags, department-sourced owned-module registry) + clientRuntimeConfig (bounded
        operational knobs) stamped with a monotonic revision + ETag, plus a read-only policy_revision
        traceability echo. Supports conditional GET: a matching If-None-Match returns 304 with no
        body. Side-effect-free; no FCM push is wired by this endpoint (poll/ETag only).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/GoatOSLocale"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full config bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfigResponse"
        "304":
          description: Config unchanged since the given ETag.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GoatId:
      name: goat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SOPVersionId:
      name: sop_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Standard language preference used to localize backend-owned labels/copy. Supported app languages are en, hi, kn, and te; unsupported values fall back to en.
      schema:
        type: string
        examples: ["hi-IN, en;q=0.8"]
    GoatOSLocale:
      name: X-GoatOS-Locale
      in: header
      required: false
      description: Exact Goat OS app language selected by the user. Takes precedence over Accept-Language for backend-owned labels/copy.
      schema:
        type: string
        enum: [en, hi, kn, te]
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShedId:
      name: shed_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ProofId:
      name: proof_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObligationId:
      name: obligation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundOrNotAllowed:
      description: Resource is missing or outside the caller's visibility scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WriteConflict:
      description: Optimistic concurrency, stale SOP version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot pass the current executable-contract gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency or feature wiring is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
        - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    SOPVersion:
      type: object
      additionalProperties: false
      required:
        - sop_version_id
        - tenant_id
        - sop_id
        - sop_code
        - version
        - version_label
        - status
        - form_dsl
        - proof_policy
        - compatibility
        - validation_report
        - row_version
        - created_at
        - updated_at
      properties:
        sop_version_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        sop_id:
          type: string
          format: uuid
        sop_code:
          type: string
        version:
          type: integer
          minimum: 1
        version_label:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - retired
        form_dsl:
          type: object
          additionalProperties: true
        proof_policy:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
        validation_report:
          $ref: "#/components/schemas/ValidationReport"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        retired_at:
          type:
            - string
            - "null"
          format: date-time
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SOPVersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - trace_id
      properties:
        version:
          $ref: "#/components/schemas/SOPVersion"
        trace_id:
          type: string
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - tenant_id
        - sop_id
        - sop_version_id
        - sop_code
        - task_type
        - title
        - description
        - state
        - scope_type
        - scope_id
        - priority
        - context
        - row_version
        - created_at
        - updated_at
      properties:

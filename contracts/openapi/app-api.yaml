        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigShedTag"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigFeedItem:
      type: object
      additionalProperties: false
      required:
        - feed_item_id
        - feed_item
        - display_order
        - status
      properties:
        feed_item_id:
          type: string
          format: uuid
        feed_item:
          type: string
        energy_kcal_per_kg:
          type: string
          description: Exact decimal string. Omitted when unset -- an honest gap, not a zero.
        dry_matter_factor:
          type: string
        wastage_factor:
          type: string
        display_order:
          type: integer
        status:
          type: string
          enum: [active, retired]
    FeedConfigFeedItemPage:
      type: object

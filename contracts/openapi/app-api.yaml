        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigFeedItem"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigSessionTemplate:
      type: object
      additionalProperties: false
      required:
        - session_template_id
        - park_id
        - session_no
        - session_label
        - split_fraction
        - display_order
        - status
      properties:
        session_template_id:
          type: string
          format: uuid
        park_id:
          type: string
          format: uuid
        session_no:
          type: integer
        session_label:
          type: string
        split_fraction:
          type: string
          description: Exact decimal string. A park's active sessions are expected to sum to 1.0.
        display_order:
          type: integer
        status:
          type: string
          enum: [active, retired]
    FeedDirectionItemQuantity:
      type: object
      additionalProperties: false
      required:
        - feed_item
        - status
        - quantity_kg
      properties:
        feed_item:
          type: string
        status:
          type: string
          enum: [resolved, blocked]
          description: >-
            `resolved` means the quantity was DERIVED from authored configuration -- including an
            authored zero, which is a real "feed nothing" instruction. `blocked` means the
            configuration needed to derive it does not exist.
        quantity_kg:
          type: string
          nullable: true
          description: >-
            Rounded, packable quantity in kg as an exact decimal STRING (three decimals), never a
            float -- a float round trip is exactly how a column total ends up reading 12.299999999.


            NULL IF AND ONLY IF `status` is `blocked`. This is the safety contract of this API: an
            unauthored ration has NO number, so it cannot be summed, rendered, or defaulted into a
            plausible-looking 0. An authored zero is the opposite state and is fully numeric
            ("0.000"). A client that coerces null to 0 reintroduces the starvation path this
            distinction exists to prevent.
        grams_per_head:
          type: string
          description: >-
            The authored per-head rate this quantity came from, echoed so an operator can see the
            input without opening the config screen. Absent for blocked cells and for the
            `experiment` workflow, which authors absolute kg and has no per-head rate.
        shed_factor:
          type: string
          description: The per-shed multiplier applied. Absent for blocked and experiment cells.
        blocked_reason:
          $ref: "#/components/schemas/FeedDirectionBlockedReason"
    FeedDirectionBlockedReason:
      type: object
      additionalProperties: false
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - no_ration_rate
            - unknown_shed_tag
            - unknown_ration_group
            - no_session_template
          description: Machine-stable reason code, so a UI can group and count authored gaps.
        detail:
          type: string
          description: >-
            The exact missing coordinate in human-readable form. A gap an operator cannot locate is
            a gap they cannot close.
    FeedDirectionRow:
      type: object
      additionalProperties: false
      required:
        - park_id
        - park_label
        - shed_id
        - shed_label
        - shed_tag
        - breed
        - ration_group
        - experiment_arm
        - session_no
        - session_label
        - head_count
        - head_count_informational
        - workflow
        - items
        - session_total_kg
        - blocked
        - overdue_pending
        - completed
      properties:
        park_id:
          type: string
          format: uuid
        park_label:
          type: string
        shed_id:
          type: string
          format: uuid
        shed_label:
          type: string
        shed_tag:
          type: string
          description: >-
            The AUTHORED tag label the live management stage resolved onto -- the canonical
            spelling, not the raw source text, which carries cosmetic variants. Populated on EVERY
            workflow from the animals actually in the shed: an experiment row has no ration grain,
            but its animals still carry a management stage. It never carries the experiment arm,
            which has its own `experiment_arm` field. A shed holding two stages reports both,
            joined by ` + `.
        breed:
          type: string
          description: >-
            The raw live breed label. Reported alongside `ration_group` because they differ in ways
            an operator needs to see: Beetal and Sirohi are two breeds sharing one
            `Beetal/Sirohi` group, and every kid breed collapses to `Kid`. Populated on every
            workflow from the animals in the shed; a multi-breed shed reports every breed joined by
            ` + ` (`Beetal + Sojat`) rather than naming one and implying it is the only one.
        ration_group:
          type: string
          description: >-
            What the breed resolved to in the ration grid. EMPTY on an experiment row, correctly: an
            absolute hand-authored kg never consults the breed -> ration-group map, so there is no
            group to report. That is a real state, not missing data, and must render as a deliberate
            blank.
        experiment_arm:
          type: string
          description: >-
            The trial group a hand-authored experiment shed is enrolled in (`Sheep M NEW`); empty on
            every normal row. A SEPARATE field from `shed_tag` because the two are different facts:
            a tag is the animals' management stage and selects the ration course, an arm is which
            trial the shed is in and selects nothing, since the quantity is hand-entered. Mirrors
            the `Experiment arm` column Feed Config shows over the same authored value.
        session_no:
          type: integer
        session_label:
          type: string
        head_count:
          type: integer
          format: int64
          description: >-
            Projected head count for this grain on the target date -- live herd plus the approved
            but unexecuted movements. Sex is summed away because it is not part of the ration key.
        head_count_informational:
          type: boolean
          description: >-
            True when `head_count` did NOT drive the quantity, i.e. the `experiment` workflow, whose
            authored kg is already a shed total. Multiplying by head count there would overfeed the
            shed by a factor of its whole population, so this flag exists to stop exactly that.
        workflow:
          type: string
          enum: [normal, experiment]
          description: >-
            Which quantity strategy produced the row. `normal` resolves from the ration grid;
            `experiment` uses hand-authored absolute kg per shed.
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionItemQuantity"
        session_total_kg:
          type: string
          description: >-
            Sum of the RESOLVED items only, as an exact decimal string. Blocked items contribute
            nothing because they have no number to contribute -- `blocked` is what tells the reader
            this total is partial.
        blocked:
          type: boolean
        overdue_pending:
          type: boolean
          description: >-
            A movement this row's projected head count already assumes came due before the target
            date and still has not been executed.
        completed:
          type: boolean
          description: >-
            True when this shed-session has a recorded completion (`feed.direction.completed`). The
            ration numbers are generated the same way; this reports that the feeding was carried
            out. A whole shed-session is completed at once, so every ration grain of the same
            (shed, session) reports `completed` together.
    FeedDirectionFeedItemTotal:
      type: object
      additionalProperties: false
      required:
        - feed_item
        - quantity_kg
        - blocked_cells
      properties:
        feed_item:
          type: string
        quantity_kg:
          type: string
        blocked_cells:
          type: integer
          description: >-
            Cells for this item that could not be resolved. A column total is never read as complete
            when part of it is missing.
    FeedDirectionPreviewSummary:
      type: object
      additionalProperties: false
      required:
        - scope
        - shed_count
        - row_count
        - total_kg_by_feed_item
        - blocked_count
        - blocked_shed_count
      properties:
        scope:
          type: string
          enum: [filtered]
          description: >-
            Always `filtered`: every figure in this summary covers every row matching the request's
            park, target date, shed and session filters -- NOT the returned page -- and is invariant
            to `limit` and `offset`. An explicit field rather than documentation so a client can
            assert the coverage guarantee instead of trusting prose.
        shed_count:
          type: integer
          description: Distinct sheds in the whole filtered scope.
        row_count:
          type: integer
          description: >-
            Generated rows in the whole filtered scope. This is NOT `items.length`, which is the
            page; comparing the two is how a client sees what fraction of the result is visible.
        total_kg_by_feed_item:
          type: array
          description: >-
            Per-item totals across the WHOLE filtered scope, in authored catalog order so a client's
            columns are stable across pages. A blocked cell is absent from the sum and counted in
            `blocked_cells` instead -- never added as zero. These are summed from the same rounded
            per-cell quantities the rows carry, so the total equals what a packer physically packs.
          items:
            $ref: "#/components/schemas/FeedDirectionFeedItemTotal"
        blocked_count:
          type: integer
          description: >-
            Blocked ITEM cells in the whole filtered scope -- the number of authored gaps to close.
        blocked_shed_count:
          type: integer
          description: Distinct sheds carrying at least one blocked cell, i.e. sheds at risk of going unfed.
    FeedDirectionWorkflowLifecycle:
      type: object
      additionalProperties: false
      required:
        - workflow
        - state
        - amendment_count
      properties:
        workflow:
          type: string
          enum: [normal, experiment]
        state:
          type: string
          enum: [issued, amended, locked, pending, not_issued]
          description: >-
            This workflow's issue state. issued/amended/locked describe a FROZEN sheet;
            pending/not_issued mean nothing was issued for this workflow (see `expected_issue_at`).
        issued_at:
          type: string
          format: date-time
          description: When the sheet was issued (Asia/Kolkata). Absent until issued.
        amended_at:
          type: string
          format: date-time
        locked_at:
          type: string
          format: date-time
        amendment_count:
          type: integer
        expected_issue_at:
          type: string
          format: date-time
          description: >-
            Set on pending/not_issued: the instant this workflow's sheet is (or was) due to be
            issued -- the direction_time on the day before the feed day. Lets the UI say "issued
            <D-1> at <time> IST" instead of showing a speculative number.
    FeedDirectionLifecycle:
      type: object
      additionalProperties: false
      required:
        - state
        - amendment_count
        - workflows
      properties:
        state:
          type: string
          enum: [issued, amended, locked, pending, not_issued, preview, beyond_horizon, draft]
          description: >-
            The aggregate lifecycle of the served park-day, the LEAST-ADVANCED state among its
            workflows (issued < amended < locked): a park-day is never "locked" while a workflow is
            still merely issued. `preview` = NO sheet is issued for this day, so the rows were
            GENERATED on demand and are shown as a not-yet-issued preview (the per-workflow detail
            still carries pending/not_issued and `expected_issue_at`). `pending`/`not_issued` remain
            as PER-WORKFLOW states inside a preview; the aggregate serve path no longer returns them
            as an empty wall. `beyond_horizon` = the day has no issued sheet AND falls outside the
            [today, tomorrow] projection window, so NO rows were generated (generating would fabricate
            a sheet from today's herd); the `message` names the horizon. An already-issued sheet for
            any date still serves its frozen rows regardless of the window. `draft` = a live what-if
            (draft=true), never a frozen sheet.
        issued_at:
          type: string
          format: date-time
        amended_at:
          type: string
          format: date-time
        locked_at:
          type: string
          format: date-time
        amendment_count:
          type: integer
          description: Total amendments across the park-day's workflows.
        message:
          type: string
          description: Operator sentence, most useful for pending/not_issued.
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionWorkflowLifecycle"
    FeedDirectionFilterOptions:
      type: object
      additionalProperties: false
      description: >-
        Backend-owned park/shed filter vocabulary for the feed screens, plus the park this response
        was actually generated for. A client renders its farm/shed pickers from this and holds no
        location list of its own. Bounded by physical infrastructure (parks and one park's shed
        catalog), never by herd size. served_park_id equals the requested park_id, or — when the
        request omitted park_id — the default park the server selected.
      required:
        - served_park_id
        - parks
        - sheds
        - sessions
      properties:
        served_park_id:
          type: string
          description: The park id this response was generated for (the requested park, or the defaulted first park).
        parks:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionFilterPark"
        sheds:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionFilterShed"
        sessions:
          type: array
          description: >-
            The served park's active feeding-session split (session 1, session 2, …), in display
            order — the backend-owned vocabulary the client renders its session picker from. The
            client sends session_no back as the `session` query param.
          items:
            $ref: "#/components/schemas/FeedDirectionFilterSession"
    FeedDirectionFilterSession:
      type: object
      additionalProperties: false
      required: [session_no, label]
      properties:
        session_no:
          type: integer
          description: The session number sent back as the `session` filter param.
        label:
          type: string
          description: The authored session label (e.g. Morning / Evening).
    FeedDirectionFilterPark:
      type: object
      additionalProperties: false
      required: [park_id, label]
      properties:
        park_id:
          type: string
        label:
          type: string
    FeedDirectionFilterShed:
      type: object
      additionalProperties: false
      required: [shed_id, label, park_id]
      properties:
        shed_id:
          type: string
        label:
          type: string
        park_id:
          type: string
    FeedDirectionPreviewPage:
      type: object
      additionalProperties: false
      required:
        - items
        - summary
        - lifecycle
        - draft
        - filters
        - target_date
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionRow"
        summary:
          $ref: "#/components/schemas/FeedDirectionPreviewSummary"
        lifecycle:
          $ref: "#/components/schemas/FeedDirectionLifecycle"
        draft:
          type: boolean
          description: >-
            True only for the deliberate live-compute escape hatch (draft=true). An issued, amended,
            locked, pending or not_issued response is never draft.
        filters:
          $ref: "#/components/schemas/FeedDirectionFilterOptions"
        target_date:
          type: string
          format: date
        limit:
          type: integer
          description: Page size in SHEDS.
        offset:
          type: integer
        has_more:
          type: boolean
    FeedPackingRow:
      type: object
      additionalProperties: false
      required:
        - park_id
        - park_label
        - shed_id
        - shed_label
        - session_no
        - session_label
        - workflow
        - experiment_arm
        - head_count
        - items
        - total_kg
        - status
        - completed
      properties:
        park_id:
          type: string
          format: uuid
        park_label:
          type: string
        shed_id:
          type: string
          format: uuid
        shed_label:
          type: string
        session_no:
          type: integer
        session_label:
          type: string
        workflow:
          type: string
          enum: [normal, experiment]
        experiment_arm:
          type: string
          description: >-
            The trial group of a hand-authored experiment shed, empty on normal lines. Carried here
            as well as on the direction row so a packer knows which trial a bag belongs to without
            cross-referencing the direction sheet. Never a shed tag.
        head_count:
          type: integer
          format: int64
          description: The shed's projected head count, summed across its ration grains.
        items:
          type: array
          description: >-
            SHED-level expected quantity per feed item, with the ration grains already summed,
            because a packer fills one bag per item per shed. The same blocked-vs-zero contract as
            the preview applies: a blocked item has `quantity_kg: null`.
          items:
            $ref: "#/components/schemas/FeedDirectionItemQuantity"
        total_kg:
          type: string
          description: Sum of the resolved items, as an exact decimal string.
        status:
          type: string
          enum: [ready, blocked, empty]
          description: >-
            DERIVED from the generation result, not stored -- this surface records nothing.
            `ready`: every item resolved. `blocked`: at least one item has no authored ration, so
            the line must NOT be packed from the resolved remainder. `empty`: the shed holds no
            projected animals, which is not a configuration gap and must not be confused with one.
        completed:
          type: boolean
          description: >-
            True when this shed-session has a recorded completion (`feed.direction.completed`).
            Orthogonal to `status`: a completed line was still ready/blocked/empty underneath, so a
            client can show a "completed" badge without losing the packing state. This packing line
            IS one shed-session, so it maps 1:1 to the completion.
        blocked_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FeedDirectionBlockedReason"
    FeedDirectionCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - session_no
        - target_date
        - workflow
      properties:
        park_id:
          type: string
          format: uuid
          description: >-
            The park the shed belongs to. Optional: when omitted the server resolves the tenant's
            default park, matching the read routes. Exactly one park per completion.
        shed_id:
          type: string
          format: uuid
          description: The shed whose feeding session was carried out.
        session_no:
          type: integer
          minimum: 1
          description: >-
            The feeding session that was completed. A concrete session (>= 1); session 0 ("every
            session") is a read filter, never a completion target.
        target_date:
          type: string
          format: date
          description: The feed day, as an India business-calendar date (Asia/Kolkata). A date, never an instant.
        workflow:
          type: string
          enum: [normal, experiment]
          description: >-
            The dispatch workflow completed. REQUIRED (unlike the read filter, where empty means
            "both"): a completion records ONE concrete workflow.
        proof_refs:
          type: array
          description: >-
            OPTIONAL video proof. May be empty (completed with no video). Each reference carries a
            server-minted `proof_id` from `/app/proofs/*`; the bytes live in GCS.
          items:
            $ref: "#/components/schemas/FeedDirectionProofRef"
    FeedDirectionProofRef:
      type: object
      additionalProperties: false
      required:
        - proof_id
      properties:
        proof_id:
          type: string
          description: The server-minted proof id of a completed upload.
        proof_type:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        upload_state:
          type: string
    FeedDirectionCompleteResponse:
      type: object
      additionalProperties: false
      required:
        - completion_id
        - status
        - applied
      properties:
        completion_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed]
        applied:
          type: boolean
          description: >-
            False on an idempotent replay or when the shed-session was already completed by an
            earlier request -- the original completion is returned and no new side effects ran.
    FeedDistributionCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - session_no
        - target_date
        - workflow
        - distribution_proof_ref
        - water_proof_ref
      properties:
        park_id:
          type: string
          format: uuid
          description: >-
            The park the shed belongs to. Optional: when omitted the server resolves the tenant's
            default park, matching the read routes. Exactly one park per completion.
        shed_id:
          type: string
          format: uuid
          description: The shed whose feeding session was distributed.
        session_no:
          type: integer
          minimum: 1
          description: >-
            The feeding session that was distributed. A concrete session (>= 1); session 0 is a read
            filter, never a completion target.
        target_date:
          type: string
          format: date
          description: The feed day, as an India business-calendar date (Asia/Kolkata). A date, never an instant.
        workflow:
          type: string
          enum: [normal, experiment]
          description: The dispatch workflow distributed. REQUIRED -- a completion records ONE concrete workflow.
        distribution_proof_ref:
          type: string
          minLength: 1
          description: >-
            MANDATORY. The server-minted `proof_id` of the feed-distribution VIDEO. A blank value is
            rejected `422 proof_required`. The bytes live in GCS; only the reference is recorded.
        water_proof_ref:
          type: string
          minLength: 1
          description: >-
            MANDATORY. The server-minted `proof_id` of the water-distribution proof (a photo OR a
            video). A blank value is rejected `422 proof_required`.
    FeedDistributionCompleteResponse:
      type: object
      additionalProperties: false
      required:
        - completion_id
        - status
        - newly_pending
      properties:
        completion_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_verification, completed]
          description: >-
            `pending_verification` on a fresh submit or a rework re-submit (awaiting the verifier);
            `completed` when the shed-session had already been verifier-approved. Never `completed` on
            a first submit -- distribution is done only at verifier approval.
        newly_pending:
          type: boolean
          description: >-
            True when this call flipped the session into pending_verification and enqueued a
            verification item. False on an idempotent replay or an already-pending/already-completed
            no-op.
    FeedPackingCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - session_no
        - target_date
        - workflow
        - packing_proof_ref
      properties:
        park_id:
          type: string
          format: uuid
          description: >-
            The park the shed belongs to. Optional: when omitted the server resolves the tenant's
            default park, matching the read routes. Exactly one park per completion.
        shed_id:
          type: string
          format: uuid
          description: The shed whose packing session was carried out.
        session_no:
          type: integer
          minimum: 1
          description: >-
            The feeding session that was packed. A concrete session (>= 1); session 0 is a read
            filter, never a completion target.
        target_date:
          type: string
          format: date
          description: The feed day, as an India business-calendar date (Asia/Kolkata). A date, never an instant.
        workflow:
          type: string
          enum: [normal, experiment]
          description: The dispatch workflow packed. REQUIRED -- a completion records ONE concrete workflow.
        packing_proof_ref:
          type: string
          minLength: 1
          description: >-
            MANDATORY. The server-minted `proof_id` of the packing VIDEO. A blank value is rejected
            `422 proof_required`. The bytes live in GCS; only the reference is recorded.
    FeedPackingCompleteResponse:
      type: object
      additionalProperties: false
      required:
        - completion_id
        - status
        - newly_pending
      properties:
        completion_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_verification, completed]
          description: >-
            `pending_verification` on a fresh submit or a rework re-submit (awaiting the verifier);
            `completed` when the shed-session had already been verifier-approved. Never `completed` on
            a first submit -- packing is done only at verifier approval.
        newly_pending:
          type: boolean
          description: >-
            True when this call flipped the session into pending_verification and enqueued a
            verification item. False on an idempotent replay or an already-pending/already-completed
            no-op.
    FeedTransportTask:
      type: object
      additionalProperties: false
      required: [task_id, park_id, park_label, shed_id, shed_label, business_date, status, scheduled_at]
      properties:
        task_id: { type: string, format: uuid }
        park_id: { type: string, format: uuid }
        park_label: { type: string }
        shed_id: { type: string, format: uuid }
        shed_label: { type: string }
        business_date: { type: string, format: date }
        status: { type: string, enum: [due, verification_due, rework, completed] }
        operator_id: { type: string, format: uuid }
        rework_reason: { type: string }
        scheduled_at: { type: string, format: date-time }
    FeedTransportTaskPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedTransportTask" } }
        next_cursor: { type: string }
    FeedTransportSubmitRequest:
      type: object
      additionalProperties: false
      required: [proof_ref]
      properties:
        proof_ref: { type: string, minLength: 1, description: Server-minted proof id for one fresh in-app camera video. }
    FeedTransportSubmitResponse:
      type: object
      additionalProperties: false
      required: [attempt_id, status, attempt_no, newly_pending]
      properties:
        attempt_id: { type: string, format: uuid }
        status: { type: string, enum: [verification_due] }
        attempt_no: { type: integer, minimum: 1 }
        newly_pending: { type: boolean }
    FeedPackingWorklistSummary:
      type: object
      additionalProperties: false
      required:
        - scope
        - shed_count
        - line_count
        - total_kg_by_feed_item
        - blocked_count
        - blocked_shed_count
        - blocked_line_count
      properties:
        scope:
          type: string
          enum: [filtered]
          description: >-
            Always `filtered`: covers every line matching the request's filters, not the returned
            page, and is invariant to `limit` and `offset`. This is the figure an operator draws
            from the store before walking the park, so a page-scoped total would send them out with
            a fraction of the load.
        shed_count:
          type: integer
          description: Distinct sheds in the whole filtered scope.
        line_count:
          type: integer
          description: >-
            Shed x session packing LINES in the whole filtered scope. A packer's unit of work is the
            bag, so this counts lines rather than the preview's ration grains.
        total_kg_by_feed_item:
          type: array
          description: >-
            Per-item store draw across the WHOLE filtered scope, in authored catalog order. Blocked
            cells are counted, never summed as zero.
          items:
            $ref: "#/components/schemas/FeedDirectionFeedItemTotal"
        blocked_count:
          type: integer
          description: Blocked item cells in the whole filtered scope.
        blocked_shed_count:
          type: integer
          description: Distinct sheds carrying at least one blocked cell.
        blocked_line_count:
          type: integer
          description: Packing lines that cannot be packed as printed.
    FeedPackingWorklistPage:
      type: object
      additionalProperties: false
      required:
        - items
        - summary
        - lifecycle
        - draft
        - filters
        - target_date
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedPackingRow"
        summary:
          $ref: "#/components/schemas/FeedPackingWorklistSummary"
        lifecycle:
          $ref: "#/components/schemas/FeedDirectionLifecycle"
        draft:
          type: boolean
          description: True only for the deliberate live-compute escape hatch (draft=true).
        filters:
          $ref: "#/components/schemas/FeedDirectionFilterOptions"
        target_date:
          type: string
          format: date
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigSessionTemplatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigSessionTemplate"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigSchedule:
      type: object
      additionalProperties: false
      required:
        - schedule_config_id
        - park_id
        - workflow
        - direction_time
        - correction_time
        - valid_from
      properties:
        schedule_config_id:
          type: string
          format: uuid
        park_id:
          type: string
          format: uuid
        workflow:
          type: string
          enum: [normal, experiment]
          description: >-
            Which dispatch workflow this clock governs. Part of the natural key: normal and experiment
            genuinely run on different cutoffs.
        direction_time:
          type: string
          description: >-
            LOCAL Asia/Kolkata wall-clock time (HH:MM:SS) the day's packing direction is issued. No
            UTC offset -- a recurring business-calendar rule, not an instant.
          examples: ["07:00:00"]
        correction_time:
          type: string
          description: >-
            LOCAL Asia/Kolkata wall-clock time at which approved emergency-shifting corrections are
            BATCHED and the amended direction is reissued. Fixed rather than fire-on-approval, so a
            shed gets at most one amended direction per day.
          examples: ["14:00:00"]
        transport_time:
          type: string
          description: >-
            LOCAL Asia/Kolkata wall-clock deadline after which a correction can no longer reach the
            shed. OMITTED when the park has declared no cutoff -- read that as UNKNOWN, never as "no
            deadline".
          examples: ["15:45:00"]
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
    FeedConfigSchedulePage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigSchedule"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigShedFactor:
      type: object
      additionalProperties: false
      required:
        - shed_factor_id
        - park_id
        - shed_id
        - feed_item
        - multiplier
        - valid_from
      properties:
        shed_factor_id:
          type: string
          format: uuid
        park_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        feed_item:
          type: string
        multiplier:
          type: string
          description: Exact decimal string. A shed with NO row is treated as 1.0 by the read path.
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
    FeedConfigShedFactorPage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigShedFactor"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigExperiment:
      type: object
      additionalProperties: false
      required:
        - experiment_config_id
        - park_id
        - shed_id
        - feed_item
        - absolute_kg
        - experiment_category
        - status
      properties:
        experiment_config_id:
          type: string
          format: uuid
        park_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        feed_item:
          type: string
        absolute_kg:
          type: string
          description: >-
            Exact decimal string. A SHED TOTAL in kg, never a per-head rate -- it is already
            inclusive of however many animals are in the shed. Never multiply it by head_count.
        head_count:
          type: integer
          nullable: true
          description: >-
            INFORMATIONAL only: the population the hand-entered quantity was authored against. It is
            never a multiplier. Null means the population was not recorded, which is NOT the same as
            0 -- rendering null as 0 would state the shed is empty.
        experiment_category:
          type: string
          description: >-
            The experiment ARM (e.g. "Sheep M NEW"). It stands in for the shed tag on the direction
            sheet, because an experiment shed has no ration grain and so no authored tag to report.
        status:
          type: string
          enum: [active, retired]
          description: >-
            The workflow switch, not a visibility flag. "active" = this shed is fed the absolute kg
            authored here. "retired" = it is fed from the normal per-head ration grid instead.
    FeedConfigExperimentPage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigExperiment"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    UpsertFeedConfigExperimentRequest:
      type: object
      additionalProperties: false
      required:
        - park_id
        - shed_id
        - feed_item
        - absolute_kg
        - experiment_category
      properties:
        park_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        feed_item:
          type: string
          minLength: 1
        absolute_kg:
          type: number
          minimum: 0
          multipleOf: 0.001
          description: >-
            Authored ABSOLUTE kg for the whole shed. REQUIRED -- it must never be omitted and filled
            in as 0. The failure mode of an absent value is quieter than on the ration grid and worse
            for it: a missing ration rate BLOCKS the shed loudly, while a missing experiment row
            silently drops the shed back onto the per-head grid and prints a complete-looking sheet
            with roughly twice the authored quantity. An explicit 0 is accepted; a negative or
            over-precise value is rejected with a field error rather than clamped. A cleared input in
            the UI must NOT be sent as 0.
        head_count:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            INFORMATIONAL population count. Never multiplied into absolute_kg. Optional: null records
            "not recorded", which stays distinct from an authored 0.
        experiment_category:
          type: string
          minLength: 1
          description: >-
            The experiment arm. REQUIRED rather than defaulted because it is what the direction sheet
            prints in the shed-tag column for an experiment shed -- the operator's only cue that these
            numbers are hand-entered rather than computed.
    SetFeedConfigExperimentShedStatusRequest:
      type: object
      additionalProperties: false
      required:
        - park_id
        - shed_id
        - status
      properties:
        park_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, retired]
          description: >-
            REQUIRED with no default. This field decides which planner feeds the shed, so an absent
            value cannot be filled in: "active" enrols it onto authored absolute kg and "retired"
            returns it to head count x grams per head. Both are changes to what its animals eat.
    UpsertFeedConfigRationRateRequest:
      type: object
      additionalProperties: false
      required:
        - park_id
        - ration_group
        - shed_tag
        - feed_item
        - grams_per_head
      properties:
        park_id:
          type: string
          format: uuid
        ration_group:
          type: string
          minLength: 1
        shed_tag:
          type: string
          minLength: 1
        feed_item:
          type: string
          minLength: 1
        grams_per_head:
          type: number
          minimum: 0
          multipleOf: 0.001
          description: >-
            Authored grams per head per day. REQUIRED -- it must never be omitted and filled in as 0,
            because absence of a rate means "not configured" (blocking) while 0 means "feed nothing"
            (correct for milk-fed kids). An explicit 0 is accepted; a negative or over-precise value
            is rejected with a field error rather than clamped or rounded. A cleared input in the UI
            must NOT be sent as 0.
    UpsertFeedConfigShedFactorRequest:
      type: object
      additionalProperties: false
      required:
        - park_id
        - shed_id
        - feed_item
        - multiplier
      properties:
        park_id:
          type: string
          format: uuid
        shed_id:
          type: string
          format: uuid
        feed_item:
          type: string
          minLength: 1
        multiplier:
          type: number
          minimum: 0
          multipleOf: 0.0001
          description: >-
            Authored multiplier. REQUIRED: an absent row reads as the safe 1.0, so omitting the field
            and having the server invent one would author a value nobody entered. An explicit 0 is
            accepted; a negative value is rejected.
    UpsertFeedConfigScheduleRequest:
      type: object
      additionalProperties: false
      required:
        - park_id
        - workflow
        - direction_time
        - correction_time
      properties:
        park_id:
          type: string
          format: uuid
        workflow:
          type: string
          enum: [normal, experiment]
        direction_time:
          type: string
          description: LOCAL Asia/Kolkata wall-clock time, "HH:MM" or "HH:MM:SS". No UTC offset.
          examples: ["07:00"]
        correction_time:
          type: string
          description: >-
            LOCAL Asia/Kolkata wall-clock time corrections are batched and reissued at. May EQUAL
            direction_time (the live experiment case) but may not precede it.
          examples: ["14:00"]
        transport_time:
          type: string
          nullable: true
          description: >-
            LOCAL Asia/Kolkata transport cutoff. May be sent as null to record "no declared cutoff",
            but a present-but-malformed value is REJECTED rather than dropped to null -- turning a
            typo into null would tell the dispatcher this park has no transport deadline at all. May
            not precede correction_time.
          examples: ["15:45"]
    FeedConfigWriteResult:
      type: object
      additionalProperties: false
      required:
        - write_id
        - kind
        - outcome
        - effective_from
        - idempotent_replay
      properties:
        write_id:
          type: string
          format: uuid
          description: The ledger entry recording this edit.
        kind:
          type: string
          enum: [ration_rate, shed_factor, schedule_config, experiment_config]
        outcome:
          type: string
          enum: [inserted, superseded, corrected, unchanged]
          description: >-
            What the edit actually did. "inserted" = first authored value for the key. "superseded" =
            an earlier day's row was CLOSED and a new one opened, preserving history. "corrected" = a
            row authored on the SAME business day was corrected in place, because a window closed on
            the day it opened cannot satisfy valid_to > valid_from. "unchanged" = the value already
            matched and no row was written. An experiment_config write never returns "superseded":
            feed_experiment_config is not effective-dated, so an existing row is always corrected in
            place.
        result_row_id:
          type: string
          format: uuid
          description: The configuration row now in force. Absent only for an "unchanged" write.
        superseded_row_id:
          type: string
          format: uuid
          description: The row this edit closed. Present only for "superseded".
        effective_from:
          type: string
          format: date
          description: >-
            The Asia/Kolkata business date the edit takes effect on. Server-derived from the India
            business calendar, never from the client and never from the database clock.
        idempotent_replay:
          type: boolean
          description: >-
            True when this response is the ORIGINAL result of an earlier identical request, returned
            without re-running any side effect.
    ValidationIssue:
      type: object
      additionalProperties: false
      required:

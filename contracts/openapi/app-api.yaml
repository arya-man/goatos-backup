    FeedConfigRationRate:
      type: object
      additionalProperties: false
      required:
        - ration_rate_id
        - park_id
        - ration_group
        - shed_tag
        - feed_item
        - grams_per_head
        - valid_from
        - source_system
      properties:
        ration_rate_id:
          type: string
          format: uuid
        park_id:
          type: string
          format: uuid
        ration_group:
          type: string
        shed_tag:
          type: string
        feed_item:
          type: string
        grams_per_head:
          type: string
          description: >-
            Authored grams per head per day, as an EXACT DECIMAL STRING rather than a JSON number, so
            an authored rate cannot drift through float round-tripping. "0.000" is a real authored
            value meaning "feed nothing"; the absence of a row entirely is the different, blocking
            state "not configured".
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
          description: Absent while this row is the one in force.
        source_system:
          type: string
    FeedConfigRationRatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigRationRate"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
          description: >-
            Whether another page exists. Deliberately NOT a total count: counting the filtered set on
            every page is compute-on-read, and the grid needs "is there more", not a total.
    FeedConfigRationGroup:
      type: object
      additionalProperties: false
      required:
        - ration_group_id
        - breed
        - ration_group
      properties:
        ration_group_id:
          type: string
          format: uuid
        breed:
          type: string
        ration_group:
          type: string
    FeedConfigRationGroupPage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedConfigRationGroup"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    FeedConfigShedTag:
      type: object
      additionalProperties: false
      required:
        - shed_tag_id
        - shed_tag
        - applies_to
        - display_order
        - status
      properties:
        shed_tag_id:
          type: string
          format: uuid
        shed_tag:
          type: string
        applies_to:
          type: string
          enum: [adult, kid]
        display_order:
          type: integer
        status:
          type: string
          enum: [active, retired]
    FeedConfigShedTagPage:
      type: object
      additionalProperties: false
      required:
        - items
        - limit

  /counts/breakdown:
    get:
      tags:
        - Counts
      operationId: getCountsBreakdown
      summary: Census head counts grouped by farm, stage, breed, gender and shed.
      description: >-
        Pre-aggregated animal counts over canonical live goats, grouped by
        farm x management_stage x breed x sex x shed. `total_count` and every
        `charts` series are rolled up over the FULL filtered result set and are
        therefore independent of `limit`/`offset` — only `items` is a page.
        `management_stage` is raw source text with no controlled vocabulary, so
        near-duplicate labels can appear as distinct rows; `facets.stages`
        reports the values actually present so a filter can never offer an
        option that matches nothing.
      parameters:
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            description: Filter by park location ID (top-bar scope)
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            description: Filter by shed location ID
        - name: management_stage
          in: query
          required: false
          schema:
            type: string
            description: Filter by raw management stage
        - name: breed
          in: query
          required: false
          schema:
            type: string
            description: Filter by breed
        - name: sex
          in: query
          required: false
          schema:
            type: string
            description: Filter by sex
        - name: lifecycle_status
          in: query
          required: false
          schema:
            type: string
            default: alive
            description: Filter by lifecycle status; defaults to alive
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: Page size for items
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
            description: Page offset over the aggregated grain set
      responses:
        "200":
          description: Aggregated census breakdown with whole-result totals and chart series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsBreakdownResponse"

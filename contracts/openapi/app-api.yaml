    DriveSummary:
      type: object
      additionalProperties: false
      description: >-
        Park-level drive progress. Invariant: total_count = completed_count + submitted_count +
        due_count + overdue_count + deferred_count (5 disjoint obligation buckets); remaining_count =
        due_count + overdue_count + deferred_count = total_count - completed_count - submitted_count
        (work still owed by the OPERATOR; it excludes submitted work so it can never contradict
        progress_pct on the same payload). Distinct-animal coverage: total_animals = distinct goats in this drive;
        completed_animals = goats where ALL drive obligations are completed (fully covered);
        submitted_animals = goats with recorded mobile completion pending verification.
        Cross-surface progress: progress_completed / progress_total / progress_pct on the
        progress_basis grain are the ONE authoritative drive-progress figure. Admin-web and the
        Android app MUST render them verbatim and MUST NOT derive their own numerator from any
        other field -- two clients each picking their own fields is how the same drive showed two
        different completion numbers and ring percentages. The numerator is FIELD WORK DONE =
        completed + submitted (maintainer decision 2026-08-03): an operator who vaccinated every
        animal and submitted proof sees 100% and "4 of 4 sheds done", and the outstanding verifier
        review is carried by the verification_pending status/chip and submitted_count /
        submitted_animals, never by holding the ring below 100%. remaining_count follows the same
        numerator, so a fully submitted drive reports progress_pct 100 AND remaining_count 0 --
        one payload never carries two answers to "how much is left".
        Stock/execution "blocked" visibility is deliberately out of scope -- stock is not a built
        product feature yet (owner decision 2026-07-14); revisit when the stock module ships.
      required:
        - park_name
        - drive_name
        - drive_total
        - due_date
        - shed_count
        - sheds_completed
        - vaccine_labels
        - total_count
        - completed_count
        - submitted_count
        - remaining_count
        - due_count
        - overdue_count
        - deferred_count
        - total_animals
        - completed_animals
        - submitted_animals
        - progress_basis
        - progress_completed
        - progress_total
        - progress_pct
        - owner_label
      properties:
        park_name:
          type: string
          description: Park name or code
        drive_name:
          type: string
          description: Shared logical drive name across every operator-day in the same vaccine campaign
        drive_total:
          type: integer
          minimum: 0
          description: Total distinct animals across all operator-days carrying this logical drive name
        due_date:
          type: string
          format: date
          description: Drive due date
        shed_count:
          type: integer
          minimum: 0
          description: Number of unique sheds in the drive
        sheds_completed:
          type: integer
          minimum: 0
          description: Number of sheds where all obligations are completed
        sheds:
          type: array
          description: Per-shed animal counts for this drive.
          items:
            $ref: "#/components/schemas/DriveShedSummary"
        vaccine_labels:
          type: array
          items:
            type: string
          description: List of vaccine names involved in the drive
        total_count:
          type: integer
          minimum: 0
          description: Total obligations in the drive (completed + due + overdue + deferred)
        completed_count:
          type: integer
          minimum: 0
          description: Completed obligations
        submitted_count:
          type: integer
          minimum: 0
          description: Recorded mobile completions pending verification
        remaining_count:
          type: integer
          minimum: 0
          description: >-
            Work still owed by the OPERATOR = due_count + overdue_count + deferred_count, i.e.
            total_count - completed_count - submitted_count. Deliberately EXCLUDES
            submitted-but-unverified work, exactly like the progress numerator, so a fully
            submitted drive reports remaining_count 0 beside progress_pct 100. It was
            total_count - completed_count, which rendered "20 left" next to a full ring.
        due_count:
          type: integer
          minimum: 0
          description: Active open obligations
        overdue_count:
          type: integer
          minimum: 0
          description: Overdue/missed obligations
        deferred_count:
          type: integer
          minimum: 0
          description: Deferred obligations
        total_animals:
          type: integer
          minimum: 0
          description: Total distinct animals in the drive
        completed_animals:
          type: integer
          minimum: 0
          description: Distinct animals where all drive obligations are completed
        submitted_animals:
          type: integer
          minimum: 0
          description: Distinct animals with recorded completion pending verification
        progress_basis:
          type: string
          enum: [animals, doses]
          description: >-
            Grain that progress_completed/progress_total are counted on. "animals" whenever the
            drive has animals (a goat due several vaccines the same day is ONE animal), else the
            obligation/dose grain.
        progress_completed:
          type: integer
          minimum: 0
          description: >-
            Authoritative progress numerator on progress_basis. Verified completion only -- clients
            render this verbatim and never substitute submitted counts.
        progress_total:
          type: integer
          minimum: 0
          description: Authoritative progress denominator on progress_basis.
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Backend-rounded (half-up) progress percentage. Clients render this verbatim instead of
            re-deriving it, so the ring reads identically on every surface.
        owner_label:
          type: string
          description: Owner/team label
    DriveShedSummary:
      type: object
      additionalProperties: false
      required:

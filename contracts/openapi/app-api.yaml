        - status
        - estimated_animal_count
        - max_shed_videos
        - individual
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_shed_id:
          type: string
          format: uuid
        shed_name:
          type: string
        park_name:
          type: string
          description: The park this bucket's task belongs to. Rendered as the screen eyebrow.
        weigh_date:
          type: string
          format: date
          description: The task's Asia/Kolkata business DATE. Never a timestamp.
        operator_user_id:
          type: string
          description: >-
            Who owns this bucket. An EMPTY value is the only thing that entitles a client to
            say the bucket is not assigned.
        operator_display_name:
          type: string
          description: >-
            Backend-resolved assignee name. Empty WITH a non-empty operator_user_id means the
            assignee has no active workforce record — a roster gap, not "not assigned".
        estimated_animal_count:
          type: integer
          minimum: 0
          description: >-
            Planning-time herd estimate for the shed. A coverage hint, never a completeness
            denominator — weighing is free-flow and has no expected roster.
        max_shed_videos:
          type: integer
          minimum: 1
          description: Group-video allowance for a lump-sum submission, so "N of M" reads off policy.
        next_individual_cursor:
          type: string
          description: >-
            Keyset cursor for the next page of `individual`, on (accepted_at, observation_id).
            Absent/empty means the last page.
        weighing_category:
          $ref: "#/components/schemas/WeighingCategory"
        status:
          type: string
        individual:
          type: array
          items:
            $ref: "#/components/schemas/WeighingObservation"
        lump_sum:
          $ref: "#/components/schemas/WeighingObservation"
        period_label:
          type: string
          description: >-

    WorkflowOverdueDate:
      description: One previous Asia/Kolkata business date containing actionable overdue workflow cards.
      type: object
      additionalProperties: false
      required:
        - date
        - workflow_count
      properties:
        date:
          type: string
          format: date
        workflow_count:
          type: integer
          minimum: 1
    WorkflowFact:
      type: object
      additionalProperties: false
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: string
    WorkflowActionRow:
      description: One operator step of a workflow (template-instantiated; only status/answer/proof mutate).
      type: object
      required:
        - action_id
        - action_key
        - seq
        - section
        - action_type
        - title
        - detail
        - requires_video
        - due_at
        - status
        - blocked
        - answer_value
        - proof_ref
        - completed_by_label
        - completed_at
        - verification_status
      properties:
        action_id:
          type: string
          format: uuid
        action_key:
          type: string
        seq:
          type: integer
        section:
          type: string
          enum:
            - main
            - colostrum_session
        action_type:
          type: string
          enum:
            - question
            - question_select
            - action
            - approval
        title:
          type: string
        detail:
          type: string
        requires_video:
          type: boolean
        options:
          description: Configured question_select options; absent for free-value questions.
          type: array
          items:
            type: string
        due_at:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - pending
            - in_review
            - completed
            - rework
            - canceled
        blocked:
          description: True when the operator cannot start this action yet.
          type: boolean
        blocked_reason:
          description: Backend-owned reason; absent when blocked is false.
          type: string
          enum:
            - previous_action
            - not_yet_due
            - signoff
        answer_value:
          type:
            - string
            - "null"
        proof_ref:
          type:
            - string
            - "null"
        completed_by_label:
          type: string
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        verification_status:
          description: Empty, or pending/rework/approved for verification-gated steps.
          type: string
    WorkflowDetailResponse:
      allOf:
        - $ref: "#/components/schemas/WorkflowCard"
        - type: object
          required:
            - facts
            - actions
          properties:
            facts:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowFact"
            actions:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowActionRow"
    AnswerWorkflowActionRequest:
      type: object
      additionalProperties: false
      required:
        - answer_value
      properties:
        answer_value:
          type: string
          minLength: 1
          maxLength: 200
        proof_ref:
          description: Server-minted proof id from /app/proofs/*; MANDATORY when the question requires_video.
          type: string
          minLength: 1
          maxLength: 200
    CompleteWorkflowActionRequest:
      type: object
      additionalProperties: false
      properties:
        proof_ref:
          description: Server-minted proof id from /app/proofs/*; MANDATORY for requires_video actions.
          type: string
          minLength: 1
          maxLength: 200
    WorkflowActionWriteResponse:
      type: object
      additionalProperties: false
      required:
        - workflow_id
        - action_id
        - status
        - workflow_state
        - actions_done
        - actions_total
        - awaiting_verification
        - completed_at
        - idempotent_replay
      properties:
        workflow_id:
          type: string
          format: uuid
        action_id:
          type: string
          format: uuid
        status:
          type: string
        workflow_state:
          type: string
        actions_done:
          type: integer
        actions_total:
          type: integer
        awaiting_verification:
          type: boolean
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        idempotent_replay:
          type: boolean
    RecordBirthEventRequest:
      description: >-
        The goat-creation request for a newborn. origin_type is pinned to 'birth' by the endpoint: it
        may be omitted, but if present it must be 'birth'.
        For this birth route the server ignores child identifiers from the app and generates one
        provisional identifier per child from the canonical park code (`CBE-` or `CPT-`) plus five
        deterministic digits. One request fans out according to litter_size, so Twins creates two
        distinct canonical goats and Triplets creates three. The app never scans a child RFID at birth
        (docs/decisions/birth-death-workflows.md); the kid is promoted to its permanent RFID later
        through the "Tag the kid" step / Awaiting RFID flow.
      type: object
      additionalProperties: false
      required:
        - species
        - breed
        - sex
        - dob
        - entry_date
        - dam_id
        - litter_size
        - evidence_refs
      properties:
        animal_identifier_1:
          description: The permanent RFID. Provide this OR temporary_identifier, never both.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        temporary_identifier:
          description: >-
            A provisional tag for a newborn not yet permanently tagged. Provide this OR
            animal_identifier_1, never both. Stored as a temporary_tag identifier; the kid still reads
            as untagged until promoted to a permanent RFID.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        animal_identifier_2:
          description: Optional until double RFID tagging is live; that rollout must make this mandatory in both app validation and DB constraints.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        species:
          type: string
          enum:
            - goat
            - sheep
        farm_id:
          type: string
          format: uuid
        farm_code:
          type: string
          minLength: 1
          maxLength: 120
        park_id:
          type: string
          format: uuid
        park_code:
          type: string
          minLength: 1
          maxLength: 120
        shed_id:
          type: string
          format: uuid
        shed_code:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          minLength: 1
          maxLength: 120
        sex:
          type: string
          enum:
            - female
            - male
        dob:
          description: Date of birth. Required, and must not be after entry_date.
          type: string
          format: date
        dob_estimated:
          type: boolean
        time_of_birth:
          description: >-
            Optional birth time (HH:MM, 24-hour, IST wall clock). Stored as goats.time_of_birth and
            used by the birth follow-up workflow to anchor time-offset steps; absent means unknown
            and readers fall back to 07:00 IST.
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        origin_type:
          description: Optional. When present it must be 'birth'; any other value is rejected.
          type: string
          const: birth
        entry_date:
          type: string
          format: date
        management_stage:
          type: string
          maxLength: 80
        health_status:
          type: string
          maxLength: 80
        weight_kg:
          type: number
          minimum: 0
        dam_id:
          description: >-
            Required mother RFID. The server resolves it tenant-safely to a canonical female goat
            before queueing approval, replaces this queued value with that goat UUID, and stores only
            the canonical mother_goat_id in goat_births.
          type: string
          minLength: 1
          maxLength: 120
        litter_size:
          description: >-
            Number born in this delivery. This one request immediately creates that many distinct
            canonical children; the same mother and litter size are stored on every sibling row.
          type: integer
          enum: [1, 2, 3]
        sire_or_lot:
          type: string
          maxLength: 120
        photo_url:
          type: string
          maxLength: 500
        source_record_id:
          type: string
          maxLength: 200
        evidence_refs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceRef"
        vaccination_history:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRef"
    PromoteIdentifierRequest:
      description: >-
        Assign a permanent RFID to a temporary-tagged goat. The temporary tag to retire is found
        server-side, so only the permanent RFID and the goat's current row_version are sent.
      type: object
      additionalProperties: false
      required:
        - permanent_identifier
        - row_version
      properties:
        permanent_identifier:
          description: The permanent RFID to attach as the goat's primary animal_identifier_1.
          type: string
          minLength: 1
          maxLength: 200
        animal_identifier_2:
          description: >-
            Optional second permanent RFID, attached as the goat's non-primary animal_identifier_2 in
            the SAME atomic promotion (exactly like the birth flow's optional second identifier). Omit
            or send empty to attach only the primary. When present it must differ from
            permanent_identifier.
          type: string
          maxLength: 200
        row_version:
          description: The goat's current optimistic-concurrency token (from the temporary-tagged list).
          type: integer
          minimum: 1
    PromoteIdentifierResponse:
      type: object
      additionalProperties: false
      required:
        - goat_id
        - idempotent_replay
      properties:
        goat_id:
          type: string
          format: uuid
        idempotent_replay:
          description: True when this returned a prior identical promotion rather than a new one.
          type: boolean
    RecordDeathEventRequest:
      description: >-
        The guardrailed critical-death exit. lifecycle_status and exit_reason are constants: the
        dead+died pairing is the guardrail, and any other combination is rejected.
      type: object
      additionalProperties: false
      required:
        - goat_id
        - lifecycle_status
        - exit_reason
        - reason
        - evidence_refs
        - row_version
      properties:
        goat_id:
          description: The animal that died. Carried in the body because this route is not addressed per-animal.
          type: string
          format: uuid
        lifecycle_status:
          type: string
          const: dead
        exit_reason:
          type: string
          const: died
        reason:
          description: The operator's account of the death.
          type: string
          minLength: 3
          maxLength: 500
        occurred_at:
          description: When the death occurred. Defaults to the time the event is recorded.
          type: string
          format: date-time
        evidence_refs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceRef"
        row_version:
          description: Optimistic-concurrency guard against the animal's current row version.
          type: integer
          minimum: 1
    CountsGoatWriteResponse:
      description: The identity module's goat-write result, returned unchanged by the birth and death endpoints.
      type: object
      additionalProperties: false
      required:
        - goat
        - identifiers
        - decision
        - events
        - idempotency
        - generation_status
        - trace_id
      properties:
        goat:
          $ref: "#/components/schemas/GoatSummary"
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/GoatIdentifier"
        decision:
          $ref: "#/components/schemas/CountsDecisionRecordSummary"
        events:
          description: The domain events emitted by the write (goat.created for a birth, goat.exited for a death).
          type: array
          items:
            $ref: "#/components/schemas/CountsEventSummary"
        idempotency:
          $ref: "#/components/schemas/IdempotencyMeta"
        generation_status:
          $ref: "#/components/schemas/CountsGenerationStatus"
        trace_id:
          type: string
          minLength: 1
    CountsDecisionRecordSummary:
      type: object
      additionalProperties: false
      required:
        - decision_id
        - decision_type
        - decision_result
        - decision_state
        - policy_version
        - created_at
      properties:
        decision_id:
          type: string
          format: uuid
        decision_type:
          type: string
          minLength: 1
          maxLength: 120
        decision_result:
          type: string
          minLength: 1
          maxLength: 120
        decision_state:
          type: string
          enum:
            - proposed
            - approved
            - rejected
            - needs_review
        policy_version:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
    CountsEventSummary:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          minLength: 1
          maxLength: 120
    CountsGenerationStatus:
      description: >-
        Whether the write queued downstream obligation generation. A birth queues the kid's
        vaccination obligations; a death cancels open obligations instead of generating any.
      type: string
      enum:
        - queued
        - skipped_needs_review
        - skipped_ineligible
        - not_applicable
    CountsApprovalSubmitResponse:
      description: >-
        The result of raising a lifecycle approval. Birth creates its canonical children immediately
        and returns them here; its pending approval controls only herd-count eligibility. Death still
        applies the exit only after approval and therefore returns no children.
      type: object
      additionalProperties: false
      required:
        - approval_request_id
        - request_type
        - status
        - raised_at
        - idempotent_replay
      properties:
        approval_request_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [birth, death, shifting]
        status:
          type: string
          enum: [pending, approved, rejected]
        raised_at:
          type: string
          format: date-time
        idempotent_replay:
          description: True when this result was returned from a previous identical request rather than a new write.
          type: boolean
        children:
          description: Canonical children created by this birth submission; absent for death.
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CountsBirthChildResult"
    CountsBirthChildResult:
      type: object
      additionalProperties: false
      required:
        - goat_id
        - temporary_identifier
        - child_ordinal
      properties:
        goat_id:
          type: string
          format: uuid
        temporary_identifier:
          description: Provisional CBE-/CPT- identifier retired when permanent RFID is promoted.
          type: string
          pattern: '^(CBE|CPT)-[0-9]{5}$'
        child_ordinal:
          type: integer
          minimum: 1
          maximum: 3
    CountsApprovalListItem:
      description: One row of the approver's queue - who raised what, and when.
      type: object
      additionalProperties: false
      required:
        - approval_request_id
        - request_type
        - status
        - raised_by_user_id
        - raised_at
        - summary
      properties:
        approval_request_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [birth, death, shifting]
        status:
          type: string
          enum: [pending, approved, rejected]
        raised_by_user_id:
          description: The operator who reported the event.
          type: string
          format: uuid
        raised_at:
          type: string
          format: date-time
        shifting_event_id:
          description: Present only for a shifting request - the pending movement this authorizes.
          type: string
          format: uuid
        subject_goat_id:
          description: Present only for a death request - the animal the request would exit.
          type: string
          format: uuid
        summary:
          description: The submitted payload, for rendering the row without a second fetch.
          type: object
          additionalProperties: true
        decided_by_user_id:
          type: string
          format: uuid
        decided_at:
          type: string
          format: date-time
        decision_reason:
          type: string
    CountsApprovalListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CountsApprovalListItem"
        next_cursor:
          description: >-
            Opaque keyset cursor for the next page. Absent when this is the last page. Keyset, not
            offset: the queue is appended to continuously, so an offset page would skip or repeat
            rows as new requests arrive while an approver pages.
          type: string
    CountsApprovalDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          description: >-
            Why the request was decided this way. REQUIRED when rejecting (a rejection without a
            reason is not actionable by the operator who raised it); optional when approving.
          type: string
          maxLength: 2000
    CountsApprovalDecisionResponse:
      type: object
      additionalProperties: false
      required:
        - approval_request_id
        - request_type
        - status
        - idempotent_replay
      properties:
        approval_request_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [birth, death, shifting]
        status:
          type: string
          enum: [pending, approved, rejected]
        decided_by_user_id:
          type: string
          format: uuid
        decided_at:
          type: string
          format: date-time
        decision_reason:
          type: string
        applied_result_type:
          description: >-
            What the approval produced, recorded in the SAME transaction as the status flip: 'goat'
            for an approved birth or death, 'shifting_event' for an approved movement. Absent on a
            rejection, which applies nothing.
          type: string
          enum: [goat, shifting_event]
        applied_result_id:
          description: The id of the created/exited animal, or of the authorized shifting event.
          type: string
          format: uuid
        idempotent_replay:
          description: >-
            True when the request was already decided this way and this call applied nothing. A
            second approve never double-applies.
          type: boolean
    CountsShiftingCancelRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          description: >-
            Why this authorized movement will never be executed. REQUIRED and enforced by the
            database: an abandoned movement that disappears with no explanation is
            indistinguishable from one that was carried out.
          type: string
          minLength: 1
          maxLength: 2000
    CountsShiftingExecutionResponse:
      type: object
      additionalProperties: false
      required:
        - shifting_event_id
        - event_status
        - destination_park_id
        - destination_shed_id
        - moved_goat_ids
        - moved_count
        - idempotent_replay
      properties:
        shifting_event_id:
          type: string
          format: uuid
        event_status:
          description: >-
            'applied' after a completion (the animals moved); 'canceled' after a cancellation
            (nothing moved).
          type: string
          enum: [applied, canceled]
        destination_park_id:
          type: string
          format: uuid
        destination_shed_id:
          type: string
          format: uuid
        moved_goat_ids:
          description: >-
            Exactly which animals were relocated. Empty for a cancellation, which moves nobody.
          type: array
          items:
            type: string
            format: uuid
        moved_count:
          type: integer
          minimum: 0
        applied_at:
          description: When the operator confirmed the movement, as an absolute instant (UTC).
          type: string
          format: date-time
        applied_at_ist:
          description: >-
            The same instant rendered in the Asia/Kolkata business calendar. Goat OS business
            meaning is always India business-calendar meaning - a movement completed at 02:00 IST
            belongs to that IST date, not the previous UTC one.
          type: string
          format: date-time
        applied_by:
          type: string
          format: uuid
        canceled_at:
          type: string
          format: date-time
        canceled_at_ist:
          description: The cancellation instant in the Asia/Kolkata business calendar.
          type: string
          format: date-time
        canceled_by:
          type: string
          format: uuid
        cancel_reason:
          type: string
        idempotent_replay:
          description: >-
            True when the movement had already reached this state and this call changed nothing. A
            replayed completion relocates nobody a second time.
          type: boolean
    TemporaryTaggedGoatsResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryTaggedGoat"
        next_cursor:
          description: >-
            Present only when another page exists. The last row's display_id; pass back as ?cursor=.
          type: string
    TemporaryTaggedGoat:
      description: One goat awaiting a permanent RFID (it still carries an active temporary tag).
      type: object
      additionalProperties: false
      required:
        - goat_id
        - display_id
        - temporary_identifier
        - location_display
        - row_version
      properties:
        goat_id:
          type: string
          format: uuid
        display_id:
          type: string
          pattern: ^G-[0-9]{6,}$
        temporary_identifier:
          description: The active temporary tag value that promotion will retire.
          type: string
          minLength: 1
          maxLength: 200
        location_display:
          description: The animal's own shed (then park) name.
          type: string
        row_version:
          description: >-
            The goat's current optimistic-concurrency token. Sent back verbatim in the promote call
            so a stale in-hand row is rejected instead of clobbering a newer change.
          type: integer
          format: int32
          minimum: 1
    CountsShiftingPendingExecutionResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - status_counts
        - previous_dates
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CountsShiftingPendingExecutionItem"
        next_cursor:
          description: Present only when another page exists. Opaque; pass back as ?cursor=.
          type: string
        status_counts:
          $ref: "#/components/schemas/CountsShiftingActionStatusCounts"
        previous_dates:
          type: array
          items:
            $ref: "#/components/schemas/CountsShiftingPreviousDate"
    CountsShiftingActionStatusCounts:
      type: object
      additionalProperties: false
      required: [all, pending, authorized, rework, completed]
      properties:
        all: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        authorized: { type: integer, minimum: 0 }
        rework: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
    CountsShiftingPreviousDate:
      type: object
      additionalProperties: false
      required: [date, action_count]
      properties:
        date: { type: string, format: date }
        action_count: { type: integer, minimum: 1 }
    CountsShiftingPendingExecutionItem:
      type: object
      additionalProperties: false
      required:
        - shifting_event_id
        - event_status
        - verification_state
        - primary_action_key
        - priority
        - category
        - destination_park_id
        - destination_park_name
        - destination_shed_id
        - destination_shed_name
        - raised_at
        - raised_at_ist
        - effective_at
        - animal_count
        - animals_truncated
        - animals
      properties:
        shifting_event_id:
          type: string
          format: uuid
        event_status:
          description: Canonical movement state; applied is shown as rework only when verification was rejected.
          type: string
          enum: [pending, authorized, applied]
        verification_state:
          description: Evidence-review state. Rejected requires fresh evidence and never rolls back an applied move.
          type: string
          enum: [unverified, verified, rejected]
        primary_action_key:
          description: Backend-owned row action. Completed rows are none and cannot open execution.
          type: string
          enum: [execute, none]
        priority:
          type: string
          enum: [high, low]
        category:
          type: string
          enum: [growth, health, breeding, delivery]
        source_park_id:
          description: Where the animals are NOW. Null when the movement recorded no origin.
          type: string
          format: uuid
        source_park_name:
          type: string
        source_shed_id:
          type: string
          format: uuid
        source_shed_name:
          type: string
        destination_park_id:
          type: string
          format: uuid
        destination_park_name:
          type: string
        destination_shed_id:
          type: string
          format: uuid
        destination_shed_name:
          type: string
        approved_by_user_id:
          description: Who authorized this movement - the operator's basis for acting.
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time
        approved_at_ist:
          description: The approval instant in the Asia/Kolkata business calendar.
          type: string
          format: date-time
        raised_by_user_id:
          type: string
          format: uuid
        raised_at:
          type: string
          format: date-time
        raised_at_ist:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        animal_count:
          description: >-
            The FULL number of animals this movement covers - not the length of the animals preview
            below. This is what an operator needs in order to judge whether they can do the movement
            now.
          type: integer
          minimum: 0
        animals_truncated:
          description: True when animal_count exceeds the number of animals returned in the preview.
          type: boolean
        animals:
          description: >-
            A bounded preview of at most 5 animals, for recognition. A movement may name up to 500
            animals; embedding all of them in a 20-row page would be a 10,000-row read to draw one
            phone screen, so the full roster belongs to the drill-down rather than the list row.
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CountsShiftingPendingExecutionAnimal"
        feed_requirement:
          description: Backend-owned destination ration for high-priority shifting; absent for low priority.
          $ref: "#/components/schemas/CountsShiftingFeedRequirement"
    CountsShiftingFeedRequirement:
      type: object
      additionalProperties: false
      required: [status, animal_count, items]
      properties:
        status:
          type: string
          enum: [ready, blocked]
        blocked_reason:
          type: string
        fingerprint:
          type: string
          description: Present only when ready; completion must echo it to reject stale feed config.
        target_management_stage:
          type: string
        animal_count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [feed_item_label, quantity_grams]
            properties:
              feed_item_label: { type: string }
              quantity_grams:
                type: string
                description: Exact decimal total grams for all animals in this movement.
    CountsShiftingPendingExecutionAnimal:
      type: object
      additionalProperties: false
      required:
        - goat_id
        - display_id
      properties:
        goat_id:
          type: string
          format: uuid
        display_id:
          type: string
        tag:
          description: >-
            The animal's active primary ear-tag/RFID identifier, when it has one. This is the label
            physically attached to the animal, so it is what an operator actually reads in a shed.
          type: string

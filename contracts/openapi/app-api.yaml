          items:
            $ref: "#/components/schemas/CountsBreakdownSeriesPoint"
    CountsBreakdownShedFacet:
      type: object
      additionalProperties: false
      description: >-
        One shed filter option. Carries park_id as its own field because SHED NAMES ARE NOT
        UNIQUE ACROSS PARKS — in real data 66 of 154 shed names exist in both parks, so a client
        cascading Park -> Shed must filter this list by park_id. key stays the shed UUID so an
        entry is unambiguous on its own, and the park is never encoded into label.
      required:
        - key
        - label
        - count
        - park_id
      properties:
        key:
          type: string
          description: Shed UUID; empty for the bucket of animals with no shed assigned.
        label:
          type: string
        count:
          type: integer
          minimum: 0
        park_id:
          type: string
          description: >-
            Park UUID these animals sit in; empty only when the animals have no park assigned.
            Matches the park_id request filter, so count equals what
            ?park_id=<park_id>&shed_id=<key> returns.
    CountsBreakdownFacets:
      type: object
      additionalProperties: false
      required:
        - lifecycle
        - stages
        - breeds
        - parks
        - sheds
      properties:
        lifecycle:
          type: array
          description: >-
            Distinct lifecycle_status values present in the whole tenant herd (alive/dead/sold/
            culled/transferred), independent of the currently-selected lifecycle filter — this is
            what lets a client offer Live/Sold/Culled/Dead/Transferred as filter options rather
            than only ever showing the live herd.
          items:
            $ref: "#/components/schemas/CountsBreakdownSeriesPoint"
        stages:
          type: array
          description: Distinct management_stage values actually present, so a filter cannot offer a dead option.
          items:
            $ref: "#/components/schemas/CountsBreakdownSeriesPoint"
        breeds:
          type: array
          items:
            $ref: "#/components/schemas/CountsBreakdownSeriesPoint"
        parks:
          type: array
          description: >-
            Parks holding animals, keyed by park_id and labelled with the park code. Backs the
            Farm filter so its options are live data rather than a hardcoded park list.
          items:
            $ref: "#/components/schemas/CountsBreakdownSeriesPoint"
        sheds:
          type: array
          description: >-
            Sheds holding animals, keyed by shed_id and carrying park_id so a Park -> Shed
            cascade can filter them. Whole-result rollup, independent of limit/offset. UNCAPPED
            on purpose — unlike charts.shed, which is display-capped to the top 12 bars, this is
            a filter vocabulary and a silent truncation would present a partial shed list as the
            complete one. Bounded by the distinct shed vocabulary, not by herd size.
          items:
            $ref: "#/components/schemas/CountsBreakdownShedFacet"

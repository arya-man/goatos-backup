          $ref: "#/components/responses/ServerError"
  /feed-direction/generation-preview:
    get:
      tags:
        - Feed Direction
      operationId: getFeedDirectionGenerationPreview
      summary: Preview Feed Direction generation inputs from the bounded Counts/Shifting projection.
      description: >-
        Returns Feed Direction's read-only view of Counts/Shifting projected_count_for rows and
        aggregate shed+breed totals. The preview surfaces pregnant/lactating/warm-up shifted-cohort
        ration blockers, destination shortages, unsafe surplus, and unresolved ration context before
        generation. It never enables generation while G2-G17 remain open.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: target_date
          in: query
          required: true
          description: Feed projection date in YYYY-MM-DD form.
          schema:
            type: string
            format: date
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: breed_key
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque keyset cursor returned by the previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Defaults to 50.
      responses:
        "200":
          description: Fail-closed Feed Direction generation preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDirectionGenerationPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/counts-projection/exceptions:
    get:
      tags:
        - Feed Direction
      operationId: listFeedDirectionCountsProjectionExceptions
      summary: List bounded Counts/Shifting projection exceptions for Feed Direction review.
      description: >-
        Returns owner-visible Counts/Shifting exception work for Feed Direction before any resolve
        or dismiss action. This queue is for reviewed closure of blockers such as pregnant shifted
        cohorts with unresolved destination ration context, count mismatches, alias conflicts,
        unsafe surplus, or query-plan proof gaps. It does not allow generation by itself.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - resolved
              - dismissed
          description: Defaults to open.
        - name: park_id
          in: query
          schema:
            type: string
            format: uuid
        - name: shed_id
          in: query
          schema:
            type: string
            format: uuid
        - name: exception_type
          in: query
          schema:
            type: string
            enum:
              - missing_base_count
              - missing_structured_impact
              - unreported_shifting
              - count_mismatch
              - alias_conflict
              - ration_context_unresolved
              - destination_shortage
              - unsafe_surplus
              - query_plan_unproven
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - warning
              - blocking
              - critical
        - name: owner_ref
          in: query
          schema:
            type: string
        - name: work_state
          in: query
          schema:
            type: string
            enum:
              - blocked
              - resolved
              - dismissed
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor returned by the previous page.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Defaults to 50.
      responses:
        "200":
          description: Bounded Counts/Shifting projection exception queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDirectionCountsProjectionExceptionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/counts-projection/exceptions/{exception_id}/resolve:
    post:
      tags:
        - Feed Direction
      operationId: resolveFeedDirectionCountsProjectionException
      summary: Resolve a Counts/Shifting projection exception after reviewed feed-safety closure.
      description: >-
        Closes an open Counts/Shifting projection exception through the Feed Direction surface with
        actor, reason, optional source reference, and idempotent replay protection. This does not
        make Feed generation ready by itself; the next projection recompute must still prove the
        underlying shed/cohort ration context.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: exception_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedDirectionCountsProjectionExceptionActionRequest"
      responses:
        "200":
          description: Counts/Shifting projection exception resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDirectionCountsProjectionExceptionActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/counts-projection/exceptions/{exception_id}/dismiss:
    post:
      tags:
        - Feed Direction
      operationId: dismissFeedDirectionCountsProjectionException
      summary: Dismiss a duplicate or intentionally non-blocking Counts/Shifting projection exception.
      description: >-
        Dismisses an open Counts/Shifting projection exception with actor, reason, optional source
        reference, and idempotent replay protection. This path is for reviewed duplicates or
        explicitly accepted non-blocking findings; it must not be used as a hidden generation bypass.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: exception_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedDirectionCountsProjectionExceptionActionRequest"

  /feed-direction/preview:
    get:
      tags:
        - Feed Direction
      operationId: getFeedDirectionPreview
      summary: Generated feed direction for one park and one feed day.
      description: >-
        Turns the projected shed counts for `target_date` (live herd plus the movements that are
        approved but not yet executed) and the authored ration grid into per-session feed
        quantities.


        Resolution rule: the ration group is `Kid` when the animals' management stage maps onto a
        shed tag whose `applies_to` is `kid`, otherwise the breed's authored ration group; the grid
        key is (park, ration_group, shed_tag, feed_item); the shed quantity is
        `projected_head_count x grams_per_head x shed_factor`, split across the park's sessions.
        The kid/adult branch comes from the SHED TAG, never from the animal's stored age band --
        the two disagree on live data and the tag vocabulary is what the grid is indexed by.


        `items` is a page of SHEDS (a shed's grains never straddle a page boundary). `summary`
        covers the WHOLE filtered result set and is invariant to `limit`/`offset` -- see
        `FeedDirectionPreviewSummary`.


        CONFIGURED ZERO IS NOT MISSING CONFIGURATION. An authored rate of 0 is a real feeding
        instruction (milk-fed kids) and appears as `status: resolved` with `quantity_kg: "0.000"`.
        A cell with NO authored rate appears as `status: blocked` with `quantity_kg: null` and a
        reason. The two are never collapsed: a silently zeroed cell is a shed that goes unfed while
        the sheet looks complete. Clients MUST NOT treat a blocked quantity as zero, and
        `session_total_kg` deliberately sums resolved items only -- `blocked: true` on the row is
        what says the total is partial.


        Paging is by SHED, so a shed's rows never straddle a page boundary and every
        `session_total_kg` is complete. `summary` is PAGE-SCOPED and declares so in `summary.scope`;
        it is not a park total.
      parameters:
        - name: park_id
          in: query
          required: true
          description: >-
            The park to generate for. REQUIRED: the ration grid, the session split and the dispatch
            clock are all park-scoped, so a tenant-wide generation would mix two parks' rations.
          schema:
            type: string
            format: uuid
        - name: target_date
          in: query
          required: true
          description: >-
            The feed day, as an India business-calendar date (Asia/Kolkata). A date, never an
            instant: an instant would reintroduce the UTC-vs-IST day-boundary bug and generate the
            sheet for the wrong day.
          schema:
            type: string
            format: date
        - name: shed_id
          in: query
          required: false
          description: Narrow to a single shed.
          schema:
            type: string
            format: uuid
        - name: session
          in: query
          required: false
          description: >-
            Narrow to one feeding session number. Absent means every session. Narrowing does NOT
            rescale: the morning batch stays the morning batch.
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: workflow
          in: query
          required: false
          description: >-
            Narrow the served issue to one dispatch workflow. Absent unions both (normal packing +
            hand-entered experiment sheds), which is the whole park-day's sheet. An unrecognised
            value is rejected rather than silently widened.
          schema:
            type: string
            enum: [normal, experiment]
        - name: draft
          in: query
          required: false
          description: >-
            The ONLY live-compute path. `draft=true` returns a live what-if sheet computed from the
            CURRENT herd + config WITHOUT reading or writing any issue, for tuning ration rates
            before the sheet is issued. The response carries `draft: true` and `lifecycle.state:
            draft` so a what-if can never be mistaken for a frozen issued sheet. Absent/false serves
            the frozen issued sheet (or its pending/never-issued state).
          schema:
            type: boolean
        - $ref: "#/components/parameters/FeedDirectionLimit"
        - $ref: "#/components/parameters/FeedDirectionOffset"
      responses:
        "200":
          description: >-
            One page of the FROZEN issued sheet plus its lifecycle, OR (when nothing is issued yet)
            an explicit pending/never-issued state, OR (draft=true) a live what-if.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDirectionPreviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-packing/worklist:
    get:
      tags:
        - Feed Direction
      operationId: getFeedPackingWorklist
      summary: Per-shed packing worklist for one park and one feed day.
      description: >-
        The same generated quantities as `/feed-direction/preview`, collapsed to the line a packer
        works from: one row per shed per session, with the shed's ration grains already summed,
        because a packer fills one bag per feed item per shed rather than one per grain. The totals
        are summed from the ALREADY-ROUNDED session quantities, so the worklist matches the
        direction sheet exactly rather than differing by a rounding step.


        READ-ONLY. Nothing here is recorded: there is no proof capture, no video, and no stored
        packing state. `status` is DERIVED from the generation result -- `ready` when every item
        resolved, `blocked` when any item has no authored ration (the line must not be packed from
        the resolved remainder, which would send the shed short), and `empty` when the shed holds no
        projected animals, which is not a configuration gap.


        `items` is a page of SHEDS; `summary` is the store draw for the WHOLE filtered worklist and
        is invariant to `limit`/`offset` -- see `FeedPackingWorklistSummary`.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: target_date
          in: query
          required: true
          description: The feed day, as an India business-calendar date (Asia/Kolkata).
          schema:
            type: string
            format: date
        - name: session
          in: query
          required: false
          description: >-
            Narrow to one feeding session number. Absent means every session. Narrowing does NOT
            rescale: the morning batch stays the morning batch. Same contract as the preview.
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: workflow
          in: query
          required: false
          description: >-
            Narrow the served issue to one dispatch workflow. Absent unions both. See the preview.
          schema:
            type: string
            enum: [normal, experiment]
        - name: draft
          in: query
          required: false
          description: >-
            The only live-compute path; see the preview's `draft`. Absent/false serves the frozen
            issued worklist (or its pending/never-issued state).
          schema:
            type: boolean
        - $ref: "#/components/parameters/FeedDirectionLimit"
        - $ref: "#/components/parameters/FeedDirectionOffset"
      responses:
        "200":
          description: >-
            One page of the FROZEN issued worklist plus its lifecycle, its pending/never-issued
            state, or (draft=true) a live what-if.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPackingWorklistPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/complete:
    post:
      tags:
        - Feed Direction
      operationId: completeFeedDirectionSession
      summary: Record that one shed-session's feed direction was carried out.
      description: >-
        Marks ONE shed's ONE feeding session on ONE feed day as fed ("feed direction completed"),
        with OPTIONAL video proof. The completion grain is the operator's unit of work --
        (park, shed, session_no, target_date, workflow) -- not the ration grain: one shed's session
        is done or it is not, regardless of how many ration rows it printed. After a completion the
        `/feed-direction/preview` and `/feed-packing/worklist` rows for that shed-session report
        `completed: true`.


        Idempotent on two axes: the `Idempotency-Key` header (an exact replay returns the original
        result and runs no side effects; the same key with a different payload is `409`), and the
        shed-session natural key (a second completion of the same shed-session, under any key, is a
        no-op that returns `applied: false`).


        Video is OPTIONAL: `proof_refs` may be empty. When present, each reference must resolve to a
        real, completed upload minted through `/app/proofs/*`; the bytes live in GCS and only the
        reference is recorded here.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedDirectionCompleteRequest"
      responses:
        "200":
          description: The shed-session is recorded completed (or was already completed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDirectionCompleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/distribution/complete:
    post:
      tags:
        - Feed Direction
      operationId: completeFeedDistribution
      summary: Submit one shed-session's feed distribution for verifier approval.
      description: >-
        The verifier-GATED feed DISTRIBUTION completion (maintainer decision, 2026-07-26), entirely
        separate from `POST /feed-direction/complete` (feed PACKING, which is unchanged: instant,
        optional-video, no verifier). The operator submits TWO mandatory proofs -- a
        feed-distribution VIDEO (`distribution_proof_ref`) and a water-distribution proof
        (`water_proof_ref`, which may be a photo OR a video) -- which writes a `pending_verification`
        row and enqueues ONE verification item carrying both proofs. NOTHING is completed here.


        The session is `completed` only when a verifier APPROVES the item; a rejection bounces it to
        `rework` for a re-shoot, and re-submitting returns it to `pending_verification`. After
        verifier approval the `/feed-direction/preview` rows for that shed-session report
        `completed: true`.


        Both proofs are MANDATORY: a request missing `distribution_proof_ref` or `water_proof_ref` is
        rejected `422 proof_required` before any state changes -- there is nothing for a verifier to
        approve. Idempotent on the `Idempotency-Key` header (an exact replay returns the original
        result and runs no side effects; the same key with a different payload is `409`) and on the
        shed-session natural key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedDistributionCompleteRequest"
      responses:
        "200":
          description: >-
            The shed-session is recorded pending_verification (or was already completed). The session
            is not done until a verifier approves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDistributionCompleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          description: >-
            A mandatory proof is missing (`code: proof_required`): either the feed-distribution video
            or the water-distribution proof was blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-direction/packing/complete:
    post:
      tags:
        - Feed Direction
      operationId: completeFeedPacking
      summary: Submit one shed-session's feed packing for verifier approval.
      description: >-
        The verifier-GATED feed PACKING completion (maintainer decision, 2026-07-26, SUPERSEDING the
        earlier "packing stays instant, no verifier" rule). The operator submits ONE mandatory packing
        VIDEO (`packing_proof_ref`), which writes a `pending_verification` row and enqueues ONE
        verification item carrying the video. NOTHING is completed here.


        The packing session is `completed` only when a verifier APPROVES the item; a rejection bounces
        it to `rework` for a re-shoot, and re-submitting returns it to `pending_verification`. After
        verifier approval the `/feed-packing/worklist` rows for that shed-session report
        `completed: true`.


        This is a SEPARATE record from the old instant `POST /feed-direction/complete` path (now inert)
        and from the distribution gate. The packing video is MANDATORY: a request missing
        `packing_proof_ref` is rejected `422 proof_required` before any state changes -- there is
        nothing for a verifier to approve. Idempotent on the `Idempotency-Key` header (an exact replay
        returns the original result and runs no side effects; the same key with a different payload is
        `409`) and on the shed-session natural key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedPackingCompleteRequest"
      responses:
        "200":
          description: >-
            The shed-session is recorded pending_verification (or was already completed). The packing
            session is not done until a verifier approves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPackingCompleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          description: >-
            The mandatory packing video is missing (`code: proof_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-transport/tasks:
    get:
      tags: [Feed Direction]
      operationId: listFeedTransportTasks
      summary: List today's daily shed-grain Feed Transport tasks.
      parameters:
        - in: query
          name: business_date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: One bounded page of daily tasks; grain is tenant + business_date + active shed, never session.
          content: { application/json: { schema: { $ref: "#/components/schemas/FeedTransportTaskPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /feed-transport/tasks/{task_id}/submit:
    post:
      tags: [Feed Direction]
      operationId: submitFeedTransportTask
      summary: Submit a fresh live-camera Feed Transport video for verification.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FeedTransportSubmitRequest" } } }
      responses:
        "200":
          description: A new immutable attempt was submitted and the task is verification_due.
          content: { application/json: { schema: { $ref: "#/components/schemas/FeedTransportSubmitResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "422": { description: Camera video proof is missing, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /feed-config/ration-rates:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigRationRates
      summary: List the currently-in-force ration grid for a park.
      description: >-
        Returns one bounded page of the authored ration grid: (ration_group, shed_tag, feed_item) ->
        grams per head per day, for the park's rows that are currently in force (valid_to is null).
        Rates are PARK-SCOPED because parks genuinely differ, so park_id is required rather than
        optional -- a tenant-wide listing would interleave two parks' rows under identical labels.
        grams_per_head is returned as an exact decimal STRING, never a JSON number, so an authored
        rate cannot be altered by float round-tripping. A rate of 0 is a real authored value
        ("milk-fed kids get 0 g of solids"); the ABSENCE of a row means "not configured" and is a
        blocking gap the feed path must surface rather than read as 0.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: ration_group
          in: query
          required: false
          schema:
            type: string
        - name: shed_tag
          in: query
          required: false
          schema:
            type: string
        - name: feed_item
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of currently-in-force ration rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigRationRatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Feed Config
      operationId: upsertFeedConfigRationRate
      summary: Author one cell of the ration grid, effective-dated and non-destructive.
      description: >-
        Authors grams_per_head for one (park, ration_group, shed_tag, feed_item) key. The write is
        NEVER destructive: if a row is already in force from an earlier business day it is CLOSED
        (valid_to set) and a new row is opened, so the previous rate survives as history. A re-edit
        on the SAME business day corrects the open row in place, because a window closed on the day
        it opened cannot satisfy valid_to > valid_from. Re-authoring the identical value writes
        nothing and reports outcome "unchanged". The response names which of the four happened.
        grams_per_head is REQUIRED and is validated, not defaulted: absent fails the request (absence
        of a rate means "not configured", a blocking state -- it must never be filled in as 0), an
        explicit 0 is accepted as a real authored value, and a negative or over-precise value is
        rejected with a field error rather than clamped or rounded. Requires an Idempotency-Key: an
        exact replay returns the original result with idempotent_replay=true and re-runs no side
        effect, and reusing the key with a different payload is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeedConfigRationRateRequest"
      responses:
        "200":
          description: The authored edit's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/ration-groups:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigRationGroups
      summary: List the breed to ration-group mapping.
      description: >-
        Returns the authored map from a live breed label to its ration group. ADULT breeds only:
        kids resolve to the fixed "Kid" group by age band and never consult this map. The mapping is
        data rather than an identity function because it carries a real merge -- two live breeds can
        share one ration group.
      parameters:
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of breed to ration-group mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigRationGroupPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/shed-tags:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigShedTags
      summary: List the authored shed-tag vocabulary the ration grid is indexed by.
      description: >-
        Returns the tag vocabulary matched against a live animal's management stage. applies_to
        splits the kid course from the adult course; the two sets are disjoint, which is why the
        field is single-valued. A present but unrecognised applies_to filter is REJECTED rather than
        ignored -- silently dropping it would return the full vocabulary to a caller who asked for
        one course.
      parameters:
        - name: applies_to
          in: query
          required: false
          schema:
            type: string
            enum: [adult, kid]
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of shed tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigShedTagPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/feed-items:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigFeedItems
      summary: List the feed-item catalog.
      description: >-
        Returns the feed items and their nutritional/handling attributes. Those attributes are
        NULLABLE on purpose and are omitted when unset: unlike a ration rate, a missing energy value
        blocks only a rollup, never a feeding decision, so an honest gap is preferable to an invented
        number.
      parameters:
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of feed items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigFeedItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/session-templates:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigSessionTemplates
      summary: List a park's feeding-session split.
      description: >-
        Returns the park's feeding sessions and the fraction of the day's computed quantity each one
        carries. The fractions across a park's active sessions are expected to sum to 1.0 -- a
        cross-row invariant no column constraint can express, so it is enforced by whoever writes
        them.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of session templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigSessionTemplatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/schedule:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigSchedule
      summary: Read a park's currently-in-force feed dispatch clock.
      description: >-
        Returns the park's in-force dispatch clock per workflow. The times are LOCAL India business
        calendar (Asia/Kolkata) wall-clock values and carry NO UTC offset: they are recurring
        business-calendar rules, not instants, and a consumer combines them with a business date in
        Asia/Kolkata to schedule. transport_time is omitted when the park has not declared a cutoff;
        that absence means UNKNOWN and must never be read as "no deadline".
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workflow
          in: query
          required: false
          schema:
            type: string
            enum: [normal, experiment]
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of in-force dispatch clocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigSchedulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Feed Config
      operationId: upsertFeedConfigSchedule
      summary: Author a park's feed dispatch clock for one workflow, effective-dated.
      description: >-
        Authors the direction, correction, and transport times for one (park, workflow). The clock is
        per-workflow because the normal and experiment workflows genuinely run on different cutoffs;
        a single global time would issue one of them at the wrong hour every day. correction_time is
        when approved emergency-shifting corrections are BATCHED and the amended direction is
        reissued -- a fixed time rather than fire-on-approval, so a shed receives at most one amended
        direction per day instead of several racing ones. Times are LOCAL Asia/Kolkata wall-clock
        values ("07:00" or "07:00:00") with no offset; a value carrying an offset is rejected.
        Ordering is enforced (correction may equal but not precede direction; transport may not
        precede correction). transport_time may be sent as null to record "no declared cutoff", but a
        present-but-malformed value is REJECTED rather than dropped to null. Effective-dated and
        idempotent on the same terms as the ration-rate write.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeedConfigScheduleRequest"
      responses:
        "200":
          description: The authored edit's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/shed-factors:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigShedFactors
      summary: List a park's authored per-shed feed multipliers.
      description: >-
        Returns the currently-in-force per-shed, per-feed-item multipliers -- the shed_factor term of
        head_count x grams_per_head x shed_factor. Only AUTHORED factors are returned: a shed with no
        row is treated as 1.0 by the read path, and materializing that default here would make an
        unauthored shed indistinguishable from one someone deliberately set to 1.0.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: feed_item
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of authored shed factors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigShedFactorPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Feed Config
      operationId: upsertFeedConfigShedFactor
      summary: Author one per-shed feed multiplier, effective-dated.
      description: >-
        Authors the multiplier for one (park, shed, feed_item). multiplier is REQUIRED and validated
        rather than defaulted: absent fails the request, an explicit 0 is accepted as a deliberate
        authored value, and a negative value is rejected with a field error. Effective-dated and
        idempotent on the same terms as the ration-rate write.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeedConfigShedFactorRequest"
      responses:
        "200":
          description: The authored edit's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/experiment:
    get:
      tags:
        - Feed Config
      operationId: listFeedConfigExperiment
      summary: List a park's hand-authored experiment sheds.
      description: >-
        Returns the authored ABSOLUTE kg per feed item for each experiment shed in the park.
        absolute_kg is a SHED TOTAL, never a per-head rate, and head_count travels with it as
        informational context only -- multiplying the two would overfeed the shed by a factor of its
        entire population. Membership in this table with status='active' IS what makes a shed an
        experiment shed; a shed with no active row is fed from the per-head ration grid instead.
        Both statuses are returned by default so a withdrawn shed's authored quantities stay visible
        and can be restored without re-keying them.
      parameters:
        - name: park_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Narrow to one status. Absent returns BOTH active and retired rows.
          schema:
            type: string
            enum: [active, retired]
        - $ref: "#/components/parameters/FeedConfigLimit"
        - $ref: "#/components/parameters/FeedConfigOffset"
      responses:
        "200":
          description: One bounded page of authored experiment cells.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigExperimentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Feed Config
      operationId: upsertFeedConfigExperiment
      summary: Author one experiment shed's absolute kg of one feed item.
      description: >-
        Authors the absolute kg for one (park, shed, feed_item). absolute_kg is REQUIRED and
        validated rather than defaulted: absent fails the request, an explicit 0 is accepted (an arm
        that deliberately gets none of an item), and a negative or over-precise value is rejected
        with a field error. Authoring a shed's FIRST cell is what enrols it onto the experiment
        workflow, and any write forces the row back to status='active' -- a quantity stored on a
        retired row is a number nothing reads. Unlike the ration-rate write this is NOT
        effective-dated: an existing row is corrected in place, so the outcome is never "superseded".
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFeedConfigExperimentRequest"
      responses:
        "200":
          description: The authored edit's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /feed-config/experiment/shed-status:
    post:
      tags:
        - Feed Config
      operationId: setFeedConfigExperimentShedStatus
      summary: Switch a whole shed between the experiment workflow and the normal ration grid.
      description: >-
        Flips the status of EVERY one of the shed's authored experiment rows in one statement. This
        changes WHAT THE ANIMALS ARE FED, not merely what is displayed: status='active' feeds the
        shed the absolute kg authored here, and status='retired' returns it to the normal per-head
        grid (projected head count x grams per head x shed factor). It is whole-shed because a
        planner owns a shed rather than a cell, so a half-enrolled shed has no representable feed.
        Withdrawal is a status flip rather than a delete, so the authored quantities survive and a
        shed can be restored without re-keying them. A shed with no authored rows at all is 404: there
        is no experiment configuration to switch, and a caller wanting to enrol one authors its first
        quantity through POST /feed-config/experiment instead.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFeedConfigExperimentShedStatusRequest"
      responses:
        "200":
          description: The switch's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundOrNotAllowed"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /calendar/vaccination/events:
    get:
      tags:
        - Calendar
      operationId: listCalendarVaccinationEvents

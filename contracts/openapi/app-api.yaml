    VaccinationCapacityStatus:
      type: string
      enum:
        - within_cap
        - over_cap
        - capacity_breach
      description: |
        Machine vocabulary for capacity/session-splitting state:
        - within_cap: fits in a single day (sessions <= 1)
        - over_cap: safely split across multiple days within the safe window
        - capacity_breach: cannot fit within the safe window; needs manager review

        NEVER show raw tokens in CEO UI. Frontend renders provided labels:
        within_cap -> "Within cap", over_cap -> "Split", capacity_breach -> "Needs review"
    VaccinationPlannedSession:
      type: object
      additionalProperties: false
      required:
        - date
        - vaccinations
        - dailyLimit
        - capacity
      properties:
        date:
          type: string
          description: Asia/Kolkata business date (YYYY-MM-DD)
        vaccinations:
          type: integer
          description: Vaccination cells (obligations) planned for this day
        dailyLimit:
          type: integer
          description: The configured daily vaccination capacity cap
        capacity:
          $ref: "#/components/schemas/VaccinationCapacityStatus"
    VaccinationCapacityConfig:
      type: object
      additionalProperties: false
      description: |
        Tenant daily vaccination capacity config published from the versioned vaccination rule DSL. The cap
        counts vaccination administrations (cells), not animals — one goat receiving FMD + HS is 2.
      required:
        - maxPerDay
        - capacityScope
        - maxBufferDays
        - overflowPolicy
        - rowVersion
      properties:
        maxPerDay:
          type: integer
          minimum: 1
          maximum: 100000
          description: Max vaccination administrations allowed per day.
        capacityScope:
          type: string
          enum:
            - tenant
            - center
            - shed
          description: Where the cap applies. Only 'tenant' is honored by the planner today.
        maxBufferDays:
          type: integer
          minimum: 0
          maximum: 60
          description: Extra safe-window days past the first due day before work is flagged Needs review.
        overflowPolicy:
          type: string
          enum:
            - split_within_safe_window_then_mark_needs_review
          description: What the planner does when due work exceeds the cap.
        rowVersion:
          type: integer
          description: Published capacity config row version.
    VaccinationShedStatus:
      type: string
      enum:
        - needs_review
        - overdue
        - split
        - due
        - scheduled
        - on_track
      description: |
        Merged CEO headline folding capacity and vaccination state by priority (highest first):
        needs_review > overdue > split > due > scheduled > on_track

        This is the INTERNAL machine vocabulary. The CEO UI renders the backend-provided label
        (never the raw token, never the word "state").

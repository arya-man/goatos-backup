    VaccinationCapacityStatus:
      type: string
      enum:
        - within_cap
        - over_cap
        - capacity_breach
      description: |
        Machine vocabulary for capacity/session-splitting state:
        - within_cap: fits in a single day (sessions <= 1)
        - over_cap: safely split across multiple days within the safe window
        - capacity_breach: cannot fit within the safe window at authored cap; add operators or finish over cap

        NEVER show raw tokens in CEO UI. Frontend renders provided labels:
        within_cap -> "Within cap", over_cap -> "Split", capacity_breach -> "Capacity action"
    VaccinationPlannedSession:
      type: object
      additionalProperties: false
      required:
        - date
        - vaccinations
        - dailyLimit
        - capacity
      properties:
        date:
          type: string
          description: Asia/Kolkata business date (YYYY-MM-DD)
        vaccinations:
          type: integer
          description: Animal slots planned for this day
        dailyLimit:
          type: integer
          description: The configured daily animals/operator cap
        capacity:
          $ref: "#/components/schemas/VaccinationCapacityStatus"
    VaccinationCapacityConfig:
      type: object
      additionalProperties: false
      description: |
        Tenant vaccination drive capacity config published from the versioned vaccination rule DSL. The cap
        counts unique animals per available operator per business date, not vaccine doses or obligation
        cells. One animal receiving a same-day vaccine bundle still consumes one operator slot.
      required:
        - maxPerDay
        - capacityScope
        - maxBufferDays
        - overflowPolicy
        - rowVersion
      properties:
        maxPerDay:
          type: integer
          minimum: 1
          maximum: 100000
          description: Max unique animals one available operator can handle per business date.
        capacityScope:
          type: string
          enum:
            - tenant
            - center
            - shed
          description: Where the cap applies. Only 'tenant' is honored by the planner today.
        maxBufferDays:
          type: integer
          minimum: 0
          maximum: 60
          description: Extra safe-window days past the first due day before added operators or over-cap completion is required.
        overflowPolicy:
          type: string
          enum:
            - split_within_safe_window_last_safe_may_exceed_cap
          description: What the planner does when due work exceeds the cap.
        rowVersion:
          type: integer
          description: Published capacity config row version.
        maxShotsPerAnimalPerDrive:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Admin-editable override of the same-day per-animal shot cap enforced by the obligation
            sweeper. null means "no override" -- the planner falls back to the published rule_dsl
            drive_policy value / code default.
    VaccinationOperatorShift:
      type: object
      additionalProperties: false
      description: |
        Phase 1 CONFIG-ONLY: one operator's authored shift window + week-off for a park. Start/end are
        minutes-of-day (0-1439) so a non-hour-aligned start (e.g. 08:30) is exact.
      required:
        - operatorId
        - displayName
        - shiftLabel
        - shiftStartMinute
        - shiftEndMinute
      properties:
        operatorId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Backend-owned operator display name (workforce_members.display_name).
        shiftLabel:
          type: string
          enum:
            - am
            - pm
            - rover
        shiftStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
        shiftEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
        weekOffWeekday:
          type: string
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          description: Lowercase weekday name; absent when the operator has no week-off.
    VaccinationParkScopeOption:
      type: object
      additionalProperties: false
      description: >-
        One selectable park in the backend-owned park-scope vocabulary. Ids and labels are canonical
        Postgres `locations` rows compiled by the backend; clients render them and send parkId back.
      required:
        - parkId
        - code
        - name
      properties:
        parkId:
          type: string
          format: uuid
        code:
          type: string
          description: Short park code (may be empty when the park has none).
        name:
          type: string
          description: Display name for the park option.
    VaccinationParkScopeAmbiguous:
      type: object
      additionalProperties: false
      description: >-
        409 body for a read whose park scope the caller must choose. availableParks is the exact set
        the caller is authorized for; an empty array means the caller has no active park scope at all
        (a grant problem), which is a different situation from having several.
      required:
        - code
        - message
        - trace_id
        - availableParks
      properties:
        code:
          type: string
          enum: [park_scope_ambiguous]
        message:
          type: string
          description: Backend-owned user-facing reason. Clients render this text; they do not compose their own.
        trace_id:
          type: string
        availableParks:
          type: array
          items:
            $ref: "#/components/schemas/VaccinationParkScopeOption"
    VaccinationOperatorAssignmentConfig:
      type: object
      additionalProperties: false
      description: |
        Phase 1 CONFIG-ONLY: a park's N-active-operators-per-day + CEO-set default operator, plus every
        operator's authored shift. Not yet consumed by the drive scheduler (Phase 5).
      required:
        - parkId
        - activeOperatorsPerDay
        - defaultOperatorId
        - rowVersion
        - shifts
      properties:
        parkId:
          type: string
          format: uuid
          description: >-
            The park this config belongs to, as RESOLVED by the backend (echoing an explicit park_id,
            or the caller's single authorized park scope). Clients scope their roster/capacity reads
            to this value instead of inferring a park from returned rows.
        activeOperatorsPerDay:
          type: integer
          minimum: 1
          maximum: 3
          description: N operators active per business day for this park. CPT runs N=1 today.
        defaultOperatorId:
          type: string
          format: uuid
          description: The CEO-set default operator. Required whenever a config row exists (validate-or-reject, never a silent default).
        selectedOperatorIds:
          type: array
          description: Explicit operators selected for parallel mode. When empty, the backend falls back to roster order.
          items:
            type: string
            format: uuid
          maxItems: 3
        rowVersion:
          type: integer
          format: int64
          description: Optimistic-concurrency token; required on PUT to avoid clobbering a concurrent admin edit.
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/VaccinationOperatorShift"
    UpdateVaccinationOperatorAssignmentConfigRequest:
      type: object
      additionalProperties: false
      required:
        - parkId
        - activeOperatorsPerDay
        - defaultOperatorId
        - rowVersion
      properties:
        parkId:
          type: string
          format: uuid
        activeOperatorsPerDay:
          type: integer
          minimum: 1
          maximum: 3
        defaultOperatorId:
          type: string
          format: uuid
        selectedOperatorIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 3
        rowVersion:
          type: integer
          format: int64
          description: The rowVersion last read by the admin; 0 when authoring a config for this park for the first time.
    UpdateVaccinationCapacityConfigRequest:
      type: object
      additionalProperties: false
      required:
        - maxPerDay
        - rowVersion
      properties:
        maxPerDay:
          type: integer
          minimum: 1
          maximum: 100000
        maxShotsPerAnimalPerDrive:
          type: integer
          minimum: 1
          nullable: true
          description: Omit or set null to clear the override and fall back to the published rule_dsl value / code default.
        rowVersion:
          type: integer
          description: The rowVersion last read by the admin.
    VaccinationShedStatus:
      type: string
      enum:
        - needs_review
        - overdue
        - split
        - due
        - scheduled
        - on_track
      description: |
        Merged CEO headline folding capacity and vaccination state by priority (highest first):
        needs_review > overdue > split > due > scheduled > on_track

        This is the INTERNAL machine vocabulary. The CEO UI renders the backend-provided label

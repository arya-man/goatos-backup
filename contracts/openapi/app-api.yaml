      properties:
        park_id:
          description: The park's location id. This is what the UI labels a 'farm'.
          type: string
          format: uuid
        name:
          description: Display name for the park option.
          type: string
        sheds:
          description: >-
            The park's active sheds, ordered by name. Always present; a park with no active sheds
            returns an empty array rather than null, and is still listed.
          type: array
          items:
            $ref: "#/components/schemas/ShiftingDestinationShed"
    ShiftingDestinationShed:
      type: object
      additionalProperties: false
      required:
        - shed_id
        - name
        - management_stages
      properties:
        shed_id:
          description: >-
            The shed's location id, and the value that must be sent as destination_shed_id. Names
            repeat across parks, so this id - never the name - identifies the destination.
          type: string
          format: uuid
        name:
          description: >-
            Display name for the shed option. NOT unique across parks; only meaningful within its
            parent park.
          type: string
        management_stages:
          description: Distinct stages currently represented by live animals in this shed.
          type: array
          items: { type: string }
    RecordShiftingEventRequest:
      type: object
      additionalProperties: false
      required:
        - destination_park_id
        - destination_shed_id
        - management_stage_mode
        - goat_ids
      properties:
        source_park_id:
          description: Park the cohort moved out of. Omit for an intake with no tracked origin.
          type: string
          format: uuid
        source_shed_id:
          description: Shed the cohort moved out of. Omit for an intake with no tracked origin.
          type: string
          format: uuid
        destination_park_id:
          description: >-
            The selected animal's current park. Shed shifts are intra-park only; clients derive and
            lock this value from the animal lookup rather than offering another farm picker.
          type: string
          format: uuid
        destination_shed_id:
          type: string
          format: uuid
        management_stage_mode:
          description: Mandatory raise-time decision for the post-shift management stage.
          type: string
          enum: [keep_current, select_stage, destination_stage]
        target_management_stage:
          description: Required for select_stage/destination_stage; omitted for keep_current.
          type: string
        effective_at:
          description: >-
            When the movement actually took effect. Defaults to the time the event is recorded.
            Normalized to UTC before the request is fingerprinted, so two representations of the same
            instant are the same request.
          type: string
          format: date-time
        priority:
          description: >-
            Governing-doc taxonomy (High/Low). Omit to accept the declared default ('low'). A present
            but unrecognized value is rejected, never rewritten to a default the operator never chose.
          type: string
          enum:
            - high
            - low
        category:
          description: >-
            Governing-doc taxonomy (Growth/Health/Breeding/Delivery). Omit to accept the declared
            default ('growth'). A present but unrecognized value is rejected.
          type: string
          enum:
            - growth
            - health
            - breeding
            - delivery
        proof_ref:
          description: Optional reference to captured proof media for this movement.
          type: string
          minLength: 1
          maxLength: 200
        impacts:
          description: >-
            The structured cohort effect of the movement, at breed grain. OPTIONAL when goat_ids
            names EXACTLY ONE animal: the server then derives a single impact from that animal's own
            canonical facts (breed key/label, stage tag, age class, sex, head_count 1), so an
            operator moving one animal via RFID search does not have to describe a cohort the system
            already knows. REQUIRED for two or more animals, because the server will not invent the
            cohort split or the pregnancy/lactation/warm-up distribution across cohorts - omitting it
            there is rejected with 400 missing_impacts. When supplied, it is stored verbatim and no
            derivation runs. A derived impact never leaves pregnant/lactating/warmup non-zero; record
            those by supplying impacts explicitly.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecordShiftingEventImpact"
        goat_ids:
          description: >-
            The individual animals this movement covers. REQUIRED, and load-bearing: approving the
            request relocates EXACTLY these animals to the destination shed and re-scopes their
            shed-scoped vaccination obligations. impacts remain an AGGREGATE model - they record
            head counts by breed grain, never which specific animals - so this list is the only
            per-animal linkage the movement has. It is required because an authorized movement that
            names nobody relocates nobody, leaving the herd register and the shed-scoped
            obligations disagreeing with the count just reported. The server will still never infer
            which animals a head count referred to, because guessing would relocate real animals
            that nobody selected - so the list is demanded at submit, while the reporting operator
            can still supply it. Duplicates are removed.
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    RecordShiftingEventImpact:
      type: object
      additionalProperties: false
      required:
        - breed_key
        - head_count
      properties:
        breed_id:
          type: string
          format: uuid
        breed_key:
          type: string
          minLength: 1
          maxLength: 120
        breed_label:
          description: Human-readable breed label. Defaults to breed_key when omitted.
          type: string
          minLength: 1
          maxLength: 200
        stage_tag:
          type: string
          minLength: 1
          maxLength: 120
        age_class:
          type: string
          minLength: 1
          maxLength: 120
        sex:
          type: string
          minLength: 1
          maxLength: 20
        head_count:
          description: Total animals moved in this cohort. Must be greater than zero.
          type: integer
          minimum: 1
        pregnant_count:
          description: Must not exceed head_count.
          type: integer
          minimum: 0
        lactating_count:
          description: Must not exceed head_count.
          type: integer
          minimum: 0
        warmup_count:
          description: Must not exceed head_count.
          type: integer
          minimum: 0
    RecordShiftingEventResponse:
      type: object
      additionalProperties: false
      required:
        - shifting_event_id
        - approval_request_id
        - status
        - idempotent_replay
      properties:
        shifting_event_id:
          type: string
          format: uuid
        approval_request_id:
          description: >-
            The approval request a park_head decides. The movement is not applied, and no animal

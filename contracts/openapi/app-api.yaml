    post:
      tags:
        - Vaccination
      operationId: appRescheduleObligation
      summary: Reschedule an open vaccination obligation to a new due date.
      description: >-
        Reschedules an open (scheduled/due) vaccination obligation to a new due date,
        targeted by obligation_id. Idempotent via the Idempotency-Key header: an exact
        replay returns the original result without re-running the write; a same-key/different-payload
        replay is rejected with 409. A health-held ('deferred') obligation cannot be reached
        through this endpoint. A 'missed' target is immutable closed history — this endpoint
        creates a brand-new obligation for the new due date and returns the new obligation_id
        rather than mutating the missed row.
      parameters:
        - $ref: "#/components/parameters/ObligationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleObligationRequest"

openapi: 3.1.0
info:
  title: Goat OS Analytics API
  version: 0.1.0
  summary: Phase 1 governed identity count facade.
  description: REST/JSON analytics facade for dashboards. Count responses read named projections or governed analytics APIs, never raw full-herd scans.
servers:
  - url: https://analytics-api.goatos.example.invalid
    description: Synthetic contract server placeholder.
security:
  - bearerAuth: []
tags:
  - name: Identity Counts
  - name: Counts Dashboard
  - name: Mortality Dashboard
paths:
  /analytics/identity/counts:
    get:
      tags:
        - Identity Counts
      operationId: getIdentityCounts
      summary: Get scoped identity counts for a named materialized grain.
      parameters:
        - name: grain
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CounterGrain"
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: true
          description: Required page size. Values outside 1-500 are rejected, not clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior response. Structurally invalid cursors return 400.
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: custodian_party_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: farm_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: park_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: shed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cohort_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lifecycle_status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: reproductive_status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: growth_cohort_tag
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: management_stage
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: health_status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: identity_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IdentityState"
        - name: breed_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sex
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 40
      responses:
        "200":
          description: Governed identity count rows and freshness state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityCountsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /analytics/counts/dashboard:
    get:
      tags:
        - Counts Dashboard
      operationId: getCountsDashboardSnapshot
      summary: Get the legacy Counts dashboard from governed projection rows.
      description: >-
        Returns projection-backed sections for the old Counts module. Responses
        include source composition and freshness so the admin UI can distinguish
        live, stale, never-synced, and unavailable source states without reading
        raw source tables.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CountsView"
        - name: snapshot_date
          in: query
          required: false
          schema:
            type: string
            description: latest or YYYY-MM-DD.
      responses:
        "200":
          description: Counts dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsDashboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /analytics/mortality/dashboard:
    get:
      tags:
        - Mortality Dashboard
      operationId: getMortalityDashboardSnapshot
      summary: Get the legacy Mortality dashboard from governed projection rows.
      description: >-
        Returns projection-backed mortality sections with numerator and
        denominator provenance. Responses must not mix canonical and legacy
        composition silently.
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MortalityPeriod"
      responses:
        "200":
          description: Mortality dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MortalityDashboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - field_errors
        - trace_id
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 500
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        trace_id:
          type: string
          minLength: 1
          maxLength: 200
        retryable:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 500
    IdentityState:
      type: string
      enum:
        - clean
        - needs_review
        - disputed
        - merged
        - inactive
    CounterGrain:
      type: string
      enum:
        - tenant_lifecycle
        - custodian_lifecycle
        - custodian_identity
        - park_lifecycle
        - shed_lifecycle
        - breed_sex_lifecycle
        - health_status
        - growth_cohort
        - management_stage
        - reproductive_status
    CountDimensions:
      type: object
      additionalProperties: false
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
        custodian_party_id:
          type:
            - string
            - "null"
          format: uuid
        farm_id:
          type:
            - string
            - "null"
          format: uuid
        farm_name:
          type:
            - string
            - "null"
          maxLength: 200
        park_id:
          type:
            - string
            - "null"
          format: uuid
        park_name:
          type:
            - string
            - "null"
          maxLength: 200
        shed_id:
          type:
            - string
            - "null"
          format: uuid
        shed_name:
          type:
            - string
            - "null"
          maxLength: 200
        cohort_id:
          type:
            - string
            - "null"
          format: uuid
        cohort_name:
          type:
            - string
            - "null"
          maxLength: 200
        lifecycle_status:
          type:
            - string
            - "null"
          maxLength: 80
        reproductive_status:
          type:
            - string
            - "null"
          maxLength: 80
        growth_cohort_tag:
          type:
            - string
            - "null"
          maxLength: 80
        management_stage:
          type:
            - string
            - "null"
          maxLength: 80
        health_status:
          type:
            - string
            - "null"
          maxLength: 80
        identity_state:
          oneOf:
            - $ref: "#/components/schemas/IdentityState"
            - type: "null"
        breed_id:
          type:
            - string
            - "null"
          format: uuid
        breed_name:
          type:
            - string
            - "null"
          maxLength: 200
        sex:
          type:
            - string
            - "null"
          maxLength: 40
    IdentityCount:
      type: object
      additionalProperties: false
      required:
        - counter_grain
        - dimensions
        - count_value
        - as_of_recorded_at
        - source_import_run_id
        - is_rebuilding
        - updated_at
      properties:
        counter_grain:
          $ref: "#/components/schemas/CounterGrain"
        dimensions:
          $ref: "#/components/schemas/CountDimensions"
        count_value:
          type: integer
          minimum: 0
        as_of_recorded_at:
          type:
            - string
            - "null"
          format: date-time
        source_import_run_id:
          type:
            - string
            - "null"
          format: uuid
        is_rebuilding:
          type: boolean
        updated_at:
          type: string
          format: date-time
    Freshness:
      type: object
      additionalProperties: false
      required:
        - as_of_recorded_at
        - is_rebuilding
        - source_import_run_id
        - warning
      properties:
        as_of_recorded_at:
          type:
            - string
            - "null"
          format: date-time
        is_rebuilding:
          type: boolean
        source_import_run_id:
          type:
            - string
            - "null"
          format: uuid
        warning:
          type:
            - string
            - "null"
          maxLength: 500
    IdentityCountsResponse:
      type: object
      additionalProperties: false
      required:
        - grain
        - items
        - next_cursor
        - has_more
        - freshness
        - trace_id
      properties:
        grain:
          $ref: "#/components/schemas/CounterGrain"
        items:
          type: array
          items:
            $ref: "#/components/schemas/IdentityCount"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 500
        has_more:
          type: boolean
        freshness:
          $ref: "#/components/schemas/Freshness"
        trace_id:
          type: string
          minLength: 1
          maxLength: 200
    CountsView:
      type: string
      enum:
        - overall
        - core-farms
        - cbe
        - cpt
        - holdings
      default: overall
    MortalityPeriod:
      type: string
      enum:
        - overall
        - this-month
        - month-wise
      default: overall
    DashboardFreshness:
      type: object
      additionalProperties: false
      required:
        - as_of
        - freshness_status
        - serving_state
        - stale
        - rebuild_required
        - source_watermark
        - unavailable_sources
        - source_composition
        - conflict_count
        - projection_version
      properties:
        as_of:
          type:
            - string
            - "null"
          format: date-time
        freshness_status:
          type: string
          minLength: 1
          maxLength: 80
        serving_state:
          type: string
          minLength: 1
          maxLength: 80
        stale:
          type: boolean
        rebuild_required:
          type: boolean
        source_watermark:
          type:
            - string
            - "null"
          format: date-time
        unavailable_sources:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        source_composition:
          type: string
          minLength: 1
          maxLength: 80
        conflict_count:
          type: integer
          minimum: 0
        projection_version:
          type: integer
          minimum: 0
    CountsProjectionRow:
      type: object
      additionalProperties: false
      required:
        - section
        - grain
        - dimension_key
        - dimension_label
        - secondary_dimension_key
        - secondary_dimension_label
        - metric_key
        - count_value
        - numeric_value
        - unit
        - denominator
        - source_composition
      properties:
        section:
          type: string
          minLength: 1
          maxLength: 120
        grain:
          type: string
          minLength: 1
          maxLength: 120
        dimension_key:
          type: string
          minLength: 1
          maxLength: 200
        dimension_label:
          type: string
          minLength: 1
          maxLength: 300
        secondary_dimension_key:
          type:
            - string
            - "null"
          maxLength: 200
        secondary_dimension_label:
          type:
            - string
            - "null"
          maxLength: 300
        metric_key:
          type: string
          minLength: 1
          maxLength: 120
        count_value:
          type:
            - integer
            - "null"
          minimum: 0
        numeric_value:
          type:
            - number
            - "null"
        unit:
          type: string
          minLength: 1
          maxLength: 40
        denominator:
          type:
            - number
            - "null"
        source_composition:
          type: string
          minLength: 1
          maxLength: 80
    CountsDashboardResponse:
      type: object
      additionalProperties: false
      required:
        - view
        - snapshot_date
        - summary_source_date
        - freshness
        - summary
        - sections
        - trace_id
      properties:
        view:
          $ref: "#/components/schemas/CountsView"
        snapshot_date:
          type:
            - string
            - "null"
          format: date
        summary_source_date:
          type:
            - string
            - "null"
          format: date
        freshness:
          $ref: "#/components/schemas/DashboardFreshness"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/CountsProjectionRow"
        sections:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/CountsProjectionRow"
        trace_id:
          type: string
          minLength: 1
          maxLength: 200
    MortalityProjectionRow:
      type: object
      additionalProperties: false
      required:
        - section
        - grain
        - dimension_key
        - dimension_label
        - metric_key
        - numerator
        - denominator
        - denominator_source_module
        - denominator_projection_version
        - denominator_source_watermark
        - numerator_source_composition
        - denominator_source_composition
        - mixed_composition_exception_id
        - value
        - unit
        - source_composition
      properties:
        section:
          type: string
          minLength: 1
          maxLength: 120
        grain:
          type: string
          minLength: 1
          maxLength: 120
        dimension_key:
          type: string
          minLength: 1
          maxLength: 200
        dimension_label:
          type: string
          minLength: 1
          maxLength: 300
        metric_key:
          type: string
          minLength: 1
          maxLength: 120
        numerator:
          type:
            - number
            - "null"
        denominator:
          type:
            - number
            - "null"
        denominator_source_module:
          type:
            - string
            - "null"
          maxLength: 120
        denominator_projection_version:
          type:
            - integer
            - "null"
          minimum: 0
        denominator_source_watermark:
          type:
            - string
            - "null"
          format: date-time
        numerator_source_composition:
          type:
            - string
            - "null"
          maxLength: 80
        denominator_source_composition:
          type:
            - string
            - "null"
          maxLength: 80
        mixed_composition_exception_id:
          type:
            - string
            - "null"
          format: uuid
        value:
          type: number
        unit:
          type: string
          minLength: 1
          maxLength: 40
        source_composition:
          type: string
          minLength: 1
          maxLength: 80
    MortalityDashboardResponse:
      type: object
      additionalProperties: false
      required:
        - period
        - freshness
        - summary
        - sections
        - trace_id
      properties:
        period:
          $ref: "#/components/schemas/MortalityPeriod"
        freshness:
          $ref: "#/components/schemas/DashboardFreshness"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/MortalityProjectionRow"
        sections:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/MortalityProjectionRow"
        trace_id:
          type: string
          minLength: 1
          maxLength: 200

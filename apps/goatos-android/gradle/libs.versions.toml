# Version catalog — single source of dependency versions (TRD §2).
# Baseline pinned from docs/mobile/trd-operator-mobile.md; each verified to resolve
# at scaffold. Bump only with a README note + reason.
[versions]
agp = "9.2.0"
# Kotlin pinned to 2.3.x: KSP (Hilt/Room annotation processing) has no build for
# Kotlin 2.4.0 yet (latest KSP is 2.3.9). "Verify at scaffold" wins over the doc's
# 2.4.0 baseline — bump when KSP ships for the next Kotlin.
kotlin = "2.3.21"
ksp = "2.3.9"
hilt = "2.60.1"
hiltNavigationCompose = "1.3.0"
composeBom = "2026.06.01"
# androidx runtime libs pinned to the compileSdk-36-compatible line (TRD locks
# compileSdk=36; the doc's 2.11.0/1.13.0 baselines require SDK 37 which is not the
# locked target). Bump together when compileSdk moves.
activityCompose = "1.10.1"
lifecycle = "2.9.3"
coreKtx = "1.16.0"
coroutines = "1.11.0"
immutable = "0.5.1"
navigation = "2.8.9"
kotlinxSerialization = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.1.0"
datastore = "1.1.7"
room = "2.8.4"
workRuntime = "2.9.1"
# androidx.hilt (hilt-work + its KSP hilt-compiler). 1.2.0 is the latest published; there is
# no 1.2.1 (the prior catalog value was never resolved because nothing consumed the alias).
hiltWork = "1.2.0"
# LeakCanary: automatic runtime memory-leak detector, debug builds only (item: leak detection).
leakcanary = "2.14"
# Verified at scaffold (item 7): 2.0.0-alpha05 is the first Paparazzi release that resolves
# and renders correctly against AGP 9.2 / Kotlin 2.3.21 / Compose BOM 2026.06 — alpha04 and
# earlier are documented as broken on AGP 9. Confirmed with a real render (see
# feature-record's RecordScreenPaparazziTest), not just a successful plugin apply.
paparazzi = "2.0.0-alpha05"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
# KSP processor for @HiltWorker (androidx.hilt), distinct from Dagger's hilt-android-compiler.
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
# AGP 9+ has built-in Kotlin: Android modules apply NO kotlin.android plugin.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }

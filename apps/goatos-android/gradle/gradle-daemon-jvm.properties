# Gradle daemon JVM criteria (Gradle 8.8+). The daemon must run on Java 21,
# matching tools/dev/android-env.sh and tools/ci/java21.sh. No toolchain
# download URLs are listed, so Gradle never downloads a JDK: it uses a locally
# detected JDK 21 (JAVA_HOME, /usr/libexec/java_home, known install paths) or
# fails with a clear error. Android Studio honours this for its Gradle JDK.
toolchainVersion=21

# Robolectric 4.14.1 supports up to API 35; this module targets 36. Pin the unit-test SDK so
# Robolectric can read the real merged manifest (testOptions.unitTests.isIncludeAndroidResources).
sdk=34
# Keep the pre-merged-manifest behaviour: unit tests run against a plain Application, never the
# real Hilt GoatOsApplication (which initializes Firebase and has no place in a JVM unit test).
application=android.app.Application

# Heap cap per Gradle daemon. Each idle daemon keeps this much reserved.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Idle daemons exit after 10 minutes (Gradle default is 3 hours). Measured
# 2026-09-25: 4 idle daemons held ~6.4 GB on a 32 GB Mac 20 GB into swap.
org.gradle.daemon.idletimeout=600000
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

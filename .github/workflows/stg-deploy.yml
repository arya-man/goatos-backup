name: stg-deploy

on:
  push:
    branches: [stg]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: stg-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: goatos-stg
  PROJECT_NUMBER: "514832198871"
  REGION: asia-south1
  ARTIFACT_REPOSITORY: goatos
  DELIVERY_PIPELINE: goatos-stg
  TARGET_ID: goatos-stg

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip stg deploy]')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Require merged main to stg promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOATOS_PROMOTION_REPOSITORY: ${{ github.repository }}
          GOATOS_PROMOTION_SHA: ${{ github.sha }}
          GOATOS_PROMOTION_REF: ${{ github.ref_name }}
        run: node tools/ci/check-stg-promotion.mjs --github
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOATOS_STG_WIF_PROVIDER }}
          service_account: ${{ vars.GOATOS_STG_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v3
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Compute image tags
        run: |
          image_tag="${GITHUB_SHA::12}"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          {
            echo "IMAGE_TAG=${image_tag}"
            echo "BACKEND_IMAGE=${registry}/backend:${image_tag}"
            echo "MIGRATION_IMAGE=${registry}/migrate:${image_tag}"
            echo "ADMIN_WEB_IMAGE=${registry}/admin-web:${image_tag}"
          } >> "$GITHUB_ENV"
      - name: Build and push backend image
        run: docker buildx build --platform linux/amd64 --push -f backend/Dockerfile -t "$BACKEND_IMAGE" .
      - name: Build and push migration image
        run: docker buildx build --platform linux/amd64 --push -f backend/Dockerfile.migrate -t "$MIGRATION_IMAGE" .
      - name: Build and push admin-web image
        run: docker buildx build --platform linux/amd64 --push -f apps/admin-web/Dockerfile -t "$ADMIN_WEB_IMAGE" .
      - name: Create Cloud Deploy release
        run: |
          release_id="goatos-stg-${IMAGE_TAG}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gcloud deploy releases create "$release_id" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --delivery-pipeline="$DELIVERY_PIPELINE" \
            --source=. \
            --skaffold-file=deploy/clouddeploy/stg/skaffold.yaml \
            --to-target="$TARGET_ID" \
            --labels="commit_sha=${IMAGE_TAG},deployed_by=cloud-deploy" \
            --deploy-parameters="customTarget/commitSha=${IMAGE_TAG},customTarget/backendImage=${BACKEND_IMAGE},customTarget/migrationImage=${MIGRATION_IMAGE},customTarget/adminWebImage=${ADMIN_WEB_IMAGE}"

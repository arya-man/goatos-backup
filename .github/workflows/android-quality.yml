name: android-quality

on:
  pull_request:
    paths:
      - "apps/goatos-android/**"
      - "tools/android/**"
      - ".github/workflows/android-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/goatos-android/**"
      - "tools/android/**"
      - ".github/workflows/android-quality.yml"

jobs:
  design-system-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: No hardcoded hex / TextStyle in UI
        run: bash tools/android/check-no-hardcoded-design.sh

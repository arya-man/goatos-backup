name: pages

# Publishes CI-generated reports to GitHub Pages, combined under one site:
#   /screenshot-gallery/  Paparazzi golden images for every mobile screen (:app ScreenshotTest)
#                         plus every role's nav chrome + landing (:app RoleChromeScreenshotTest)
#   /nav-graph/           Compose Navigation routes + navigate() edges (Mermaid)
#   /e2e-report/          Backend vaccination kernel-story E2E report (story count grows over time —
#                         read from the generated report itself, never hardcoded here; see e2e-report
#                         job's "Compute story count from the generated report" step)
#   /e2e-hrms-report/     HRMS roster/RBAC kernel-story E2E report
#   /scale-audit-e2e-report/  Scale-audit fix E2E report and certification boundary
# Runs on every push to main that touches the relevant paths, AND on a daily cron so the
# screenshot gallery and E2E report stay fresh even without a code change (data/timing drift,
# flaky-test detection). See docs/runbooks/github-workflows.md.
#
# Requires one-time repo setup: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (not "Deploy from a branch"). Until that is set, the deploy job will fail
# with a "Pages site not found" / environment error even though the report-building jobs above
# it succeed — the artifacts are still downloadable from the failed run's Summary either way.

on:
  push:
    branches: [main]
    paths:
      - "apps/goatos-android/**"
      - "backend/tests/e2e/**"
      - "backend/internal/**"
      - "context/execution/scale-audit-fix-e2e-report-2026-07-11.md"
      - "docs/runbooks/performance-gates.md"
      - "tools/perf/**"
      - "tools/scale-guard/**"
      - "tools/android/generate-nav-graph.py"
      - "tools/android/build-screenshot-gallery.py"
      - "AGENTS.md"
      - ".github/workflows/pages.yml"
  schedule:
    # 03:00 UTC daily — screenshot gallery + E2E report (the two jobs the task calls out for a
    # daily run; nav-graph is cheap to regenerate every run too so it stays in the same publish).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mobile-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses + install platform for compileSdk 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Render every screen's + role's Paparazzi golden (fresh, not just verify)
        working-directory: apps/goatos-android
        run: ./gradlew :app:recordPaparazziDevDebug --no-configuration-cache --stacktrace
      - name: Build the screenshot gallery HTML
        run: python3 tools/android/build-screenshot-gallery.py
      - name: Job summary
        run: |
          {
            echo "### Mobile screenshot gallery"
            echo "12 screens + 6 role-chrome variants (CEO, CEO w/ drawer, Director, Park Head, Park Manager, Operator) rendered — see the Pages artifact \`screenshot-gallery\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-gallery
          path: apps/goatos-android/docs/screenshot-gallery/index.html
          retention-days: 14

  nav-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Compose nav-graph diagram
        run: python3 tools/android/generate-nav-graph.py
      - name: Job summary
        run: |
          {
            echo "### Mobile nav-graph"
            echo "Regenerated from AppNavHost.kt's hand-verified routes/edges."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nav-graph
          path: apps/goatos-android/docs/nav-graph/index.html
          retention-days: 14

  e2e-report:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    outputs:
      total: ${{ steps.story_count.outputs.total }}
      passed: ${{ steps.story_count.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the vaccination kernel-story E2E harness
        working-directory: backend
        run: go test ./tests/e2e/... -run TestKernelStor -v
      - name: Compute story count from the generated report
        id: story_count
        # Never hardcode the story count here -- read it from the report's own summary tiles
        # (rendered by backend/tests/e2e/report.go) so this workflow can't drift stale as stories
        # are added or removed.
        run: |
          report="backend/tests/e2e/report/index.html"
          total=$(grep -oE '<div class="tile"><span class="n">[0-9]+</span>stories</div>' "$report" | grep -oE '[0-9]+')
          passed=$(grep -oE '<div class="tile pass"><span class="n">[0-9]+</span>stories passed</div>' "$report" | grep -oE '[0-9]+')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: Job summary
        run: |
          {
            echo "### Vaccination kernel-story E2E report"
            echo "${{ steps.story_count.outputs.passed }}/${{ steps.story_count.outputs.total }} stories — see the Pages artifact \`e2e-report\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: backend/tests/e2e/report/index.html
          retention-days: 14

  e2e-hrms-report:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    outputs:
      total: ${{ steps.story_count.outputs.total }}
      passed: ${{ steps.story_count.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the HRMS roster/RBAC kernel-story E2E harness
        working-directory: backend
        run: go test ./tests/e2e-hrms/... -run TestHRMS -v
      - name: Compute story count from the generated report
        id: story_count
        # Never hardcode the story count here -- read it from the report's own summary tiles
        # (rendered by backend/tests/e2e-hrms/report.go) so this workflow can't drift stale as
        # stories are added or removed.
        run: |
          report="backend/tests/e2e-hrms/report/index.html"
          total=$(grep -oE '<div class="tile"><span class="n">[0-9]+</span>stories</div>' "$report" | grep -oE '[0-9]+')
          passed=$(grep -oE '<div class="tile pass"><span class="n">[0-9]+</span>stories passed</div>' "$report" | grep -oE '[0-9]+')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: Job summary
        run: |
          {
            echo "### HRMS roster/RBAC kernel-story E2E report"
            echo "${{ steps.story_count.outputs.passed }}/${{ steps.story_count.outputs.total }} stories — see the Pages artifact \`e2e-hrms-report\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-hrms-report
          path: backend/tests/e2e-hrms/report/index.html
          retention-days: 14

  scale-audit-e2e-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render the scale-audit E2E report page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          src = Path("context/execution/scale-audit-fix-e2e-report-2026-07-11.md")
          text = src.read_text(encoding="utf-8")
          dest = Path("pages/scale-audit-e2e-report")
          dest.mkdir(parents=True, exist_ok=True)

          def inline(value: str) -> str:
            escaped = html.escape(value)
            escaped = re.sub(r"`([^`]+)`", r"<code>\1</code>", escaped)
            return escaped

          def render_markdown(markdown: str) -> str:
            out = []
            lines = markdown.splitlines()
            i = 0
            in_ul = False
            in_ol = False
            in_code = False
            open_section = False
            open_step = False
            code_lines = []

            def close_lists():
              nonlocal in_ul, in_ol
              if in_ul:
                out.append("</ul>")
                in_ul = False
              if in_ol:
                out.append("</ol>")
                in_ol = False

            def close_step():
              nonlocal open_step
              close_lists()
              if open_step:
                out.append("</div>")
                open_step = False

            def close_section():
              nonlocal open_section
              close_step()
              if open_section:
                out.append("</section>")
                open_section = False

            while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              if stripped.startswith("```"):
                if in_code:
                  out.append("<pre><code>" + html.escape("\n".join(code_lines)) + "</code></pre>")
                  code_lines = []
                  in_code = False
                else:
                  in_code = True
                i += 1
                continue
              if in_code:
                code_lines.append(line)
                i += 1
                continue
              if stripped and not stripped.startswith("- ") and not re.match(r"^\d+\.\s+", stripped):
                close_lists()
              if not stripped:
                i += 1
                continue
              if stripped.startswith("# "):
                # The shell page owns the title; skip the markdown title to avoid duplicate H1s.
                pass
              elif stripped.startswith("## "):
                close_section()
                section_title = stripped[3:]
                section_class = "story caution" if section_title == "Certification Boundary" else "story pass"
                badge = "PENDING" if section_title == "Certification Boundary" else "PASS"
                out.append(f"<section class=\"{section_class}\"><h2>{inline(section_title)} <span class=\"badge pass\">{badge}</span></h2>")
                open_section = True
              elif stripped.startswith("### "):
                close_step()
                out.append(f"<div class=\"step\"><h3>{inline(stripped[4:])}</h3>")
                open_step = True
              elif stripped.startswith("- "):
                if not in_ul:
                  out.append("<ul>")
                  in_ul = True
                out.append(f"<li>{inline(stripped[2:])}</li>")
              elif re.match(r"^\d+\.\s+", stripped):
                if not in_ol:
                  out.append("<ol>")
                  in_ol = True
                out.append(f"<li>{inline(re.sub(r'^\d+\.\s+', '', stripped))}</li>")
              else:
                out.append(f"<p>{inline(stripped)}</p>")
              i += 1
            if in_code:
              out.append("<pre><code>" + html.escape("\n".join(code_lines)) + "</code></pre>")
            close_section()
            return "\n".join(out)

          body = render_markdown(text)
          dest.joinpath("index.html").write_text(f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Scale Audit Fix E2E Report</title>
            <style>
              :root {{ color-scheme: light dark; }}
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                max-width: 980px;
                margin: 0 auto;
                padding: 32px 20px 80px;
                line-height: 1.5;
                color: #1a1f24;
                background: #f5f7f9;
              }}
              @media (prefers-color-scheme: dark) {{
                body {{ color: #e6e9ec; background: #14181c; }}
              }}
              h1 {{ font-size: 1.6rem; margin-bottom: 4px; }}
              .subtitle {{ color: #5b6770; margin-top: 0; }}
              @media (prefers-color-scheme: dark) {{ .subtitle {{ color: #9aa7b0; }} }}
              .summary {{
                display: flex; gap: 16px; flex-wrap: wrap; margin: 20px 0 32px;
              }}
              .summary .tile {{
                flex: 1 1 140px;
                border-radius: 10px;
                padding: 14px 16px;
                background: #ffffff;
                border: 1px solid #e1e6ea;
              }}
              @media (prefers-color-scheme: dark) {{
                .summary .tile {{ background: #1d2328; border-color: #2b333a; }}
              }}
              .summary .tile .n {{ font-size: 1.6rem; font-weight: 700; display: block; }}
              .summary .tile.pass .n {{ color: #1f8a4c; }}
              .summary .tile.warn .n {{ color: #a66500; }}
              section.story {{
                background: #ffffff;
                border: 1px solid #e1e6ea;
                border-left: 5px solid #1f8a4c;
                border-radius: 12px;
                padding: 20px 24px;
                margin-bottom: 28px;
              }}
              @media (prefers-color-scheme: dark) {{
                section.story {{ background: #1d2328; border-color: #2b333a; border-left-color: #1f8a4c; }}
              }}
              section.story.caution {{ border-left-color: #a66500; }}
              .story h2 {{ margin: 0 0 6px; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }}
              .badge {{
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                padding: 3px 9px;
                border-radius: 999px;
                color: #fff;
                background: #1f8a4c;
              }}
              .story.caution .badge {{ background: #a66500; }}
              .step {{ margin-top: 18px; padding-top: 14px; border-top: 1px dashed #dfe4e8; }}
              @media (prefers-color-scheme: dark) {{ .step {{ border-top-color: #2b333a; }} }}
              .step h3 {{ margin: 0 0 4px; font-size: 1rem; }}
              p, li {{ color: #444d54; }}
              @media (prefers-color-scheme: dark) {{ p, li {{ color: #b7c0c7; }} }}
              code {{
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.88em;
                background: rgba(127,127,127,0.14);
                border-radius: 4px;
                padding: 1px 4px;
              }}
              pre {{
                background: rgba(127,127,127,0.10);
                border: 1px solid #e1e6ea;
                border-radius: 10px;
                padding: 12px 14px;
                overflow-x: auto;
              }}
              @media (prefers-color-scheme: dark) {{ pre {{ border-color: #2b333a; }} }}
              pre code {{ background: transparent; padding: 0; }}
              footer {{ color: #8a949c; font-size: 0.8rem; margin-top: 40px; }}
            </style>
          </head>
          <body>
            <h1>Scale Audit Fix E2E Report</h1>
            <p class="subtitle">Generated 2026-07-11 &middot; context/execution/scale-audit-fix-e2e-report-2026-07-11.md</p>
            <div class="summary">
              <div class="tile"><span class="n">3</span>scale risks covered</div>
              <div class="tile pass"><span class="n">3</span>fixed or gated</div>
              <div class="tile pass"><span class="n">0</span>failed checks</div>
              <div class="tile warn"><span class="n">1</span>1M certification pending</div>
            </div>
            {body}
            <footer>Published by .github/workflows/pages.yml as a first-class CI report category.</footer>
          </body>
          </html>
          """, encoding="utf-8")
          PY
      - name: Job summary
        run: |
          {
            echo "### Scale audit fix E2E report"
            echo "Published local/backend E2E proof and explicit staging-certification boundary."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scale-audit-e2e-report
          path: pages/scale-audit-e2e-report/index.html
          retention-days: 14

  publish:
    needs: [mobile-screenshots, nav-graph, e2e-report, e2e-hrms-report, scale-audit-e2e-report]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Assemble the combined site
        run: |
          mkdir -p _site/screenshot-gallery _site/nav-graph _site/e2e-report _site/e2e-hrms-report _site/scale-audit-e2e-report
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>Goat OS Android + vaccination kernel — CI reports</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            :root{color-scheme:dark light}
            body{margin:0;padding:40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              background:#0a0f0c;color:#e7ede9}
            h1{font-size:22px;margin:0 0 22px}
            a.card{display:block;background:#0d1310;border:1px solid #232b26;border-radius:14px;
              padding:18px 20px;margin-bottom:14px;color:#e7ede9;text-decoration:none;max-width:460px}
            a.card:hover{border-color:#8ad457}
            a.card b{color:#8ad457;font-size:15px}
            a.card p{margin:6px 0 0;font-size:13px;color:#8aa196}
          </style></head><body>
          <h1>Goat OS — CI reports</h1>
          <a class="card" href="screenshot-gallery/index.html"><b>Mobile screenshot gallery</b>
            <p>Every screen, rendered fresh via Paparazzi.</p></a>
          <a class="card" href="nav-graph/index.html"><b>Mobile nav-graph</b>
            <p>Compose Navigation routes + navigate() edges.</p></a>
          <a class="card" href="e2e-report/index.html"><b>Vaccination kernel-story E2E report</b>
            <p>${{ needs.e2e-report.outputs.passed }}/${{ needs.e2e-report.outputs.total }} stories: core kernel behavior plus event-driven-chain + edge-dataset coverage.</p></a>
          <a class="card" href="e2e-hrms-report/index.html"><b>HRMS roster/RBAC kernel-story E2E report</b>
            <p>${{ needs.e2e-hrms-report.outputs.passed }}/${{ needs.e2e-hrms-report.outputs.total }} stories: position → leave → effective-backup coverage → temporary execute capability → vaccination-owner resolution / escalation.</p></a>
          <a class="card" href="scale-audit-e2e-report/index.html"><b>Scale/performance E2E report</b>
            <p>Scale-audit fixes, latency gates, and the explicit 1M staging-certification boundary.</p></a>
          </body></html>
          HTML
      - uses: actions/download-artifact@v4
        with:
          name: screenshot-gallery
          path: _site/screenshot-gallery
      - uses: actions/download-artifact@v4
        with:
          name: nav-graph
          path: _site/nav-graph
      - uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: _site/e2e-report
      - uses: actions/download-artifact@v4
        with:
          name: e2e-hrms-report
          path: _site/e2e-hrms-report
      - uses: actions/download-artifact@v4
        with:
          name: scale-audit-e2e-report
          path: _site/scale-audit-e2e-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

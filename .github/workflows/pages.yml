name: pages

# Publishes three CI-generated reports to GitHub Pages, combined under one site:
#   /screenshot-gallery/  Paparazzi golden images for every mobile screen (:app ScreenshotTest)
#                         plus every role's nav chrome + landing (:app RoleChromeScreenshotTest)
#   /nav-graph/           Compose Navigation routes + navigate() edges (Mermaid)
#   /e2e-report/          Backend vaccination kernel-story E2E report (story count grows over time —
#                         read from the generated report itself, never hardcoded here; see e2e-report
#                         job's "Compute story count from the generated report" step)
# Runs on every push to main that touches the relevant paths, AND on a daily cron so the
# screenshot gallery and E2E report stay fresh even without a code change (data/timing drift,
# flaky-test detection). See docs/runbooks/github-workflows.md.
#
# Requires one-time repo setup: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (not "Deploy from a branch"). Until that is set, the deploy job will fail
# with a "Pages site not found" / environment error even though the report-building jobs above
# it succeed — the artifacts are still downloadable from the failed run's Summary either way.

on:
  push:
    branches: [main]
    paths:
      - "apps/goatos-android/**"
      - "backend/tests/e2e/**"
      - "backend/internal/**"
      - "tools/android/generate-nav-graph.py"
      - "tools/android/build-screenshot-gallery.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 03:00 UTC daily — screenshot gallery + E2E report (the two jobs the task calls out for a
    # daily run; nav-graph is cheap to regenerate every run too so it stays in the same publish).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mobile-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses + install platform for compileSdk 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Render every screen's + role's Paparazzi golden (fresh, not just verify)
        working-directory: apps/goatos-android
        run: ./gradlew :app:recordPaparazziDevDebug --no-configuration-cache --stacktrace
      - name: Build the screenshot gallery HTML
        run: python3 tools/android/build-screenshot-gallery.py
      - name: Job summary
        run: |
          {
            echo "### Mobile screenshot gallery"
            echo "12 screens + 6 role-chrome variants (CEO, CEO w/ drawer, Director, Park Head, Park Manager, Operator) rendered — see the Pages artifact \`screenshot-gallery\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-gallery
          path: apps/goatos-android/docs/screenshot-gallery/index.html
          retention-days: 14

  nav-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Compose nav-graph diagram
        run: python3 tools/android/generate-nav-graph.py
      - name: Job summary
        run: |
          {
            echo "### Mobile nav-graph"
            echo "Regenerated from AppNavHost.kt's hand-verified routes/edges."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nav-graph
          path: apps/goatos-android/docs/nav-graph/index.html
          retention-days: 14

  e2e-report:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    outputs:
      total: ${{ steps.story_count.outputs.total }}
      passed: ${{ steps.story_count.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the vaccination kernel-story E2E harness
        working-directory: backend
        run: go test ./tests/e2e/... -run TestKernelStor -v
      - name: Compute story count from the generated report
        id: story_count
        # Never hardcode the story count here -- read it from the report's own summary tiles
        # (rendered by backend/tests/e2e/report.go) so this workflow can't drift stale as stories
        # are added or removed.
        run: |
          report="backend/tests/e2e/report/index.html"
          total=$(grep -oE '<div class="tile"><span class="n">[0-9]+</span>stories</div>' "$report" | grep -oE '[0-9]+')
          passed=$(grep -oE '<div class="tile pass"><span class="n">[0-9]+</span>stories passed</div>' "$report" | grep -oE '[0-9]+')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: Job summary
        run: |
          {
            echo "### Vaccination kernel-story E2E report"
            echo "${{ steps.story_count.outputs.passed }}/${{ steps.story_count.outputs.total }} stories — see the Pages artifact \`e2e-report\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: backend/tests/e2e/report/index.html
          retention-days: 14

  e2e-hrms-report:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    outputs:
      total: ${{ steps.story_count.outputs.total }}
      passed: ${{ steps.story_count.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the HRMS roster/RBAC kernel-story E2E harness
        working-directory: backend
        run: go test ./tests/e2e-hrms/... -run TestHRMS -v
      - name: Compute story count from the generated report
        id: story_count
        # Never hardcode the story count here -- read it from the report's own summary tiles
        # (rendered by backend/tests/e2e-hrms/report.go) so this workflow can't drift stale as
        # stories are added or removed.
        run: |
          report="backend/tests/e2e-hrms/report/index.html"
          total=$(grep -oE '<div class="tile"><span class="n">[0-9]+</span>stories</div>' "$report" | grep -oE '[0-9]+')
          passed=$(grep -oE '<div class="tile pass"><span class="n">[0-9]+</span>stories passed</div>' "$report" | grep -oE '[0-9]+')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: Job summary
        run: |
          {
            echo "### HRMS roster/RBAC kernel-story E2E report"
            echo "${{ steps.story_count.outputs.passed }}/${{ steps.story_count.outputs.total }} stories — see the Pages artifact \`e2e-hrms-report\` below once deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-hrms-report
          path: backend/tests/e2e-hrms/report/index.html
          retention-days: 14

  publish:
    needs: [mobile-screenshots, nav-graph, e2e-report, e2e-hrms-report]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Assemble the combined site
        run: |
          mkdir -p _site/screenshot-gallery _site/nav-graph _site/e2e-report _site/e2e-hrms-report
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>Goat OS Android + vaccination kernel — CI reports</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            :root{color-scheme:dark light}
            body{margin:0;padding:40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              background:#0a0f0c;color:#e7ede9}
            h1{font-size:22px;margin:0 0 22px}
            a.card{display:block;background:#0d1310;border:1px solid #232b26;border-radius:14px;
              padding:18px 20px;margin-bottom:14px;color:#e7ede9;text-decoration:none;max-width:460px}
            a.card:hover{border-color:#8ad457}
            a.card b{color:#8ad457;font-size:15px}
            a.card p{margin:6px 0 0;font-size:13px;color:#8aa196}
          </style></head><body>
          <h1>Goat OS — CI reports</h1>
          <a class="card" href="screenshot-gallery/index.html"><b>Mobile screenshot gallery</b>
            <p>Every screen, rendered fresh via Paparazzi.</p></a>
          <a class="card" href="nav-graph/index.html"><b>Mobile nav-graph</b>
            <p>Compose Navigation routes + navigate() edges.</p></a>
          <a class="card" href="e2e-report/index.html"><b>Vaccination kernel-story E2E report</b>
            <p>${{ needs.e2e-report.outputs.passed }}/${{ needs.e2e-report.outputs.total }} stories: core kernel behavior plus event-driven-chain + edge-dataset coverage.</p></a>
          <a class="card" href="e2e-hrms-report/index.html"><b>HRMS roster/RBAC kernel-story E2E report</b>
            <p>${{ needs.e2e-hrms-report.outputs.passed }}/${{ needs.e2e-hrms-report.outputs.total }} stories: position → leave → effective-backup coverage → temporary execute capability → vaccination-owner resolution / escalation.</p></a>
          </body></html>
          HTML
      - uses: actions/download-artifact@v4
        with:
          name: screenshot-gallery
          path: _site/screenshot-gallery
      - uses: actions/download-artifact@v4
        with:
          name: nav-graph
          path: _site/nav-graph
      - uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: _site/e2e-report
      - uses: actions/download-artifact@v4
        with:
          name: e2e-hrms-report
          path: _site/e2e-hrms-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

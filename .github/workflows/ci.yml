name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent guardrails
        run: |
          bash tools/agent-hooks/check-boundaries.sh
          bash tools/agent-hooks/check-contract-drift.sh
      - name: Large file guard
        run: |
          found="$(find . -type f -size +5M \
            -not -path './.git/*' \
            -not -name 'package-lock.json' \
            -not -name 'pnpm-lock.yaml' \
            -print)"
          if [ -n "$found" ]; then
            echo "$found"
            echo "Files above 5MB need an explicit storage decision."
            exit 1
          fi
      - name: Go tests
        run: |
          if [ -f backend/go.mod ]; then
            cd backend
            go test ./...
          fi

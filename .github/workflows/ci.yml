name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install guardrail tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Agent guardrails
        run: |
          bash tools/agent-hooks/check-boundaries.sh
          bash tools/agent-hooks/check-contract-drift.sh
      - name: Large file guard
        run: |
          found="$(find . -type f -size +5M \
            -not -path './.git/*' \
            -not -name 'package-lock.json' \
            -not -name 'pnpm-lock.yaml' \
            -print)"
          if [ -n "$found" ]; then
            echo "$found"
            echo "Files above 5MB need an explicit storage decision."
            exit 1
          fi
      - name: Go tests
        run: |
          if [ -f backend/go.mod ]; then
            cd backend
            go test ./...
          fi
      - name: Install pinned sqlc
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"$(cat tools/sqlc/sqlc.version)"
          "$(go env GOPATH)/bin/sqlc" version
      - name: SQL and migration validation
        run: |
          make sqlc-check
          make validate-sqlc-plans
          make validate-migrations
          git diff --check

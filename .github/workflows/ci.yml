name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      GOATOS_POSTGRES_IMAGE: postgres:16.9-alpine
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mobile-guard diffs against origin/main to scope to changed mobile files
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install guardrail tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Install pinned sqlc
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"$(cat tools/sqlc/sqlc.version)"
          "$(go env GOPATH)/bin/sqlc" version
      - name: Required guardrails — same runner used locally
        env:
          MOBILE_GUARD_BASE: origin/${{ github.base_ref || 'main' }}
          TELEMETRY_GUARD_BASE: origin/${{ github.base_ref || 'main' }}
        run: make ci-local JOB=guardrails

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Required admin-web gates — same runner used locally
        run: make ci-local JOB=admin-web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest ships the Android SDK and presets ANDROID_HOME/ANDROID_SDK_ROOT,
      # which run-local-ci's android job consumes (JDK 21 runs Gradle/AGP; app
      # bytecode stays Java/Kotlin 17). No USB device is required for compile+unit.
      - name: Required android gates — same runner used locally
        run: make ci-local JOB=android

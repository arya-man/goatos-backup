<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Before</title><style>
:root{--bg:#0e1813;--line:#203329;--ink:#edf5ef;--muted:#a9b5ae;--info:#5d9de8;--ok:#79d242;--teal:#36c5aa}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.main{width:390px;min-height:844px;background:var(--bg);padding:24px 0}.mt{font-size:18px;line-height:1.2;margin:24px 18px 6px;color:var(--ink)}.gleg{display:flex;gap:10px;flex-wrap:wrap;padding:9px 14px 0;font-size:11px;color:var(--muted)}.gleg .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--info)}.gleg .sw.ok{background:var(--ok)}.gleg .sw.teal{background:var(--teal)}.gcols{display:flex;align-items:stretch;gap:10px;padding:118px 14px 14px;overflow-x:auto}.gcol{position:relative;flex:0 0 92px;min-width:92px;display:flex;flex-direction:column;align-items:center}.gcarea{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:116px;width:100%;border-bottom:1px solid var(--line);padding-top:18px}.gcb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:0 0 auto;min-width:16px}.gcb.gcempty{visibility:hidden}.gcval{font-size:9.5px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.1;margin-bottom:3px;font-variant-numeric:tabular-nums}.gcbar{display:block;flex:0 0 auto;width:16px;border-radius:3px 3px 0 0;background:var(--info)}.gcbar.info{background:var(--info)}.gcbar.ok{background:var(--ok)}.gcbar.teal{background:var(--teal)}.gcbar.none{background:transparent}.gclab{font-size:9px;color:var(--muted);margin-top:5px;white-space:nowrap;line-height:1.2}.gcsub{font-size:9px;font-weight:600;color:var(--ink);opacity:.72;margin-top:2px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}.divider{height:6px;background:#35577f;margin:22px 14px}
</style></head><body><main class="main">

<section><div class="mt">Fattening days on farm</div><div class="gleg"><span><span class="sw teal"></span>Days from arrival to sale</span><span><span class="sw"></span>Days on farm so far</span></div><div class="gcols"><div class="gcol"><span class="gcarea"><span class="gcb gcempty" aria-hidden="true"><span class="gcbar none"></span></span><span class="gcb"><span class="gcval">21</span><span class="gcbar info" style="height:68%"></span></span></span><span class="gclab">130</span><span class="gcsub">Green Fresh Farm</span></div><div class="gcol"><span class="gcarea"><span class="gcb gcempty" aria-hidden="true"><span class="gcbar none"></span></span><span class="gcb"><span class="gcval">19</span><span class="gcbar info" style="height:61%"></span></span></span><span class="gclab">128</span><span class="gcsub">Krishnamorrthy</span></div><div class="gcol"><span class="gcarea"><span class="gcb gcempty" aria-hidden="true"><span class="gcbar none"></span></span><span class="gcb"><span class="gcval">24</span><span class="gcbar info" style="height:77%"></span></span></span><span class="gclab">126</span><span class="gcsub">Ramesh Reddy</span></div></div></section>
</main></body></html>
